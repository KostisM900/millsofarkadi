<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Φάκελοι | Μύλοι Αρκαδίου</title>
<link rel="icon" id="favicon" type="image/png" href="https://m-m-m.gr/wp-content/uploads/2024/04/logo-150.png">
<link rel="apple-touch-icon" id="touchIcon" href="https://m-m-m.gr/wp-content/uploads/2024/04/logo-150.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== BRAND TOKENS (ίδια με το εσωτερικό σύστημα / m-m-m.gr) ===== */
:root{
  --white:#FFFFFF; --bg:#FBFBF8; --line:#E8E6DD; --line-2:#F2F1EC;
  --olive:#7D8A4E; --olive-dark:#66713F; --olive-deep:#545E33; --olive-tint:#F1F3E8;
  --wheat:#C6913C; --wheat-dark:#94691F; --wheat-tint:#F8EFDD;
  --red:#A63E3A; --red-tint:#F7E8E7;
  --ink:#3B3B33; --muted:#75746A;
  --radius:10px;
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
[hidden]{display:none!important}

/* ===== HEADER ===== */
.topbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-in{max-width:980px;margin:0 auto;height:66px;padding:0 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{height:46px;width:auto;max-width:120px;object-fit:contain}
.brand-fallback{width:40px;height:40px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.bt{line-height:1.2}
.bt b{display:block;font-size:14.5px;font-weight:700}
.bt span{font-size:10.5px;letter-spacing:.14em;color:var(--olive-dark);font-weight:700}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0}
.nav-btn{position:relative;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;border-radius:6px;display:inline-flex;align-items:center;gap:7px}
.nav-btn:hover,.nav-btn.active{color:var(--olive-dark)}
.nav-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:2px;background:var(--olive);border-radius:2px}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;line-height:1}
.save-err{font-size:12px;color:var(--red);font-weight:700}
@media (max-width:600px){
  .topbar-in{height:58px;padding:0 14px;gap:8px}
  .brand img{height:38px}
  .bt{display:none}
  .nav-btn{padding:9px 10px}
}

/* ===== NOTIFICATION BAR ===== */
.notif-bar{background:var(--olive-tint);border-bottom:1px solid #DFE3CF}
.notif-bar.warn{background:var(--wheat-tint);border-bottom-color:#EEDDB9}
.notif-in{max-width:980px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;font-size:13.5px}
.notif-in p{flex:1}

/* ===== LAYOUT ===== */
.main{max-width:980px;margin:0 auto;padding:34px 24px 90px}
@media (max-width:600px){.main{padding:22px 14px 80px}.notif-in{padding:10px 14px}}
.view{display:none}
.view.active{display:block}
.greet{margin-bottom:22px}
.greet h1{font-size:clamp(26px,3.6vw,34px);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.greet p{margin-top:8px;font-size:15.5px}
.greet .date{color:var(--muted)}
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sec-h h2{font-size:13px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h.bad h2{color:var(--red)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.empty{border:1px dashed #D9D6C9;border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center;background:var(--white)}

/* ===== BUTTONS / INPUTS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13.5px;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn.primary{background:var(--olive-dark);color:#fff}
.btn.primary:hover{background:var(--olive-deep)}
.btn.ghost{border:1px solid var(--line);background:var(--white)}
.btn.ghost:hover{border-color:var(--olive);color:var(--olive-deep)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red);border:1px solid #E9CFCD;background:var(--white)}
.btn.danger-ghost:hover{background:var(--red-tint)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#A9A79B;font-size:19px;line-height:1;flex-shrink:0}
.icon-btn:hover{background:var(--red-tint);color:var(--red)}
.inp{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 11px;font-size:14px;min-width:0}
.inp:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px var(--olive-tint)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--muted)}
.f .inp{width:100%}

/* ===== ΠΡΟΣΘΗΚΗ ===== */
.add-card{padding:18px;margin-bottom:32px}
.add-grid{display:grid;grid-template-columns:1.6fr auto auto;gap:10px;align-items:end}
.when{display:flex;gap:6px;align-items:center}
.when .inp{width:150px}
@media (max-width:760px){.add-grid{grid-template-columns:1fr}.when .inp{flex:1;width:auto}}
.hint{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
.hint b{color:var(--ink)}
.hint .bad{color:var(--red);font-weight:600}

/* ===== ΦΑΚΕΛΟΣ (κάρτα σημερινών) ===== */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.env{
  position:relative;background:var(--white);border:1px solid var(--line);border-radius:3px 3px 8px 8px;
  padding:70px 18px 18px;display:flex;flex-direction:column;text-align:center;
  box-shadow:0 12px 26px -20px rgba(59,59,51,.5);transition:opacity .2s,transform .2s;
}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:44px;background:var(--wheat-tint);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{
  content:"";position:absolute;left:0;right:0;top:0;height:44px;pointer-events:none;
  background:
    linear-gradient(to top right,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) left top/50% 100% no-repeat,
    linear-gradient(to top left,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) right top/50% 100% no-repeat;
}
.seal{position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);z-index:1;width:36px;height:36px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--white),0 0 0 5px var(--line)}
.seal svg{width:17px;height:17px}
.env h3{font-size:16.5px;font-weight:700;line-height:1.3}
.env .since{color:var(--muted);font-size:12.5px;margin:4px 0 16px}
.env .btn{margin-top:auto}
.leaving{opacity:0;transform:translateY(-8px)}

/* ===== ΓΡΑΜΜΕΣ ===== */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.rows.bad{border-color:#EBD3D1;background:#FFFCFB}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;transition:opacity .2s,transform .2s;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.r-main{flex:1;min-width:170px}
.r-main b{font-weight:700}
.r-main small{display:block;color:var(--muted);font-size:12.5px}
.row input[type=date]{padding:6px 8px;font-size:13px;width:150px}
.given{margin-top:10px}
.given summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);padding:6px 0}
.given summary:hover{color:var(--ink)}
.given .rows{margin-top:8px}

/* ===== ΡΥΘΜΙΣΕΙΣ ===== */
.page-h{margin-bottom:22px}
.page-h h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.set{padding:18px 20px;margin-bottom:14px;max-width:680px}
.set h3{font-size:15px;font-weight:700;margin-bottom:10px}
.set p{color:var(--muted);font-size:13.5px;margin-bottom:12px;max-width:62ch}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.set-row.first{border-top:0;padding-top:4px}
.sr-t{flex:1;min-width:200px}
.sr-t b{display:block;font-weight:600}
.sr-t small{color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;margin-bottom:12px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.state.ok::before{background:var(--olive)}
.state.bad::before{background:var(--red)}
.state.wait::before{background:var(--wheat)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#D9D6C9;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--olive-dark)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--olive);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:3px 5px 3px 11px;font-size:12.5px;font-weight:600}
.chip button{width:20px;height:20px;border-radius:50%;color:#A9A79B;line-height:1;font-size:15px}
.chip button:hover{background:var(--red-tint);color:var(--red)}

/* ===== TOASTS ===== */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:12px 8px 12px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);animation:tin .2s ease}
.toast.alert{background:var(--white);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--wheat)}
.t-msg{flex:1;padding-top:1px}
.t-act{font-weight:700;color:#E8C27E;padding:2px 6px;white-space:nowrap}
.t-x{opacity:.65;font-size:18px;line-height:1;padding:0 6px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:600px){.toasts{right:12px;left:12px;bottom:12px;width:auto}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.env,.row{transition:none}}

/* ===== ΣΥΝΔΕΣΗ ===== */
.login{max-width:400px;margin:clamp(24px,7vh,64px) auto 0;padding:0;overflow:hidden}
.login-top{text-align:center;padding:30px 28px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.login img{height:64px;width:auto;object-fit:contain;display:block;margin:0 auto 14px}
.login img[alt]:not([src]),.login img:-moz-broken{display:none}
.login h1{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:0}
.login-form{padding:24px 28px 26px;display:flex;flex-direction:column;gap:14px}
.login .f{text-align:left;margin:0}
.login .f > span{font-size:11.5px;letter-spacing:.04em}
.login .inp{padding:11px 12px}
.login .btn{margin-top:4px;padding:12px 16px}
.login .hint{text-align:left;margin:0;min-height:0}
.login .hint:empty{display:none}
.net{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.net{color:var(--red)}
@media (max-width:600px){.net span{display:none}}

/* ===== ΑΝΑΖΗΤΗΣΗ ===== */
.search{position:relative;margin:-14px 0 10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search .inp{width:100%;padding-left:38px;background:var(--white)}
.q-info{font-size:14px;margin:0 0 22px}
.q-info b{color:var(--olive-deep)}
#lists{margin-top:22px}
/* ===== ΟΝΟΜΑ / ΠΟΛΛΟΙ ΦΑΚΕΛΟΙ ===== */
.name-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:inherit;border-radius:5px}
.name-btn svg{width:13px;height:13px;color:#B8B6AA;flex-shrink:0;opacity:0;transition:opacity .15s}
.name-btn:hover svg,.name-btn:focus-visible svg{opacity:1}
.name-btn:hover{color:var(--olive-deep)}
@media (hover:none){.name-btn svg{opacity:1}}
.seal b{font-size:14px;font-weight:800}
.env .count{font-weight:700;color:var(--wheat-dark);font-size:13px;margin-top:2px}
.pill{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--wheat-tint);color:var(--wheat-dark);vertical-align:1px}
.chip-name{font:inherit;font-weight:600}
.chip-name:hover{color:var(--olive-deep);text-decoration:underline}
/* ===== MODAL ===== */
.modal-back{position:fixed;inset:0;background:rgba(40,40,34,.38);z-index:95;display:flex;align-items:flex-start;justify-content:center;padding:min(10vh,72px) 16px 24px;overflow-y:auto}
.modal{position:relative;background:var(--white);border-radius:14px;width:100%;max-width:480px;padding:22px 24px 18px;box-shadow:0 30px 60px -20px rgba(40,40,34,.4)}
.m-x{position:absolute;top:12px;right:12px}
.m-x:hover{background:var(--line-2);color:var(--ink)}
.m-eyebrow{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.modal h2{font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.005em;padding-right:36px;overflow-wrap:anywhere}
.m-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--muted);font-size:12.5px;margin:8px 0 18px;padding-bottom:16px;border-bottom:1px solid var(--line-2)}
.m-field{margin-bottom:14px}
.m-meta .slot{margin-left:0}
.m-field .seg{display:flex;width:100%}
.m-field .seg button{flex:1;padding:10px 12px;font-size:13.5px}
.m-hint{margin-top:-6px}
.m-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.m-sp{flex:1}
.btn.link-danger{color:var(--red);padding:8px 2px;background:none;font-weight:700}
.btn.link-danger:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:460px){
  .modal{padding:20px 18px 16px}
  .m-f{flex-direction:column-reverse;align-items:stretch}
  .m-f .btn{width:100%}
  .m-sp{display:none}
  .btn.link-danger{padding:10px 0}
}

/* ===== ΕΙΔΟΣ & ΣΧΟΛΙΟ ===== */
.add-grid{grid-template-columns:minmax(200px,1.4fr) auto auto}
.add-grid .f-note{grid-column:1 / 3}
@media (max-width:860px){.add-grid{grid-template-columns:1fr 1fr}.add-grid .f-note{grid-column:1 / -1}.add-grid > label:first-child{grid-column:1 / -1}}
@media (max-width:560px){.add-grid{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{padding:8px 13px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--olive-dark);color:#fff}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-14px 0 10px}
.search-row .search{flex:1;min-width:220px;margin:0}
.ktag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:5px;flex-shrink:0}
.ktag.timologio{background:var(--olive-tint);color:var(--olive-deep)}
.ktag.apodeixi{background:var(--wheat-tint);color:var(--wheat-dark)}
.ktag.none{background:var(--line-2);color:var(--muted)}
.items{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.env .items{margin:10px 0 2px;align-items:center}
.item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 6px;margin-left:-6px;border-radius:6px;text-align:left;max-width:100%}
.env .item{margin-left:0}
.item:hover{background:var(--line-2)}
.item .note{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.item .note.add{color:#ADAB9F}
.item svg{width:12px;height:12px;color:#B8B6AA;flex-shrink:0}
.modal textarea.inp{width:100%;resize:vertical;font:inherit;font-size:14px;min-height:78px}

/* ===== ΗΜΕΡΟΜΗΝΙΑ (τύπου SoftOne) ===== */
.dinp{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.when .dinp{width:130px}
.row .dinp{width:112px;padding:6px 9px;font-size:13px}
.dprev{display:block;font-size:12px;color:var(--olive-deep);font-weight:600;min-height:17px;margin-top:3px}
.dprev.bad{color:var(--red)}


/* ===== ΜΗΝΥΜΑ «ΥΠΑΡΧΕΙ ΗΔΗ ΦΑΚΕΛΟΣ» ===== */
.notice{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 14px;border-radius:9px;background:var(--wheat-tint);border:1px solid #EEDDB9;color:var(--ink);font-size:13.5px;line-height:1.5}
.notice svg{width:18px;height:18px;color:var(--wheat-dark);flex-shrink:0;margin-top:1px}
.notice b{color:var(--wheat-dark)}
#aHint.hint{margin-top:10px}
.given-kinds{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}

/* ===== STAND ===== */
.slot{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;padding:2px 7px;border-radius:5px;background:var(--ink);color:#fff;margin-left:8px;vertical-align:1px;white-space:nowrap}
.env .slot{margin:6px auto 0;display:table}
.stand-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.slot-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.slot-card header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--bg)}
.slot-l{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1}
.slot-n{font-size:12px;color:var(--muted);font-weight:600}
.slot-card.empty{opacity:.55}
.slot-card.empty header{border-bottom:0}
.slot-card ol{list-style:none;counter-reset:s;padding:6px 0}
.slot-card li{counter-increment:s;display:grid;grid-template-columns:22px 1fr;column-gap:6px;padding:6px 14px}
.slot-card li::before{content:counter(s) ".";grid-row:1 / span 2;color:var(--muted);font-size:12px;font-weight:700;padding-top:2px}
.slot-card li b{font-weight:700;font-size:14px}

/* ===== ΕΚΤΥΠΩΣΗ ===== */

  #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt}
  #printArea td{padding:3pt 4pt;border-bottom:.5pt solid #bbb;vertical-align:top}
  #printArea .p-n{width:18pt;color:#555}

  .p-label{border:1pt dashed #999;height:34mm;display:flex;align-items:center;justify-content:center;break-inside:avoid}
  .p-label span{font-size:40pt;font-weight:800;letter-spacing:1pt}
}

.slot-num{font-size:12px;font-weight:800;color:#fff;background:var(--olive-dark);border-radius:5px;padding:2px 7px;align-self:center}

.move-card li{margin-bottom:3px}
.p-label{flex-direction:column;gap:2pt}
.p-label small{font-size:9pt;color:#555}

.stand-slots{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
@media (max-width:760px){.stand-slots{grid-template-columns:1fr}}
.slot-note{font-size:11.5px;color:var(--muted);padding:6px 14px 0}

/* ===== ΕΥΡΕΤΗΡΙΟ ===== */
.idx-bar{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 16px}
.idx-bar button{min-width:30px;height:30px;padding:0 6px;border-radius:7px;font-weight:800;font-size:13px;background:var(--white);border:1px solid var(--line);color:var(--ink)}
.idx-bar button:hover:not(:disabled){border-color:var(--olive);color:var(--olive-deep)}
.idx-bar button.off,.idx-bar button:disabled{color:#CFCDC2;background:transparent;border-color:transparent;cursor:default}
.idx-bar button.on,.idx-bar button.on:hover:not(:disabled){background:var(--olive-dark);border-color:var(--olive-dark);color:#fff}
.idx-bar button.clear{font-weight:700;font-size:12px;color:var(--muted);padding:0 10px;margin-left:4px}
.idx-h{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;border-top:1px solid var(--line-2)}
.rows > .idx-h:first-child{border-top:0}
.idx-h span{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 5px;border-radius:7px;background:var(--olive-tint);color:var(--olive-deep);font-weight:800;font-size:14px}
.idx-h::after{content:"";flex:1;height:1px;background:var(--line-2)}
.idx-h + .row{border-top:0}
.rows.bad .idx-h span{background:var(--red-tint);color:var(--red)}
.idx-h.grid{grid-column:1 / -1;padding:4px 0 0;border-top:0;margin-bottom:-4px}
.idx-h.grid::after{background:var(--line)}
.slot-card li.idx-li{display:flex;align-items:center;gap:8px;padding:8px 14px 2px;counter-increment:none}
.slot-card li.idx-li::before{content:none}
.slot-card li.idx-li span{font-size:12px;font-weight:800;color:var(--olive-deep);background:var(--olive-tint);border-radius:5px;padding:1px 7px}
.slot-card li.idx-li::after{content:"";flex:1;height:1px;background:var(--line-2)}
@media print{ #printArea .p-letter td{font-weight:800;font-size:11pt;padding-top:6pt;border-bottom:1pt solid #000} }

.env-idx{position:absolute;top:8px;left:10px;z-index:1;min-width:24px;height:24px;padding:0 5px;border-radius:6px;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--olive-deep)}
.add-grid{align-items:start}
.add-grid > .btn{align-self:end}
@media (max-width:600px){
  .idx-bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-right:-14px;scrollbar-width:thin}
  .idx-bar button{flex-shrink:0}
}

/* ===== ΑΡΧΕΙΟΘΕΤΗΣΗ ===== */
.nl-short{display:none}
@media (max-width:600px){ .nl-long{display:none} .nl-short{display:inline} .nav-btn{padding:9px 8px;font-size:11.5px} svg.nl-short{width:19px;height:19px;vertical-align:-4px} }

.ocr-prog i,.progress i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .2s}
.review{padding:18px 20px;margin-bottom:26px}

.review-h h2{font-size:18px;font-weight:800}
.review-h p{color:var(--muted);font-size:13px}
.review .notice{margin:0 0 12px}
.review .notice .btn{margin:4px 4px 0 0}
.review-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}

.review-imgs{display:flex;flex-direction:column;gap:10px;position:sticky;top:80px}
.review-imgs img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.rv-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rv-row{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;flex-wrap:wrap}
.rv-row + .rv-row{border-top:1px solid var(--line-2)}
.rv-row.bad{background:var(--red-tint)}
.rv-row.bad .rv-code{border-color:var(--red)}
.rv-n{width:20px;color:var(--muted);font-size:12px;font-weight:700;text-align:right}
.rv-code{width:150px;padding:6px 9px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.rv-date{font-size:12.5px;color:var(--muted);min-width:78px}
.rv-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--line-2);color:var(--muted)}
.rv-tag.warn{background:var(--red-tint);color:var(--red)}
.rv-row .icon-btn{margin-left:auto}
.rv-add{display:flex;gap:8px;margin-top:10px}
.rv-add .inp{flex:1}
.check{padding:18px 20px;margin-bottom:24px}
.check .back{margin-bottom:12px}
.check h2{font-size:19px;font-weight:800}
.check-sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.check-sum{margin:8px 0 14px;font-size:14px}
.check-sum .miss{color:var(--red);font-weight:700}
.check-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chk-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--white)}

.chk-code{font-weight:800;letter-spacing:.03em;font-variant-numeric:tabular-nums;min-width:130px}

.chk-hist .tag.today{background:var(--olive-tint);color:var(--olive-deep)}
.drop.compact{flex-direction:row;padding:12px 16px;gap:10px;margin-bottom:18px}

function parseDateInput(raw){
  const s = String(raw || '').trim();

  const plus = s.match(/^\+\s*(\d{1,3})$/);

function prevWorkDay(dateIso){ let d = fromIso(dateIso); for (let i = 0; i < 7; i++){ d = addDays(d, -1); if (workDays().includes(d.getDay())) return iso(d); } return iso(addDays(fromIso(dateIso), -1)); }
function nextWorkDay(dateIso){ let d = fromIso(dateIso); for (let i = 0; i < 7; i++){ d = addDays(d, 1); if (workDays().includes(d.getDay())) return iso(d); } return iso(addDays(fromIso(dateIso), 1)); }
const pendingFor = name => pending().find(e => norm(e.name) === norm(name)) || null;
const customerNames = () => DB.customers.map(c => c.name);

/* ===================== SUPABASE (χωρίς βιβλιοθήκη, απευθείας REST) ===================== */
class AuthError extends Error {}
class NetError extends Error {}
async function authRequest(grant, body){
  let r;
  try {
    r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  } catch(e){ throw new NetError('net'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new AuthError(j.error_description || j.msg || j.error || 'auth');
  return j;
}
function setSession(j){
  LOCAL.session = {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Date.now() + (Number(j.expires_in) || 3600) * 1000,
    email: (j.user && j.user.email) || (LOCAL.session && LOCAL.session.email) || ''
  };
  saveLocal();
}
let refreshPromise = null;
async function accessToken(){
  const s = LOCAL.session;
  if (!s) throw new AuthError('no session');
  if (Date.now() < s.expires_at - 60000) return s.access_token;
  if (!refreshPromise){
    refreshPromise = authRequest('refresh_token', { refresh_token:s.refresh_token })
      .then(j => { setSession(j); return j.access_token; })
      .finally(() => { refreshPromise = null; });
  }
  return refreshPromise;
}
async function api(path, { method='GET', body, prefer } = {}, retried=false){
  const token = await accessToken();
  const headers = { apikey:SB_KEY, Authorization:`Bearer ${token}` };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (prefer) headers.Prefer = prefer;
  let r;
  try { r = await fetch(`${SB_URL}/rest/v1/${path}`, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new NetError('net'); }
  if (r.status === 401){
    if (retried || !LOCAL.session) throw new AuthError('expired');
    LOCAL.session.expires_at = 0;                        // δοκίμασε μία φορά με ανανεωμένο token
    return api(path, { method, body, prefer }, true);
  }
  if (!r.ok){ const t = await r.text().catch(() => ''); throw new Error(`HTTP ${r.status} ${t.slice(0,200)}`); }
  if (r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const fromRow = r => ({
  id: r.id, name: r.name, date: r.date || '',
  kind: r.kind || '', note: r.note || '',
  addedAt: new Date(r.added_at).toISOString(),
  givenAt: r.given_at ? new Date(r.given_at).toISOString() : null
});
function setOnline(v){ online = v; renderNetBadge(); }
function renderNetBadge(){

  if (!LOCAL.session){ el.hidden = true; return; }

  el.innerHTML = `<span>${live ? 'Ζωντανά' : 'Συγχρονισμός'}</span>`;
}

/* ===== Ζωντανή σύνδεση (Supabase Realtime) =====
   Όταν κάποιος άλλος υπολογιστής αλλάξει κάτι, η βάση το στέλνει αμέσως εδώ και η
   σελίδα ενημερώνεται μόνη της. Αν η σύνδεση πέσει, γυρνάει σε έλεγχο κάθε λίγα δευτερόλεπτα. */
let ws = null, wsTimer = null, wsTries = 0, hbTimer = null, liveRef = 1;
function setLive(v){ if (live === v) return; live = v; renderNetBadge(); }
function wsClose(){
  clearTimeout(wsTimer); clearInterval(hbTimer); wsTimer = hbTimer = null;
  if (ws){ try { ws.onclose = null; ws.close(); } catch(e){} ws = null; }
  setLive(false);
}
async function wsConnect(){
  if (!LOCAL.session || ws) return;
  let token;
  try { token = await accessToken(); } catch(e){ return; }
  const url = SB_URL.replace(/^http/, 'ws') + `/realtime/v1/websocket?apikey=${encodeURIComponent(SB_KEY)}&vsn=1.0.0`;
  let sock;
  try { sock = new WebSocket(url); } catch(e){ return; }
  ws = sock;
  const send = msg => { try { sock.send(JSON.stringify(msg)); } catch(e){} };
  sock.onopen = () => {
    wsTries = 0;
    send({ topic:'realtime:fakeloi', event:'phx_join', ref:String(liveRef++), payload:{
      config:{ broadcast:{ self:false }, presence:{ key:'' },
        postgres_changes:[
          { event:'*', schema:'public', table:'envelopes' },
          { event:'*', schema:'public', table:'customers' },
          { event:'*', schema:'public', table:'archive_docs' },
          { event:'*', schema:'public', table:'archive_checks' }
        ] },
      access_token: token
    } });
    hbTimer = setInterval(() => {
      send({ topic:'phoenix', event:'heartbeat', ref:String(liveRef++), payload:{} });
      accessToken().then(t => send({ topic:'realtime:fakeloi', event:'access_token', ref:String(liveRef++), payload:{ access_token:t } })).catch(() => {});
    }, 25000);
  };
  sock.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.event === 'phx_reply' && m.payload && m.payload.status === 'ok' && !live) setLive(true);
    if (m.event === 'phx_reply' && m.payload && m.payload.status === 'error'){ setLive(false); }
    if (m.event === 'postgres_changes'){
      const table = m.payload && m.payload.data && m.payload.data.table;
      if (table === 'vehicles') scheduleVehicleRefresh();
      else if (table === 'cheques') scheduleChequeRefresh();
      else if (table === 'envelopes' || table === 'customers') scheduleRefresh();
      else if (canArchive()) scheduleArchiveRefresh();
    }
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null; setLive(false);
    if (!LOCAL.session) return;
    wsTries = Math.min(wsTries + 1, 6);
    wsTimer = setTimeout(wsConnect, 1000 * Math.pow(2, wsTries - 1));
  };
  sock.onerror = () => { try { sock.close(); } catch(e){} };
}
/* Μικρή καθυστέρηση: αν έρθουν πολλές αλλαγές μαζί, φορτώνει μία φορά */
/* ===== Αυτόματη αποσύνδεση μετά από αδράνεια =====
   Ο υπολογιστής του γραφείου μένει ανοιχτός· αν κανείς δεν αγγίξει την εφαρμογή για
   τις ώρες που ορίζεις, η συνεδρία κλείνει μόνη της και ζητάει ξανά κωδικό. */
const idleHours = () => Math.min(72, Math.max(0, Number(LOCAL.settings.idleHours ?? 8)));

}

  if (Date.now() - last > idleHours() * 3600000) logout(`Έκλεισε η συνεδρία μετά από ${idleHours()} ${idleHours() === 1 ? 'ώρα' : 'ώρες'} χωρίς χρήση. Συνδέσου ξανά.`);
}

let refreshTimer = null, arcTimer = null;

let refreshing = false;
async function refresh(){
  if (!LOCAL.session || refreshing || pendingOps) return;
  refreshing = true;
  try {
    const [envs, custs] = await Promise.all([
      api('envelopes?select=id,name,date,kind,note,added_at,given_at&order=added_at.asc'),
      api('customers?select=id,name,name_key&order=name.asc')
    ]);
    if (pendingOps) return;   // μην πατήσεις πάνω σε αλλαγή που μόλις έγινε
    const before = DB.envelopes;
    DB.envelopes = (envs || []).map(fromRow);
    DB.customers = (custs || []).map(c => ({ id:c.id, name:c.name, key:c.name_key }));
    setOnline(true); cacheData();
    announceChanges(before, DB.envelopes);
    renderAll(); checkReminders();
    cleanupHistory();
    uppercaseLegacy().then(unifyDates);
    loadCheques(); loadVehicles();
    if (canArchive() && !ARC.loaded && !ARC.loading) loadArchive();
  } catch(e){ handleError(e, 'Δεν ενημερώθηκαν οι φάκελοι.', true); }
  finally { refreshing = false; }
}
/* Άμεση αλλαγή στην οθόνη, αποστολή στη βάση, επιστροφή αν αποτύχει */
async function mutate(apply, request, rollback, errMsg){
  apply(); renderAll();
  pendingOps++;
  try { await request(); setOnline(true); cacheData(); }
  catch(e){ rollback(); renderAll(); handleError(e, errMsg); }
  finally { pendingOps--; }
}
/* Ονόματα που γράφτηκαν με μικρά πριν από αυτή την έκδοση: περνάνε μία φορά σε κεφαλαία */
let upperRunning = false;
async function uppercaseLegacy(){
  const envNames = [...new Set(DB.envelopes.map(e => e.name).filter(n => n !== upper(n)))];
  const custs = DB.customers.filter(c => c.name !== upper(c.name));
  if ((!envNames.length && !custs.length) || upperRunning) return;
  upperRunning = true;
  try {
    for (const n of envNames) await api(`envelopes?name=eq.${encodeURIComponent(n)}`, { method:'PATCH', body:{ name:upper(n) }, prefer:'return=minimal' });
    for (const c of custs) await api(`customers?name_key=eq.${encodeURIComponent(c.key || norm(c.name))}`, { method:'PATCH', body:{ name:upper(c.name) }, prefer:'return=minimal' });
    DB.envelopes.forEach(e => e.name = upper(e.name));
    DB.customers.forEach(c => c.name = upper(c.name));
    cacheData(); renderAll();
  } catch(e){} finally { upperRunning = false; }
}
async function cleanupHistory(){
  if (LOCAL.cleanedOn === todayIso()) return;
  const cutoff = addDays(new Date(), -HISTORY_DAYS).toISOString();
  try {
    // ΜΟΝΟ έγγραφα που έχουν δοθεί (given_at όχι κενό) πριν από 90 μέρες. Όσα είναι ακόμα στο stand δεν σβήνονται ποτέ.
    await api(`envelopes?given_at=not.is.null&given_at=lt.${encodeURIComponent(cutoff)}`, { method:'DELETE' });
    LOCAL.cleanedOn = todayIso(); saveLocal();
  } catch(e){}
}

/* ===================== TOASTS ===================== */
function toast(html, {action=null, sticky=false, kind=''} = {}){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t-msg">${html}</div>`;
  if (action){
    const b = document.createElement('button'); b.className = 't-act'; b.textContent = action.label;
    b.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(b);
  }
  const x = document.createElement('button'); x.className = 't-x'; x.textContent = '×'; x.setAttribute('aria-label','Κλείσιμο');
  x.onclick = () => el.remove(); el.appendChild(x);
  box.appendChild(el);
  const maxToasts = window.innerWidth < 700 ? 2 : 4;
  while (box.children.length > maxToasts) box.firstChild.remove();
  if (!sticky) setTimeout(() => el.remove(), 6500);
}

const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const notifState = () => ('Notification' in window) ? Notification.permission : 'unsupported';
async function enableNotifs(){

                        : 'Οι ειδοποιήσεις δεν επιτράπηκαν. Άλλαξέ το από το εικονίδιο αριστερά της διεύθυνσης.');

function remind(title, body, tag){
  if (notifState() === 'granted'){
    try {
      const n = new Notification(title, { body, tag, icon: LOGO_URLS[0], requireInteraction: true });
      n.onclick = () => { window.focus(); go(homeView()); n.close(); };
    } catch(e){}
  }
  toast(`<b>${esc(title)}</b><br>${esc(body)}`, { sticky:true, kind:'alert' });
}
let actx = null;
function beep(){
  if (!LOCAL.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    [[660,0],[880,.18]].forEach(([f,dt]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(.18, t0+dt+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.35);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+dt); o.stop(t0+dt+.4);
    });
  } catch(e){}
}
document.addEventListener('pointerdown', () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
}, { once:true });

/* Κάθε φάκελος ειδοποιεί μία φορά τη μέρα, σε κάθε υπολογιστή που έχει ανοιχτή την εφαρμογή:
   day = παράδοση σήμερα · eve = παράδοση αύριο · miss = πέρασε η μέρα και είναι ακόμα στο stand */
function checkReminders(){
  if (!LOCAL.session) return;
  const now = new Date(), t = iso(now), tm = tomorrowIso(), mins = now.getHours()*60 + now.getMinutes(), S = LOCAL.settings;
  const due = [];
  const mark = (kind, env) => { const k = `${t}|${kind}|${env.id}`; if (!LOCAL.fired[k]){ LOCAL.fired[k] = 1; due.push({ kind, env }); } };
  pending().forEach(env => {
    if (!env.date) return;
    if (mins >= toMin(S.morningTime)){ if (env.date === t) mark('day', env); else if (env.date < t) mark('miss', env); }
    if (S.eveEnabled && mins >= toMin(S.eveTime) && env.date > t && prevWorkDay(env.date) === t) mark('eve', env);
  });
  /* Οχήματα: στο περιθώριο προειδοποίησης, την ημέρα της λήξης, και κάθε μέρα μετά */
  if (canVehicles() && mins >= toMin(S.morningTime)){
    const vd = [];
    vehDeadlines().forEach(x => {
      const st = vehState(x.due);
      if (st === 'ok') return;
      const kind = st === 'late' ? 'veh-late' : st === 'today' ? 'veh-day' : 'veh-soon';
      const key = `${t}|${kind}|${x.v.id}-${x.kind}`;
      if (kind === 'veh-soon' && ![vehWarnDays(), 14, 7, 3, 1].includes(vehDaysLeft(x.due))) return;
      if (!LOCAL.fired[key]){ LOCAL.fired[key] = 1; vd.push({ kind, x }); }
    });
    if (vd.length){
      saveLocal();
      const fireV = (kind, one, many) => {
        const list = vd.filter(v => v.kind === kind).map(v => v.x);
        if (!list.length) return;
        if (list.length <= 3) list.forEach(x => { const [a4,b4] = one(x); remind(a4, b4, `${kind}-${x.v.id}-${x.kind}`); });
        else { const [a4,b4] = many(list); remind(a4, b4, `${kind}-summary`); }
      };
      const nm = x => `${VEH_KINDS[x.kind]} · ${x.v.plate}`;
      fireV('veh-late', x => [`Έληξε: ${nm(x)}`, `Η λήξη ήταν ${dayLabel(x.due, true)}. Το όχημα δεν επιτρέπεται να κυκλοφορεί.`],
                        l => [`${l.length} λήξεις οχημάτων έχουν περάσει`, l.map(nm).join(', ')]);
      fireV('veh-day',  x => [`Λήγει σήμερα: ${nm(x)}`, `${x.v.name || x.v.plate}.`],
                        l => [`${l.length} λήξεις οχημάτων σήμερα`, l.map(nm).join(', ')]);
      fireV('veh-soon', x => [`Σε ${ageText(vehDaysLeft(x.due))}: ${nm(x)}`, `Λήξη ${dayLabel(x.due, true)}.`],
                        l => [`${l.length} λήξεις οχημάτων πλησιάζουν`, l.map(x => `${nm(x)} (${dayLabel(x.due, true)})`).join(', ')]);
      beep();
    }
  }
  /* Επιταγές: λίγες μέρες πριν, την ημέρα της εξόφλησης, και όσο μένουν εκκρεμείς */
  const chqDue = [];
  if (canCheques() && mins >= toMin(S.morningTime)) chqOpen().forEach(c => {
    const kind = c.due === t ? 'chq-day' : c.due < t ? 'chq-late' : (c.due <= iso(addDays(now, chqPreDays())) ? 'chq-pre' : '');
    if (!kind) return;
    const k = `${t}|${kind}|${c.id}`;
    if (!LOCAL.fired[k]){ LOCAL.fired[k] = 1; chqDue.push({ kind, c }); }
  });
  updateTitle();
  if (chqDue.length){
    saveLocal();
    const fireC = (kind, one, many) => {
      const list = chqDue.filter(x => x.kind === kind).map(x => x.c);
      if (!list.length) return;
      if (list.length <= 3) list.forEach(c => { const [a2,b2] = one(c); remind(a2, b2, `${kind}-${c.id}`); });
      else { const [a2,b2] = many(list); remind(a2, b2, `${kind}-summary`); }
    };
    const days = c => Math.round((fromIso(c.due) - fromIso(t)) / 86400000);
    const cap = c => chqLabel(c).charAt(0).toUpperCase() + chqLabel(c).slice(1);
    fireC('chq-day', c => [`Σήμερα: ${chqLabel(c)}`, `Εξόφληση σήμερα.${c.note ? ' ' + c.note : ''}`],
                     l => [`${l.length} επιταγές εξοφλούνται σήμερα`, l.map(c => `…${c.last4 || '—'}`).join(', ')]);
    fireC('chq-pre', c => [`${days(c) === 1 ? 'Αύριο' : 'Σε ' + ageText(days(c))}: ${chqLabel(c)}`, `Εξόφληση ${dayLabel(c.due, true)}.${c.note ? ' ' + c.note : ''}`],
                     l => [`${l.length} επιταγές τις επόμενες ${ageText(chqPreDays())}`, l.map(c => `…${c.last4 || '—'} (${dayLabel(c.due, true)})`).join(', ')]);
    fireC('chq-late', c => [`${cap(c)}: εκκρεμεί`, `Η ημερομηνία ήταν ${dayLabel(c.due, true)}. Αν έγινε η εξόφληση, πάτα «Εξοφλήθηκε» για να φύγει.`],
                      l => [`${l.length} επιταγές έχουν περάσει`, l.map(c => `…${c.last4 || '—'}`).join(', ')]);
    beep();
  }
  if (!due.length) return;
  saveLocal();
  // ένα μήνυμα ανά φάκελο (πελάτη)· αν είναι πάνω από 3 συνολικά, ένα συγκεντρωτικό ανά είδος

  const notesOf = g => { const ns = g.items.map(e => e.note).filter(Boolean); return ns.length ? ` Σχόλιο: ${ns.join(' / ')}` : ''; };
  fire('day',  g => [`Φάκελος για ${g.name}${inside(g)}`, `Έχει παράδοση σήμερα. Πάρε τον φάκελο${locOf(g)} και δώσ' τον στον οδηγό.${notesOf(g)}`],
               l => [`${l.length} φάκελοι φεύγουν σήμερα`, l.map(g => g.name).join(', ')]);
  fire('eve',  g => [`${dayLabel(g.date)}: φάκελος για ${g.name}${inside(g)}`, `Έχει παράδοση ${g.date === tm ? 'αύριο' : dayLabel(g.date)}. Ετοίμασε τον φάκελο${locOf(g)}.${notesOf(g)}`],

  fire('miss', g => [`Ο φάκελος για ${g.name} είναι ακόμα στο stand`, `Η παράδοση ήταν ${dayLabel(g.date, true)}. Είναι ${slotIn(g.name)}. Αν δόθηκε, πάτα «Δόθηκε». Αλλιώς βάλ' τον στο επόμενο δρομολόγιο.`],
               l => [`${l.length} φάκελοι έμειναν στο stand`, l.map(g => g.name).join(', ')]);
  beep();
}

  const added = after.filter(e => !map.has(e.id));
  const changed = after.filter(e => { const o = map.get(e.id); return o && (o.date !== e.date || o.name !== e.name || o.kind !== e.kind || o.note !== e.note || !!o.givenAt !== !!e.givenAt); });
  const gone = before.filter(e => !after.some(x => x.id === e.id));
  if (!added.length && !changed.length && !gone.length) return;
  const names = list => [...new Set(list.map(e => e.name))].sort((a,b) => a.localeCompare(b,'el'));
  const parts = [];
  const newEnv = names(added).filter(n => !before.some(e => norm(e.name) === norm(n) && !e.givenAt));
  if (newEnv.length) parts.push(`νέος φάκελος: ${newEnv.join(', ')}`);
  else if (added.length) parts.push(`νέο έγγραφο: ${names(added).join(', ')}`);
  const given = changed.filter(e => e.givenAt && !map.get(e.id).givenAt);
  if (given.length) parts.push(`δόθηκε: ${names(given).join(', ')}`);
  const dated = changed.filter(e => e.date !== map.get(e.id).date && !e.givenAt);
  if (dated.length) parts.push(`νέα ημέρα: ${dated.map(e => `${e.name} → ${e.date ? dayLabel(e.date, true) : 'χωρίς ημέρα'}`).filter((v,i,a) => a.indexOf(v) === i).join(', ')}`);
  const other = changed.filter(e => !given.includes(e) && !dated.includes(e));
  if (other.length) parts.push(`ενημερώθηκε: ${names(other).join(', ')}`);
  if (gone.length && !given.length) parts.push(`αφαιρέθηκε: ${names(gone).join(', ')}`);

        <span class="ci-name">${markMatch(it.name, q)}</span>
        ${env.length ? `<span class="ci-tag">φάκελος στο stand · ${esc(slotOf(it.name).label)}</span>` : ''}</button>`;
    }).join('') + `<div class="combo-foot">${names.length > 80 ? `${names.length} πελάτες, γράψε κι άλλο για να περιοριστούν. ` : ''}↑ ↓ για επιλογή, Enter για να το πάρεις, Esc για κλείσιμο. Με * ψάχνεις μέσα στο όνομα.</div>`;
    box.hidden = false; input.setAttribute('aria-expanded', 'true');
    const a = box.querySelector('.combo-item.active'); if (a && a.scrollIntoView) a.scrollIntoView({ block:'nearest' });
  };
  input.addEventListener('input', () => { active = 0; draw(); });
  input.addEventListener('focus', () => { if (norm(input.value) && !box.dataset.suppress) draw(); delete box.dataset.suppress; });
  input.addEventListener('blur', () => setTimeout(close, 120));
  input.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if (box.hidden){ draw(); e.preventDefault(); return; }
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      draw();
    } else if (e.key === 'Enter' && !box.hidden && active >= 0 && items[active]){
      e.preventDefault(); e.stopImmediatePropagation(); pick(active);
    } else if (e.key === 'Escape' && !box.hidden){
      e.preventDefault(); e.stopImmediatePropagation(); close();
    } else if (e.key === 'Tab' && !box.hidden && active >= 0 && items[active] && !items[active].isNew){
      pick(active);
    }
  });
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => { const b = e.target.closest('[data-ci]'); if (b) pick(Number(b.dataset.ci)); });
  return { close, refresh: draw };
}
const idsFilter = ids => ids.length === 1 ? `id=eq.${ids[0]}` : `id=in.(${ids.join(',')})`;

function rememberCustomer(name){

  const c = { id:uuid(), name, key };

    () => api('customers?on_conflict=name_key', { method:'POST', body:{ id:c.id, name, name_key:key }, prefer:'resolution=ignore-duplicates,return=minimal' }),

const sortCustomers = () => DB.customers.sort((a,b) => a.name.localeCompare(b.name,'el'));

/* Δημιουργία εγγράφου: αν ο πελάτης έχει ήδη φάκελο, μπαίνει μέσα σε αυτόν */
function createEnvelopeDoc(typed, date, kind, note){
  const existing = envelopeOf(typed);
  const name = upper(existing.length ? existing[0].name : (customerNames().find(n => norm(n) === norm(typed)) || typed));
  const doc = { id:uuid(), name, date:'', kind, note:note || '', addedAt:new Date().toISOString(), givenAt:null };

  if (existing.length){
    const oldDate = groupDate(existing);
    const newDate = date || oldDate;
    const dateChanged = newDate !== oldDate || existing.some(e => (e.date || '') !== newDate);
    const prev = existing.map(e => [e, e.date]);
    doc.date = newDate;
    mutate(
      () => { DB.envelopes.push(doc); existing.forEach(e => e.date = newDate); },
      async () => {
        await api('envelopes', { method:'POST', body:docBody(doc), prefer:'return=minimal' });
        if (dateChanged) await api(`envelopes?${idsFilter(existing.map(e => e.id))}`, { method:'PATCH', body:{ date:newDate || null }, prefer:'return=minimal' });
      },
      () => { DB.envelopes = DB.envelopes.filter(e => e.id !== doc.id); prev.forEach(([e,d]) => e.date = d); },
      `Δεν μπήκε στον φάκελο για ${name}.`
    ).then(() => checkReminders());
    /* ίδιος φάκελος → όχι δεύτερη υπενθύμιση για σήμερα, εκτός αν άλλαξε η ημέρα */
    if (!dateChanged){
      const t = todayIso();
      ['day','eve','miss'].forEach(k => { if (existing.some(e => LOCAL.fired[`${t}|${k}|${e.id}`])) LOCAL.fired[`${t}|${k}|${doc.id}`] = 1; });
      saveLocal();
    }
    toast(`Μπήκε στον υπάρχοντα φάκελο για ${esc(name)}, ${esc(slotName(name))}. Μέσα τώρα: ${esc(docSummary([...existing, doc]))}.${date && dateChanged ? ` Νέα ημέρα παράδοσης: ${esc(dayLabel(newDate, true))}.` : ''}`);
    return;
  }
  doc.date = date || '';
  mutate(
    () => { DB.envelopes.push(doc); },
    () => api('envelopes', { method:'POST', body:docBody(doc), prefer:'return=minimal' }),
    () => { DB.envelopes = DB.envelopes.filter(e => e.id !== doc.id); },
    `Δεν αποθηκεύτηκε ο φάκελος για ${name}.`
  ).then(() => checkReminders());
  rememberCustomer(name);
  toast(`Νέος φάκελος για ${esc(name)} (${KINDS[kind].toLowerCase()})${doc.date ? `, παράδοση ${esc(dayLabel(doc.date, true))}` : ', χωρίς ημέρα ακόμα'}. Βάλ' τον <b>${esc(slotIn(name))}</b>.`);
}

function removeEnvelope(idsStr){

/* Αφαίρεση ενός εγγράφου από τον φάκελο (από το παράθυρο του εγγράφου) */
function removeDoc(id){

/* Επαναφορά στο stand: αν ο πελάτης έχει ήδη φάκελο, τα έγγραφα μπαίνουν σε αυτόν */
function restoreGiven(idsStr){
  const docs = docsByIds(idsStr).filter(e => e.givenAt);
  if (!docs.length) return;
  const existing = envelopeOf(docs[0].name);
  const old = groupDate(docs);
  const date = existing.length ? groupDate(existing) : (old && old >= todayIso() ? old : '');
  const prev = docs.map(e => [e, e.givenAt, e.date]);
  mutate(
    () => { docs.forEach(e => { e.givenAt = null; e.date = date; }); },
    () => api(`envelopes?${idsFilter(docs.map(e => e.id))}`, { method:'PATCH', body:{ given_at:null, date:date || null }, prefer:'return=minimal' }),
    () => { prev.forEach(([e,g,d]) => { e.givenAt = g; e.date = d; }); },
    'Η επαναφορά δεν αποθηκεύτηκε.'
  );
  toast(existing.length ? `Μπήκε ξανά στον φάκελο για ${esc(docs[0].name)} που είναι στο stand.` : `Ο φάκελος για ${esc(docs[0].name)} γύρισε στο stand.`);

function setGroupDate(idsStr, value){

    () => api(`envelopes?${idsFilter(docs.map(e => e.id))}`, { method:'PATCH', body:{ date:value || null }, prefer:'return=minimal' }),
    () => { prev.forEach(([e,d]) => e.date = d); },

/* Αν ένας φάκελος έχει έγγραφα με διαφορετικές ημέρες (π.χ. από παλιότερη έκδοση ή μετά
   από διόρθωση ονόματος που ένωσε δύο πελάτες), τα φέρνει όλα στην ίδια ημέρα */
let unifying = false;
async function unifyDates(){
  if (unifying) return;
  const fixes = groupsOf(pending()).map(g => ({ g, wrong: g.items.filter(e => (e.date || '') !== g.date) })).filter(x => x.wrong.length);
  if (!fixes.length) return;
  unifying = true;
  try {
    for (const { g, wrong } of fixes){
      await api(`envelopes?${idsFilter(wrong.map(e => e.id))}`, { method:'PATCH', body:{ date:g.date || null }, prefer:'return=minimal' });
      wrong.forEach(e => e.date = g.date);
    }
    cacheData(); renderAll();
  } catch(e){} finally { unifying = false; }
}

  };

  const save = () => {
    const note = clean($('eNote').value).slice(0, NOTE_MAX);

    close();
    if (note === doc.note && kind === doc.kind) return;
    mutate(

/* ---------- Διόρθωση ονόματος: αλλάζει σε όλα τα έγγραφα και στη λίστα πελατών ---------- */
function openRename(oldName){
  const box = $('modalBox');
  box.innerHTML = `
    <button class="icon-btn m-x" data-m="cancel" aria-label="Κλείσιμο">×</button>
    <p class="m-eyebrow">Διόρθωση ονόματος</p>

    <label class="f m-field"><span>Σωστό όνομα</span><input class="inp" id="rName" value="${esc(oldName)}" autocomplete="off" spellcheck="false"></label>
    <p class="hint" id="rHint"></p>
    <div class="m-f"><span class="m-sp"></span><button class="btn ghost" data-m="cancel">Ακύρωση</button><button class="btn primary" data-m="save">Αποθήκευση</button></div>`;
  const inp = $('rName'), hint = $('rHint');
  upperInput(inp);
  attachCombo(inp, { allowNew:false });
  const check = () => {
    const v = cleanName(inp.value);
    const other = v && norm(v) !== norm(oldName) ? customerNames().find(n => norm(n) === norm(v)) : null;
    hint.innerHTML = other ? `Υπάρχει ήδη πελάτης «${esc(other)}»${envelopeOf(other).length ? ' με φάκελο στο stand' : ''}. Θα γίνουν ένας φάκελος.` : '';
  };
  const close = () => { $('modal').hidden = true; box.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const save = () => {
    const v = cleanName(inp.value);
    if (!v){ hint.innerHTML = '<span class="bad">Γράψε το σωστό όνομα.</span>'; return; }
    const target = customerNames().find(n => norm(n) === norm(v) && norm(n) !== norm(oldName)) || v;
    close();
    if (target !== oldName) renameCustomer(oldName, target);
  };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && document.activeElement === inp){ e.preventDefault(); save(); } };
  inp.addEventListener('input', check);
  box.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; if (b.dataset.m === 'cancel') close(); if (b.dataset.m === 'save') save(); };
  $('modal').onclick = e => { if (e.target === $('modal')) close(); };
  document.addEventListener('keydown', onKey);
  $('modal').hidden = false;
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
}
function renameCustomer(oldName, newName){
  const oldKey = norm(oldName), newKey = norm(newName);
  const docs = DB.envelopes.filter(e => norm(e.name) === oldKey);
  const prevNames = docs.map(e => [e, e.name]);
  const snap = JSON.parse(JSON.stringify(DB.customers));
  const cust = DB.customers.find(c => (c.key || norm(c.name)) === oldKey);
  const target = oldKey !== newKey ? DB.customers.find(c => (c.key || norm(c.name)) === newKey) : null;
  mutate(
    () => {
      docs.forEach(e => e.name = newName);
      if (cust && target) DB.customers = DB.customers.filter(c => c !== cust);
      else if (cust){ cust.name = newName; cust.key = newKey; }
      else if (!target) DB.customers.push({ id:uuid(), name:newName, key:newKey });
      sortCustomers();
    },
    async () => {
      if (docs.length) await api(`envelopes?${idsFilter(docs.map(e => e.id))}`, { method:'PATCH', body:{ name:newName }, prefer:'return=minimal' });
      if (cust && target) await api(`customers?name_key=eq.${encodeURIComponent(oldKey)}`, { method:'DELETE', prefer:'return=minimal' });
      else if (cust) await api(`customers?name_key=eq.${encodeURIComponent(oldKey)}`, { method:'PATCH', body:{ name:newName, name_key:newKey }, prefer:'return=minimal' });
      else if (!target) await api('customers?on_conflict=name_key', { method:'POST', body:{ name:newName, name_key:newKey }, prefer:'resolution=ignore-duplicates,return=minimal' });
    },
    () => { prevNames.forEach(([e,n]) => e.name = n); DB.customers = snap; },
    'Η διόρθωση ονόματος δεν αποθηκεύτηκε.'
  ).then(() => unifyDates());
  toast(`Το όνομα άλλαξε: ${esc(oldName)} → ${esc(newName)}.`);
}

/* Ιστορικό: ένας φάκελος = τα έγγραφα του ίδιου πελάτη που δόθηκαν μαζί */
function givenGroups(list){
  const m = new Map();
  list.forEach(e => { const k = norm(e.name) + '|' + e.givenAt; if (!m.has(k)) m.set(k, { name:e.name, givenAt:e.givenAt, items:[] }); m.get(k).items.push(e); });
  return [...m.values()].sort((a,b) => b.givenAt.localeCompare(a.givenAt));
}
function givenRows(groups){
  return `<div class="rows">${groups.map(g => {
    const notes = g.items.map(e => e.note).filter(Boolean);
    return `<div class="row"><div class="r-main"><b>${esc(g.name)}</b> <span class="given-kinds">${esc(docSummary(g.items))}</span>${notes.length ? `<small>${esc(notes.join(' / '))}</small>` : ''}<small>Δόθηκε ${iso(new Date(g.givenAt)) === todayIso() ? 'σήμερα' : shortDate(iso(new Date(g.givenAt)))} στις ${hhmm(g.givenAt)}</small></div>
      <button class="btn ghost sm" data-act="restore" data-ids="${g.items.map(e => e.id).join(',')}">Επαναφορά στο stand</button></div>`;
  }).join('')}</div>`;
}
/* ---------- Ευρετήριο: κεφαλίδα γράμματος πριν από κάθε ομάδα ονομάτων ---------- */
const INDEX_LETTERS = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ'.split('');
let letterFilter = '';
function letterOf(name){
  const ch = [...upper(norm(name))].find(c => /[Α-ΩA-Z0-9]/.test(c)) || '';
  return INDEX_LETTERS.includes(ch) ? ch : 'A–Z';
}
/* list: ταξινομημένη αλφαβητικά · fn: πώς ζωγραφίζεται κάθε στοιχείο */
function indexed(list, fn, grid=false){
  let last = null, out = '';
  list.forEach(g => {
    const L = letterOf(g.name);
    if (L !== last){ out += `<div class="idx-h${grid ? ' grid' : ''}" aria-hidden="true"><span>${L}</span></div>`; last = L; }
    out += fn(g);
  });
  return out;
}
function renderIndexBar(allG){
  const bar = $('idxBar'); if (!bar) return;
  const counts = {};
  allG.forEach(g => { const L = letterOf(g.name); counts[L] = (counts[L] || 0) + 1; });
  if (!allG.length){ bar.innerHTML = ''; return; }
  const letters = [...INDEX_LETTERS, ...(counts['A–Z'] ? ['A–Z'] : [])];
  bar.innerHTML = letters.map(L => {
    const n = counts[L] || 0;
    return `<button type="button" class="${letterFilter === L ? 'on' : n ? '' : 'off'}" ${n ? `data-letter="${L}" title="${L}: ${n === 1 ? '1 φάκελος' : n + ' φάκελοι'}"` : 'disabled aria-disabled="true"'}>${L}</button>`;
  }).join('') + (letterFilter ? `<button type="button" class="clear" data-letter="">Όλα</button>` : '');
}

/* Ο φάκελος δεν δόθηκε και η μέρα πέρασε: ένα κλικ τον πάει στο επόμενο δρομολόγιο */

}

      : `<b>Όχι.</b> Κανένας φάκελος στο stand για «${esc($('q').value.trim())}».${gHits.length ? ' Από κάτω όσοι έχουν ήδη δοθεί.' : ''}`;

    if (missed.length) html += section('ΕΜΕΙΝΑΝ ΣΤΟ STAND', `<div class="rows bad">${indexed(missed, g => row(g, `Η παράδοση ήταν ${esc(dayLabel(g.date, true))}.`, true, postponeBtn(g)))}</div>`, true);

/* ===================== STAND: ΘΗΚΕΣ ΜΕ ΑΛΦΑΒΗΤΙΚΗ ΣΕΙΡΑ ===================== */
/* Το stand έχει λίγες θήκες (μπροστά → πίσω). Κάθε θήκη παίρνει σταθερό εύρος γραμμάτων.
   Τα εύρη είναι μοιρασμένα με βάση τους πελάτες του 2026 από το αρχείο ΠΑΡΑΓΓΕΛΙΕΣ
   (136 πελάτες, πολλοί στο Κ, Μ, Π), ώστε οι θήκες να γεμίζουν περίπου το ίδιο.
   Μέσα σε κάθε θήκη οι φάκελοι μπαίνουν αλφαβητικά, από μπροστά προς τα πίσω.
   Ονόματα με λατινικά ή αριθμούς (π.χ. FRESH SNACK) πάνε στην τελευταία θήκη. */
const GREEK = 'ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ'.split('');
const STAND_PRESETS = {
  2: [['Α','Λ'],['Μ','Ω']],
  3: [['Α','Κ'],['Λ','Π'],['Ρ','Ω']],
  4: [['Α','Ι'],['Κ','Λ'],['Μ','Π'],['Ρ','Ω']]
};
const STAND_POS = {
  2: [['μπροστινή','Μπροστά','στην','από την'],['πίσω','Πίσω','στην','από την']],
  3: [['μπροστινή','Μπροστά','στην','από την'],['μεσαία','Μέση','στη','από τη'],['πίσω','Πίσω','στην','από την']],
  4: [['πρώτη','1η','στην','από την'],['δεύτερη','2η','στη','από τη'],['τρίτη','3η','στην','από την'],['τέταρτη','4η','στην','από την']]
};
function standLayout(){
  const n = [2,3,4].includes(Number(LOCAL.settings.standSlots)) ? Number(LOCAL.settings.standSlots) : 3;
  return STAND_PRESETS[n].map(([from, to], i) => {
    const letters = GREEK.slice(GREEK.indexOf(from), GREEK.indexOf(to) + 1);
    const [pos, short, inArt, fromArt] = STAND_POS[n][i];
    return { id:from, num:i + 1, letters, label:`${from}–${to}`, pos, short, inArt, fromArt, last: i === n - 1 };
  });
}
function slotOf(name, layout=standLayout()){
  const s = upper(norm(name));
  const ch = [...s].find(c => /[Α-ΩA-Z0-9]/.test(c)) || '';
  return layout.find(sl => sl.letters.includes(ch)) || layout[layout.length - 1];
}
/* Στις υπενθυμίσεις μιλάμε με τα γράμματα της θήκης, όπως γράφουν οι ετικέτες */
const slotName = name => `θήκη ${slotOf(name).label}`;
const slotIn   = name => `στη θήκη ${slotOf(name).label}`;
const slotFrom = name => `από τη θήκη ${slotOf(name).label}`;
const slotBadge = name => { const sl = slotOf(name); return `<span class="slot" title="Θήκη ${sl.label} · ${sl.pos}">${esc(sl.label)}</span>`; };
function dayTag(g){
  const t = todayIso();
  if (!g.date) return '<span class="dt none">χωρίς ημέρα</span>';
  if (g.date < t) return `<span class="dt miss">έμεινε από ${shortDate(g.date)}</span>`;
  if (g.date === t) return '<span class="dt today">φεύγει σήμερα</span>';
  if (g.date === tomorrowIso()) return '<span class="dt tmr">αύριο</span>';
  return `<span class="dt">${esc(dayLabel(g.date))}</span>`;
}
function standData(){
  const layout = standLayout();
  const bySlot = new Map(layout.map(sl => [sl.id, []]));
  groupsOf(pending()).forEach(g => bySlot.get(slotOf(g.name, layout).id).push(g));
  bySlot.forEach(list => list.sort((a,b) => a.name.localeCompare(b.name,'el')));
  return { layout, bySlot };
}
/* Οι «Φάκελοι» και το «Stand» είναι η ίδια ενότητα, με δύο όψεις */
function viewToggle(cur){
  return `<div class="seg view-toggle" role="radiogroup">
    <button type="button" role="radio" aria-checked="${cur === 'main'}" class="${cur === 'main' ? 'on' : ''}" data-go="main">Λίστα</button>
    <button type="button" role="radio" aria-checked="${cur === 'stand'}" class="${cur === 'stand' ? 'on' : ''}" data-go="stand">Stand</button>
  </div>`;
}
function renderStand(){
  const { layout, bySlot } = standData();
  const total = [...bySlot.values()].reduce((n, l) => n + l.length, 0);
  const cur = Number(LOCAL.settings.standSlots) || 3;
  $('view-stand').innerHTML = `
    ${viewToggle('stand')}

      <p>${total ? `${total === 1 ? '1 φάκελος' : total + ' φάκελοι'} στο stand. Κάθε φάκελος πάει στη θήκη με το πρώτο γράμμα του ονόματος, και μέσα στη θήκη αλφαβητικά, από μπροστά προς τα πίσω.` : 'Το stand είναι άδειο.'}</p>
    </div>
    <div class="card move-card">
      <b>Τακτοποίηση, μία φορά</b>
      <ol>
        <li>Κόλλησε ετικέτα στο πάνω μέρος κάθε θήκης: ${layout.map(sl => `<b>${sl.short.toLowerCase()} ${esc(sl.label)}</b>`).join(', ')}.</li>
        <li>Όλα τα χαρτιά κάθε πελάτη σε ένα φάκελο ή με ένα συνδετήρα, με το όνομα γραμμένο με κεφαλαία στην πάνω άκρη, για να φαίνεται από πάνω χωρίς να τα βγάζεις.</li>
        <li>Τύπωσε τη λίστα, βάλε κάθε φάκελο στη θήκη του με τη σειρά που γράφει, και τσέκαρε το κουτάκι.</li>
      </ol>
    </div>
    <div class="stand-bar">
      <div class="f"><span>Θήκες στο stand</span>
        <div class="seg" role="radiogroup">${[2,3,4].map(n => `<button type="button" role="radio" aria-checked="${cur === n}" class="${cur === n ? 'on' : ''}" data-slots="${n}">${n} θήκες</button>`).join('')}</div>
      </div>
      <div class="btns">
        <button class="btn ghost sm" data-act="print-labels">Εκτύπωση ετικετών</button>
        <button class="btn primary sm" data-act="print-list" ${total ? '' : 'disabled'}>Εκτύπωση λίστας</button>
      </div>
    </div>
    <div class="slots stand-slots" style="--n:${layout.length}">${layout.map(sl => {
      const list = bySlot.get(sl.id);
      return `<section class="slot-card${list.length ? '' : ' empty'}">
        <header><span class="slot-num">${esc(sl.short)}</span><span class="slot-l">${esc(sl.label)}</span><span class="slot-n">${list.length ? (list.length === 1 ? '1 φάκελος' : list.length + ' φάκελοι') : 'άδεια'}</span></header>
        ${sl.last ? '<p class="slot-note">+ ονόματα με λατινικά ή αριθμούς</p>' : ''}
        ${list.length ? `<ol>${indexed(list, g => `<li><b>${esc(g.name)}</b><small>${esc(docSummary(g.items))} ${dayTag(g)}</small></li>`).replace(/<div class="idx-h" aria-hidden="true"><span>(.*?)<\/span><\/div>/g, '<li class="idx-li" aria-hidden="true"><span>$1</span></li>')}</ol>` : ''}
      </section>`;
    }).join('')}</div>`;
}
function printStand(kind){
  const { layout, bySlot } = standData();
  const area = $('printArea');
  if (kind === 'labels'){
    area.innerHTML = `<div class="p-labels">${layout.map(sl => `<div class="p-label"><small>${esc(sl.short)}</small><span>${esc(sl.label)}</span></div>`).join('')}</div>`;

  c.width = img.naturalWidth * scale; c.height = img.naturalHeight * scale;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height), p = d.data;

const inList = codes => `(${codes.map(c => `"${c}"`).join(',')})`;
async function loadArchive(){

/* Ολοκληρωμένοι έλεγχοι: όταν όλα τα παραστατικά τους έχουν αρχειοθετηθεί εδώ και
   τόσες μέρες, σβήνονται μαζί με τα παραστατικά τους. Δεν μένει τίποτα χωρίς λόγο. */
const arcKeepDays = () => Math.min(365, Math.max(0, Number(LOCAL.settings.arcKeepDays ?? 30)));
/* Πότε ολοκληρώθηκε ένας έλεγχος: η πιο πρόσφατη αρχειοθέτηση των παραστατικών του */
function checkDoneAt(chk, stamps){
  let last = '';
  for (const c of chk.codes){
    const at = stamps.get(c);
    if (!at) return '';                     // κάτι λείπει ακόμα
    if (at > last) last = at;
  }
  return last;
}
/* Ταξινόμηση ελέγχων: με βάση την ημερομηνία των παραστατικών τους, νεότερα πρώτα.
   Αν δεν είναι γνωστή, διαβάζεται από τον τίτλο· τελευταία επιλογή, πότε ανέβηκε. */
function checkDate(chk){
  let best = '';
  (chk.codes || []).forEach(c => { const d = docDate(c); if (d && d > best) best = d; });
  if (best) return best;
  const dates = (String(chk.label || '').match(/(\d{2})\/(\d{2})\/(\d{4})/g) || [])
    .map(x => { const [d,m,y] = x.split('/'); return `${y}-${m}-${d}`; }).sort();
  if (dates.length) return dates[dates.length - 1];
  return chk.created_at ? iso(new Date(chk.created_at)) : '';
}
const checksSorted = () => [...ARC.checks].sort((a,b) => checkDate(b).localeCompare(checkDate(a)) || String(b.created_at).localeCompare(String(a.created_at)));
function checkDeleteIn(chk){
  const done = checkDoneAt(chk, ARC.stamps);
  if (!done) return null;
  const left = arcKeepDays() - Math.floor((Date.now() - new Date(done).getTime()) / 86400000);
  return Math.max(0, left);
}
let arcCleaning = false;
async function cleanupChecks(){
  if (arcCleaning || !ARC.loaded || !ARC.checks.length) return;
  arcCleaning = true;
  try {
    const cutoff = new Date(Date.now() - arcKeepDays() * 86400000).toISOString();
    const old = await api(`archive_docs?select=code,archived_at&archived_at=not.is.null&archived_at=lt.${encodeURIComponent(cutoff)}`);
    if (!old || !old.length) return;
    const stamps = new Map(old.map(r => [r.code, r.archived_at]));
    const ripe = ARC.checks.filter(c => c.codes.length && checkDoneAt(c, stamps));
    if (!ripe.length) return;
    const ripeIds = new Set(ripe.map(c => c.id));
    const keep = ARC.checks.filter(c => !ripeIds.has(c.id));
    const stillUsed = new Set(keep.flatMap(c => c.codes));
    const codes = [...new Set(ripe.flatMap(c => c.codes))].filter(c => !stillUsed.has(c));
    for (const c of ripe) await api(`archive_checks?id=eq.${c.id}`, { method:'DELETE', prefer:'return=minimal' });
    for (let i = 0; i < codes.length; i += 80) await api(`archive_docs?${idsFilter2(codes.slice(i, i + 80))}`, { method:'DELETE', prefer:'return=minimal' });
    ARC.checks = keep;
    codes.forEach(c => { ARC.docs.delete(c); ARC.missing.delete(c); ARC.stamps.delete(c); ARC.openDocs.delete(c); });
    if (ARC.openId && ripeIds.has(ARC.openId)){ ARC.openId = null; setHash('arc'); }
    renderNav(); if (view === 'arc') renderArchive();
    toast(`Διαγράφηκ${ripe.length === 1 ? 'ε 1 ολοκληρωμένος έλεγχος' : `αν ${ripe.length} ολοκληρωμένοι έλεγχοι`} και ${codes.length === 1 ? '1 παραστατικό' : codes.length + ' παραστατικά'}, μετά από ${arcKeepDays()} ${arcKeepDays() === 1 ? 'μέρα' : 'μέρες'}.`);
  } catch(e){} finally { arcCleaning = false; }
}
const idsFilter2 = codes => `code=in.(${codes.map(c => `"${c}"`).join(',')})`;

/* Ο αριθμός στο όνομα του ελέγχου («· 7 παραστατικά») ακολουθεί τις διαγραφές */
const relabel = (label, n) => String(label || '').replace(/\d+ παραστατικ(ό|ά)$/, n === 1 ? '1 παραστατικό' : `${n} παραστατικά`);
/* Σβήνει παραστατικά από τη βάση και από όποιον έλεγχο τα έχει. Αν ένας έλεγχος αδειάσει, σβήνεται κι αυτός. */
function deleteDocs(codes, { silent=false } = {}){
  codes = [...new Set(codes)].filter(Boolean);
  if (!codes.length) return;
  const snap = {
    docs: codes.map(c => [c, ARC.docs.get(c), ARC.missing.get(c), ARC.openDocs.get(c)]),
    checks: ARC.checks.map(c => ({ ...c, codes:[...c.codes] }))
  };
  const touched = ARC.checks.filter(c => c.codes.some(x => codes.includes(x)))
    .map(c => { const left = c.codes.filter(x => !codes.includes(x)); return { id:c.id, left, label:relabel(c.label, left.length) }; });
  const info = codes.map(c => ({ code:c, doc_date:docDate(c) || null, archived_at: ARC.missing.has(c) ? null : ((ARC.docs.get(c) || {}).archived_at || new Date().toISOString()) }));
  arcMutate(
    () => {
      codes.forEach(c => { ARC.docs.delete(c); ARC.missing.delete(c); ARC.openDocs.delete(c); });
      touched.forEach(t => {
        const chk = ARC.checks.find(c => c.id === t.id);
        if (!t.left.length){ ARC.checks = ARC.checks.filter(c => c.id !== t.id); if (ARC.openId === t.id){ ARC.openId = null; setHash('arc'); } }
        else if (chk){ chk.codes = t.left; chk.label = t.label; }
      });
      renderNav();
    },
    async () => {
      for (let i = 0; i < codes.length; i += 80) await api(`archive_docs?code=in.${encodeURIComponent(inList(codes.slice(i, i + 80)))}`, { method:'DELETE', prefer:'return=minimal' });
      for (const t of touched){
        if (!t.left.length) await api(`archive_checks?id=eq.${t.id}`, { method:'DELETE', prefer:'return=minimal' });
        else await api(`archive_checks?id=eq.${t.id}`, { method:'PATCH', body:{ codes:t.left, label:t.label }, prefer:'return=minimal' });
      }
    },
    () => {
      snap.docs.forEach(([c, d, m, o]) => { if (d) ARC.docs.set(c, d); if (m) ARC.missing.set(c, m); if (o) ARC.openDocs.set(c, o); });
      ARC.checks = snap.checks; renderNav();
    },
    'Η διαγραφή δεν αποθηκεύτηκε.'
  );
  if (silent) return;
  toast(codes.length === 1 ? `Διαγράφηκε το ${esc(codes[0])}.` : `Διαγράφηκαν ${codes.length} παραστατικά.`, { action:{ label:'Αναίρεση', fn:() => arcMutate(
    () => {
      snap.docs.forEach(([c, d, m, o]) => { if (d) ARC.docs.set(c, d); if (m) ARC.missing.set(c, m); if (o) ARC.openDocs.set(c, o); });
      ARC.checks = snap.checks.map(c => ({ ...c, codes:[...c.codes] })); renderNav();
    },
    async () => {
      await api('archive_docs?on_conflict=code', { method:'POST', body:info, prefer:'resolution=ignore-duplicates,return=minimal' });
      for (const t of touched){
        const orig = snap.checks.find(c => c.id === t.id);
        if (!t.left.length) await api('archive_checks', { method:'POST', body:{ id:orig.id, label:orig.label, codes:orig.codes, created_at:orig.created_at }, prefer:'return=minimal' });
        else await api(`archive_checks?id=eq.${t.id}`, { method:'PATCH', body:{ codes:orig.codes, label:orig.label }, prefer:'return=minimal' });
      }
    },
    () => { codes.forEach(c => { ARC.docs.delete(c); ARC.missing.delete(c); }); },
    'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}

/* ---------- Εμφάνιση ---------- */
/* Κάθε παραστατικό: αρχειοθετημένο, σε αναμονή (το περιμένεις ακόμα), ή καθυστερεί
   (το περιμένεις πάνω από τις μέρες που ορίζεις, προεπιλογή 7). */
const arcDate = d => d ? fmtDate(d) : '';

const docInfo = code => ARC.openDocs.get(code) || ARC.docs.get(code) || ARC.missing.get(code) || {};
const docDate = code => docInfo(code).doc_date || '';
const ageDays = d => d ? Math.max(0, Math.round((fromIso(todayIso()) - fromIso(d)) / 86400000)) : null;
const ageText = a => a == null ? '' : a === 0 ? 'σήμερα' : a === 1 ? '1 μέρα' : `${a} μέρες`;
function docState(code){
  if (!ARC.missing.has(code)) return 'done';
  const a = ageDays(docDate(code));

const lateCount = () => [...ARC.missing.keys()].filter(c => docState(c) === 'late').length;
function chkRow(code, withDate=false){
  const st = docState(code), d = docDate(code), a = ageDays(d);
  const label = st === 'done' ? 'Αρχειοθετήθηκε' : st === 'late' ? `Καθυστερεί · ${ageText(a)}` : `Σε αναμονή${a != null ? ' · ' + ageText(a) : ''}`;
  return `<label class="chk-row ${st}">

    <span class="chk-code">${esc(code)}</span>

function dayListHTML(codes){
  const groups = new Map();
  codes.forEach(c => { const d = docDate(c); if (!groups.has(d)) groups.set(d, []); groups.get(d).push(c); });
  return [...groups.keys()].sort((x, y) => (x || '9999').localeCompare(y || '9999')).map(d => {
    const cs = groups.get(d).sort(byCode);
    const waiting = cs.filter(c => ARC.missing.has(c)), late = waiting.filter(c => docState(c) === 'late');
    const a = ageDays(d);
    return `<div class="chk-day${late.length ? ' late' : ''}">
        <div class="cd-t"><b>${d ? esc(longDate(d)) : 'Χωρίς ημερομηνία'}</b>${d ? `<small>${a === 0 ? 'σήμερα' : 'πριν από ' + ageText(a)}</small>` : ''}</div>
        <span class="cd-sum">${waiting.length ? `${waiting.length} σε αναμονή` : 'όλα αρχειοθετημένα'}</span>
        ${waiting.length > 1 ? `<button class="btn ghost sm" data-arc="day-done" data-codes="${esc(waiting.join(','))}">Όλη η μέρα αρχειοθετήθηκε</button>` : ''}
      </div>${cs.map(c => chkRow(c)).join('')}`;
  }).join('');
}

function reviewAdd(code){
  const raw = code || $('rvNew').value;
  const v = normManualCode(raw);
  if (!v){ toast('Γράψε τον κωδικό όπως στη λίστα, π.χ. ΤΔΑ0001214.'); return; }
  if (ARC.review.some(r => r.code === v)){ toast(`Το ${esc(v)} υπάρχει ήδη στη λίστα.`); return; }
  const date = (ARC.review.find(r => r.date) || {}).date || '';
  ARC.review.push({ code:v, date, fixedFrom:'', check:false, alt:'' });
  ARC.review.sort((a,b) => byCode(a.code, b.code));
  renderArchive();
  const n = $('rvNew'); if (n && !code) n.focus();
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-arc-filter]');
  if (f){ ARC.filter = f.dataset.arcFilter; renderArchive(); return; }
  const a = e.target.closest('[data-arc]');
  if (!a) return;
  switch (a.dataset.arc){
    case 'save-review': saveReview(); break;
    case 'cancel-review': ARC.review = []; ARC.reviewIssues = []; ARC.images.forEach(u => URL.revokeObjectURL(u)); ARC.images = []; renderArchive(); break;
    case 'rv-del': ARC.review.splice(Number(a.dataset.i), 1); renderArchive(); break;
    case 'rv-swap': { const r = ARC.review[Number(a.dataset.i)]; if (r && r.alt){ if (ARC.review.some(x => x.code === r.alt)){ toast(`Το ${esc(r.alt)} υπάρχει ήδη στη λίστα.`); break; } [r.code, r.alt] = [r.alt, r.code]; ARC.review.sort((x,y) => byCode(x.code, y.code)); renderArchive(); } break; }
    case 'rv-add': reviewAdd(); break;
    case 'add-gap': reviewAdd(a.dataset.code); break;
    case 'open': openCheck(a.dataset.id); break;
    case 'day-done': setArchived(String(a.dataset.codes || '').split(',').filter(Boolean), true); break;
    case 'back': ARC.openId = null; setHash('arc'); renderArchive(); break;
    case 'del': openDeleteCheck(a.dataset.id); break;
    case 'doc-del': e.preventDefault(); e.stopPropagation(); deleteDocs([a.dataset.code]); break;
    case 'del-check': openDeleteCheck(ARC.openId); break;
    case 'all-done': { const chk = ARC.checks.find(c => c.id === ARC.openId); if (chk) setArchived(chk.codes.filter(c => ARC.missing.has(c)), true); break; }
    case 'copy-missing': {
      const chk = ARC.checks.find(c => c.id === ARC.openId); if (!chk) break;
      const txt = chk.codes.filter(c => ARC.missing.has(c)).sort((a, b) => (docDate(a) || '9').localeCompare(docDate(b) || '9') || byCode(a, b))
        .map(c => `${c}\t${arcDate(docDate(c))}\t${docState(c) === 'late' ? 'καθυστερεί ' : ''}${ageText(ageDays(docDate(c)))}`).join('\n');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Αντιγράφηκαν όσα περιμένεις, με ημερομηνίες.')).catch(() => toast('Η αντιγραφή δεν επιτρέπεται εδώ.'));
      break;
    }
  }
});

/* Τι χρειάζεται προσοχή σε κάθε ενότητα */
function homeAlerts(){
  const t = todayIso(), out = [];
  const G = groupsOf(pending());
  const today = G.filter(g => g.date === t).length, missed = G.filter(g => g.date && g.date < t).length;
  if (missed) out.push({ v:'main', lvl:'late', txt:`${missed === 1 ? '1 φάκελος έμεινε' : missed + ' φάκελοι έμειναν'} στο stand` });
  if (today) out.push({ v:'main', lvl:'today', txt:`${today === 1 ? '1 φάκελος φεύγει' : today + ' φάκελοι φεύγουν'} σήμερα` });
  if (canCheques() && CHQ.loaded){
    const late = chqOverdue(), due = chqDueToday();
    if (late) out.push({ v:'chq', lvl:'late', txt:`${late === 1 ? '1 επιταγή πέρασε' : late + ' επιταγές πέρασαν'} την ημερομηνία` });
    if (due) out.push({ v:'chq', lvl:'today', txt:`${due === 1 ? '1 επιταγή εξοφλείται' : due + ' επιταγές εξοφλούνται'} σήμερα` });
  }
  if (canArchive() && ARC.loaded){
    const l = lateCount();
    if (l) out.push({ v:'arc', lvl:'late', txt:`${l === 1 ? '1 παραστατικό καθυστερεί' : l + ' παραστατικά καθυστερούν'}` });
  }
  if (canVehicles() && VEH.loaded){
    const dl = vehDeadlines();
    const late = dl.filter(x => vehState(x.due) === 'late').length;
    const soon = dl.filter(x => ['today','soon'].includes(vehState(x.due))).length;
    if (late) out.push({ v:'veh', lvl:'late', txt:`${late === 1 ? '1 λήξη οχήματος πέρασε' : late + ' λήξεις οχημάτων πέρασαν'}` });
    if (soon) out.push({ v:'veh', lvl:'soon', txt:`${soon === 1 ? '1 λήξη οχήματος πλησιάζει' : soon + ' λήξεις οχημάτων πλησιάζουν'}` });
  }
  const rank = { late:0, today:1, soon:2 };
  return out.sort((a,b) => (rank[a.lvl] ?? 3) - (rank[b.lvl] ?? 3));
}

function homeModules(){

    n: G.filter(g => g.date && g.date <= t).length });
  if (canVehicles()) mods.push({ v:'veh', title:'Οχήματα',
    line: !VEH.loaded ? '—' : VEH.list.length
      ? `${VEH.list.length === 1 ? '1 όχημα' : VEH.list.length + ' οχήματα'} · ${vehAlertCount() === 0 ? 'καμία λήξη σε προσοχή' : vehAlertCount() === 1 ? '1 λήξη σε προσοχή' : vehAlertCount() + ' λήξεις σε προσοχή'}`
      : 'Κανένα όχημα ακόμα',
    n: VEH.loaded ? vehAlertCount() : 0 });
  if (canCheques()) mods.push({ v:'chq', title:'Επιταγές',
    line: !CHQ.loaded ? '—' : chqOpen().length ? `${chqOpen().length === 1 ? '1 εκκρεμής' : chqOpen().length + ' εκκρεμείς'}` : 'Καμία εκκρεμής',
    n: CHQ.loaded ? chqDueToday() + chqOverdue() : 0 });
  if (canArchive()) mods.push({ v:'arc', title:'Αρχειοθέτηση',
    line: !ARC.loaded ? '—' : ARC.missing.size ? `${ARC.missing.size === 1 ? '1 παραστατικό' : ARC.missing.size + ' παραστατικά'} σε αναμονή` : 'Όλα αρχειοθετημένα',
    n: ARC.loaded ? lateCount() : 0 });
  return mods;
}

  $('modal').hidden = false;
  f.init();
