<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Φάκελοι | Μύλοι Αρκαδίου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== BRAND TOKENS (ίδια με το εσωτερικό σύστημα / m-m-m.gr) ===== */
:root{
  --white:#FFFFFF; --bg:#FBFBF8; --line:#E8E6DD; --line-2:#F2F1EC;
  --olive:#7D8A4E; --olive-dark:#66713F; --olive-deep:#545E33; --olive-tint:#F1F3E8;
  --wheat:#C6913C; --wheat-dark:#94691F; --wheat-tint:#F8EFDD;
  --red:#A63E3A; --red-tint:#F7E8E7;
  --ink:#3B3B33; --muted:#75746A;
  --radius:10px;
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
[hidden]{display:none!important}

/* ===== HEADER ===== */
.topbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-in{max-width:980px;margin:0 auto;height:66px;padding:0 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{height:46px;width:auto;max-width:120px;object-fit:contain}
.brand-fallback{width:40px;height:40px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.bt{line-height:1.2}
.bt b{display:block;font-size:14.5px;font-weight:700}
.bt span{font-size:10.5px;letter-spacing:.14em;color:var(--olive-dark);font-weight:700}
.nav{display:flex;gap:2px}
.nav-btn{position:relative;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;border-radius:6px;display:inline-flex;align-items:center;gap:7px}
.nav-btn:hover,.nav-btn.active{color:var(--olive-dark)}
.nav-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:2px;background:var(--olive);border-radius:2px}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;line-height:1}
.save-err{font-size:12px;color:var(--red);font-weight:700}
@media (max-width:600px){
  .topbar-in{height:58px;padding:0 14px;gap:8px}
  .brand img{height:38px}
  .bt{display:none}
  .nav-btn{padding:9px 10px}
}

/* ===== NOTIFICATION BAR ===== */
.notif-bar{background:var(--olive-tint);border-bottom:1px solid #DFE3CF}
.notif-bar.warn{background:var(--wheat-tint);border-bottom-color:#EEDDB9}
.notif-in{max-width:980px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;font-size:13.5px}
.notif-in p{flex:1}

/* ===== LAYOUT ===== */
.main{max-width:980px;margin:0 auto;padding:34px 24px 90px}
@media (max-width:600px){.main{padding:22px 14px 80px}.notif-in{padding:10px 14px}}
.view{display:none}
.view.active{display:block}
.greet{margin-bottom:22px}
.greet h1{font-size:clamp(26px,3.6vw,34px);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.greet p{margin-top:8px;font-size:15.5px}
.greet .date{color:var(--muted)}
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sec-h h2{font-size:13px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h.bad h2{color:var(--red)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.empty{border:1px dashed #D9D6C9;border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center;background:var(--white)}

/* ===== BUTTONS / INPUTS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13.5px;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn.primary{background:var(--olive-dark);color:#fff}
.btn.primary:hover{background:var(--olive-deep)}
.btn.ghost{border:1px solid var(--line);background:var(--white)}
.btn.ghost:hover{border-color:var(--olive);color:var(--olive-deep)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red);border:1px solid #E9CFCD;background:var(--white)}
.btn.danger-ghost:hover{background:var(--red-tint)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#A9A79B;font-size:19px;line-height:1;flex-shrink:0}
.icon-btn:hover{background:var(--red-tint);color:var(--red)}
.inp{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 11px;font-size:14px;min-width:0}
.inp:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px var(--olive-tint)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--muted)}
.f .inp{width:100%}

/* ===== ΠΡΟΣΘΗΚΗ ===== */
.add-card{padding:18px;margin-bottom:32px}
.add-grid{display:grid;grid-template-columns:1.6fr auto auto;gap:10px;align-items:end}
.when{display:flex;gap:6px;align-items:center}
.when .inp{width:150px}
@media (max-width:760px){.add-grid{grid-template-columns:1fr}.when .inp{flex:1;width:auto}}
.hint{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
.hint b{color:var(--ink)}
.hint .bad{color:var(--red);font-weight:600}

/* ===== ΦΑΚΕΛΟΣ (κάρτα σημερινών) ===== */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.env{
  position:relative;background:var(--white);border:1px solid var(--line);border-radius:3px 3px 8px 8px;
  padding:70px 18px 18px;display:flex;flex-direction:column;text-align:center;
  box-shadow:0 12px 26px -20px rgba(59,59,51,.5);transition:opacity .2s,transform .2s;
}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:44px;background:var(--wheat-tint);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{
  content:"";position:absolute;left:0;right:0;top:0;height:44px;pointer-events:none;
  background:
    linear-gradient(to top right,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) left top/50% 100% no-repeat,
    linear-gradient(to top left,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) right top/50% 100% no-repeat;
}
.seal{position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);z-index:1;width:36px;height:36px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--white),0 0 0 5px var(--line)}
.seal svg{width:17px;height:17px}
.env h3{font-size:16.5px;font-weight:700;line-height:1.3}
.env .since{color:var(--muted);font-size:12.5px;margin:4px 0 16px}
.env .btn{margin-top:auto}
.leaving{opacity:0;transform:translateY(-8px)}

/* ===== ΓΡΑΜΜΕΣ ===== */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.rows.bad{border-color:#EBD3D1;background:#FFFCFB}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;transition:opacity .2s,transform .2s;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.r-main{flex:1;min-width:170px}
.r-main b{font-weight:700}
.r-main small{display:block;color:var(--muted);font-size:12.5px}
.row input[type=date]{padding:6px 8px;font-size:13px;width:150px}
.given{margin-top:10px}
.given summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);padding:6px 0}
.given summary:hover{color:var(--ink)}
.given .rows{margin-top:8px}

/* ===== ΡΥΘΜΙΣΕΙΣ ===== */
.page-h{margin-bottom:22px}
.page-h h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.set{padding:18px 20px;margin-bottom:14px;max-width:680px}
.set h3{font-size:15px;font-weight:700;margin-bottom:10px}
.set p{color:var(--muted);font-size:13.5px;margin-bottom:12px;max-width:62ch}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.set-row.first{border-top:0;padding-top:4px}
.sr-t{flex:1;min-width:200px}
.sr-t b{display:block;font-weight:600}
.sr-t small{color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;margin-bottom:12px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.state.ok::before{background:var(--olive)}
.state.bad::before{background:var(--red)}
.state.wait::before{background:var(--wheat)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#D9D6C9;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--olive-dark)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--olive);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:3px 5px 3px 11px;font-size:12.5px;font-weight:600}
.chip button{width:20px;height:20px;border-radius:50%;color:#A9A79B;line-height:1;font-size:15px}
.chip button:hover{background:var(--red-tint);color:var(--red)}

/* ===== TOASTS ===== */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:12px 8px 12px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);animation:tin .2s ease}
.toast.alert{background:var(--white);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--wheat)}
.t-msg{flex:1;padding-top:1px}
.t-act{font-weight:700;color:#E8C27E;padding:2px 6px;white-space:nowrap}
.t-x{opacity:.65;font-size:18px;line-height:1;padding:0 6px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:600px){.toasts{right:12px;left:12px;bottom:12px;width:auto}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.env,.row{transition:none}}

/* ===== ΣΥΝΔΕΣΗ ===== */
.login{max-width:380px;margin:6vh auto 0;padding:28px 26px;text-align:center}
.login img{height:64px;width:auto;margin-bottom:10px}
.login h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login > p{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.login .f{text-align:left;margin-bottom:12px}
.login .btn{margin-top:6px}
.login .hint{text-align:left}
.net{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.net::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.net{color:var(--red)}
@media (max-width:600px){.net span{display:none}}

/* ===== ΑΝΑΖΗΤΗΣΗ ===== */
.search{position:relative;margin:-14px 0 10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search .inp{width:100%;padding-left:38px;background:var(--white)}
.q-info{font-size:14px;margin:0 0 22px}
.q-info b{color:var(--olive-deep)}
#lists{margin-top:22px}
/* ===== ΟΝΟΜΑ / ΠΟΛΛΟΙ ΦΑΚΕΛΟΙ ===== */
.name-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:inherit;border-radius:5px}
.name-btn svg{width:13px;height:13px;color:#B8B6AA;flex-shrink:0;opacity:0;transition:opacity .15s}
.name-btn:hover svg,.name-btn:focus-visible svg{opacity:1}
.name-btn:hover{color:var(--olive-deep)}
@media (hover:none){.name-btn svg{opacity:1}}
.seal b{font-size:14px;font-weight:800}
.env .count{font-weight:700;color:var(--wheat-dark);font-size:13px;margin-top:2px}
.pill{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--wheat-tint);color:var(--wheat-dark);vertical-align:1px}
.chip-name{font:inherit;font-weight:600}
.chip-name:hover{color:var(--olive-deep);text-decoration:underline}
/* ===== MODAL ===== */
.modal-back{position:fixed;inset:0;background:rgba(40,40,34,.38);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:440px;padding:22px;box-shadow:0 30px 60px -20px rgba(40,40,34,.4)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:4px}
.modal > p{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.m-f{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ===== ΕΙΔΟΣ & ΣΧΟΛΙΟ ===== */
.add-grid{grid-template-columns:minmax(200px,1.4fr) auto auto}
.add-grid .f-note{grid-column:1 / 3}
@media (max-width:860px){.add-grid{grid-template-columns:1fr 1fr}.add-grid .f-note{grid-column:1 / -1}.add-grid > label:first-child{grid-column:1 / -1}}
@media (max-width:560px){.add-grid{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{padding:8px 13px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--olive-dark);color:#fff}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-14px 0 10px}
.search-row .search{flex:1;min-width:220px;margin:0}
.ktag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:5px;flex-shrink:0}
.ktag.timologio{background:var(--olive-tint);color:var(--olive-deep)}
.ktag.apodeixi{background:var(--wheat-tint);color:var(--wheat-dark)}
.ktag.none{background:var(--line-2);color:var(--muted)}
.items{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.env .items{margin:10px 0 2px;align-items:center}
.item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:3px 6px;margin-left:-6px;border-radius:6px;text-align:left;max-width:100%}
.env .item{margin-left:0}
.item:hover{background:var(--line-2)}
.item .note{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px}
.item .note.add{color:#ADAB9F}
.item svg{width:12px;height:12px;color:#B8B6AA;flex-shrink:0}
.modal textarea.inp{width:100%;resize:vertical;font:inherit;font-size:14px}

/* ===== ΗΜΕΡΟΜΗΝΙΑ (τύπου SoftOne) ===== */
.dinp{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.when .dinp{width:130px}
.row .dinp{width:112px;padding:6px 9px;font-size:13px}
.dprev{display:block;font-size:12px;color:var(--olive-deep);font-weight:600;min-height:17px;margin-top:3px}
.dprev.bad{color:var(--red)}


/* ===== ΜΗΝΥΜΑ «ΥΠΑΡΧΕΙ ΗΔΗ ΦΑΚΕΛΟΣ» ===== */
.notice{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 14px;border-radius:9px;background:var(--wheat-tint);border:1px solid #EEDDB9;color:var(--ink);font-size:13.5px;line-height:1.5}
.notice svg{width:18px;height:18px;color:var(--wheat-dark);flex-shrink:0;margin-top:1px}
.notice b{color:var(--wheat-dark)}
#aHint.hint{margin-top:10px}
.given-kinds{font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" data-go="main">
      <img id="logo" alt="Μύλοι Αρκαδίου">
      <span class="brand-fallback" id="logoFb" hidden>ΜΑ</span>
      <span class="bt"><b>Μύλοι Αρκαδίου</b><span>ΦΑΚΕΛΟΙ ΠΕΛΑΤΩΝ</span></span>
    </a>
    <span class="net" id="net" hidden title="Οι αλλαγές δεν φτάνουν στη βάση"><span>Εκτός σύνδεσης</span></span>
    <nav class="nav" id="nav" aria-label="Πλοήγηση"></nav>
  </div>
</header>

<div class="notif-bar" id="notifBar" hidden></div>

<main class="main">
  <section class="view" id="view-login"></section>
  <section class="view" id="view-main"></section>
  <section class="view" id="view-set"></section>
</main>

<div class="modal-back" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-label="Διόρθωση ονόματος" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<datalist id="custList"></datalist>

<script>
'use strict';
/* =====================================================================
   Φάκελοι πελατών · Μύλοι Αρκαδίου · με βάση Supabase
   Στη βάση: ΜΟΝΟ όνομα πελάτη, ημέρα παράδοσης, πότε μπήκε / πότε δόθηκε.
   Το δημόσιο κλειδί (publishable) είναι φτιαγμένο για να μπαίνει σε σελίδες.
   Την προστασία την κάνει η σύνδεση με email/κωδικό + οι κανόνες RLS της βάσης.
   ΠΟΤΕ δεν μπαίνει εδώ το secret key (sb_secret_…).
   ===================================================================== */
const SB_URL = 'https://vfbznhwkuxidvvcjgpaj.supabase.co';
const SB_KEY = 'sb_publishable_DEt0kj1lYRxlglhOpUE2gw_amhEcWDA';

const LOGO_URLS = ['https://m-m-m.gr/wp-content/uploads/2024/04/logo-150.png', 'https://i.imgur.com/oDCFSVE.png'];
const LOCAL_KEY = 'arkadi-fakeloi-local-v1';   // ρυθμίσεις συσκευής, σύνδεση, προσωρινό αντίγραφο για εκτός σύνδεσης
const HISTORY_DAYS = 90;
const REFRESH_SEC = 30;
const DEFAULT_SETTINGS = { userName:'Ζωή', morningTime:'07:30', eveEnabled:true, eveTime:'14:00', sound:true };
const DAYS_FULL = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const MONTHS = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ENV_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';

/* DB = ό,τι έρχεται από τη βάση · LOCAL = μόνο σε αυτή τη συσκευή */

let LOCAL = { settings:{...DEFAULT_SETTINGS}, fired:{}, session:null, cache:null, cleanedOn:'' };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayIso = () => iso(new Date());
const tomorrowIso = () => iso(addDays(new Date(),1));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ').replace(/\s+/g,' ').trim();
const clean = s => String(s || '').replace(/\s+/g,' ').trim().slice(0,80);
/* Ονόματα πάντα με κεφαλαία, χωρίς τόνους (όπως στα ελληνικά κεφαλαία): «κουκλινός» → «ΚΟΥΚΛΙΝΟΣ» */
const upper = s => String(s || '').normalize('NFD').replace(/[\u0301\u0341]/g,'').normalize('NFC').toUpperCase();

function upperInput(el){
  el.addEventListener('input', e => {
    if (e.isComposing) return;
    const v = el.value, u = upper(v);
    if (u !== v){ const a = el.selectionStart, b = el.selectionEnd; el.value = u; try { el.setSelectionRange(a, b); } catch(_){} }
  });
}
/* Ημερομηνία όπως στο SoftOne:
   25        → 25 του τρέχοντος μήνα (αν πέρασε, 25 του επόμενου)
   2509      → 25/09 του τρέχοντος έτους
   250926 / 25092026 → πλήρης ημερομηνία
   25/9, 25.9, 25-9, 25/9/26 → επίσης
   +3        → σε 3 μέρες                                                      */
function parseDateInput(raw){
  const s = String(raw || '').trim();
  if (!s) return { ok:true, value:'' };
  const today = fromIso(todayIso());
  const plus = s.match(/^\+\s*(\d{1,3})$/);
  if (plus) return { ok:true, value: iso(addDays(today, Number(plus[1]))) };
  let d, mo, y;
  if (/^\d+$/.test(s)){
    if (s.length <= 2) d = +s;
    else if (s.length === 3){ const a = +s.slice(0,2), b = +s.slice(2); if (a >= 1 && a <= 31 && b >= 1) { d = a; mo = b; } else { d = +s.slice(0,1); mo = +s.slice(1); } }
    else if (s.length === 4){ d = +s.slice(0,2); mo = +s.slice(2); }
    else if (s.length === 6 || s.length === 8){ d = +s.slice(0,2); mo = +s.slice(2,4); y = +s.slice(4); }
    else return { ok:false };
  } else {
    const parts = s.split(/[\/.\-\s]+/).filter(Boolean);
    if (!parts.length || parts.length > 3 || !parts.every(p => /^\d{1,4}$/.test(p))) return { ok:false };
    [d, mo, y] = parts.map(Number);
  }
  const mGiven = mo !== undefined, yGiven = y !== undefined;
  if (yGiven && y < 100) y += 2000;
  if (!mGiven) mo = today.getMonth() + 1;
  if (!yGiven) y = today.getFullYear();
  const mk = (yy, mm, dd) => { const t = new Date(yy, mm - 1, dd, 12); return (t.getFullYear() === yy && t.getMonth() === mm - 1 && t.getDate() === dd) ? t : null; };
  const nextWithDay = (from, dd) => { for (let k = 1; k <= 3; k++){ const b = new Date(from.getFullYear(), from.getMonth() + k, 1, 12); const t = mk(b.getFullYear(), b.getMonth() + 1, dd); if (t) return t; } return null; };
  let dt = mk(y, mo, d);
  if (!dt && !mGiven && d >= 1 && d <= 31) dt = nextWithDay(new Date(y, mo - 1, 1, 12), d);   // π.χ. 31 σε μήνα με 30 μέρες
  if (!dt) return { ok:false };
  if (dt < today){
    if (!mGiven) dt = nextWithDay(dt, d);                                                     // μόνο μέρα που πέρασε → επόμενος μήνας
    else if (!yGiven && (today - dt) > 60 * 86400000) dt = mk(y + 1, mo, d);                  // π.χ. Δεκέμβριο γράφεις 0501
  }
  if (!dt) return { ok:false };
  const v = iso(dt);
  return v < todayIso() ? { ok:false, past:true } : { ok:true, value:v };
}
const fmtDate = v => v ? `${v.slice(8,10)}/${v.slice(5,7)}/${v.slice(0,4)}` : '';
const DATE_HELP = 'Γράψε 25 για τις 25 του μήνα, 2509 για 25/09, ή +3 για σε 3 μέρες.';
const dateError = r => r.past ? 'Η ημέρα έχει περάσει. Διάλεξε σήμερα ή επόμενη μέρα.' : `Δεν κατάλαβα την ημερομηνία. ${DATE_HELP}`;
const toMin = t => { const [h,m] = String(t || '00:00').split(':').map(Number); return (h||0)*60 + (m||0); };
const shortDate = s => { const d = fromIso(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const longDate = s => { const d = fromIso(s); return `${DAYS_FULL[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); crypto.getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(x => x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
function dayLabel(s, lower=false){
  if (s === todayIso()) return lower ? 'σήμερα' : 'Σήμερα';
  if (s === tomorrowIso()) return lower ? 'αύριο' : 'Αύριο';
  const d = fromIso(s); return `${DAYS_FULL[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function sinceText(ts){
  const n = Math.max(0, Math.round((fromIso(todayIso()) - fromIso(iso(new Date(ts)))) / 86400000));
  return `Στο stand από ${shortDate(iso(new Date(ts)))}` + (n === 0 ? ' (σήμερα)' : n === 1 ? ' (1 μέρα)' : ` (${n} μέρες)`);
}

const HAS_CLAUDE_STORAGE = !!(window.storage && typeof window.storage.get === 'function');
async function loadLocal(){
  let raw = null;
  try {
    if (HAS_CLAUDE_STORAGE){ const r = await window.storage.get(LOCAL_KEY, false); raw = r ? r.value : null; }
    else raw = window.localStorage.getItem(LOCAL_KEY);
  } catch(e){ raw = null; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    LOCAL = { settings:{...DEFAULT_SETTINGS, ...(d.settings || {})}, fired:d.fired || {}, session:d.session || null, cache:d.cache || null, cleanedOn:d.cleanedOn || '' };

}

/* ===================== SUPABASE (χωρίς βιβλιοθήκη, απευθείας REST) ===================== */
class AuthError extends Error {}
class NetError extends Error {}
async function authRequest(grant, body){
  let r;
  try {
    r = await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  } catch(e){ throw new NetError('net'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new AuthError(j.error_description || j.msg || j.error || 'auth');
  return j;
}
function setSession(j){
  LOCAL.session = {
    access_token: j.access_token,
    refresh_token: j.refresh_token,
    expires_at: Date.now() + (Number(j.expires_in) || 3600) * 1000,
    email: (j.user && j.user.email) || (LOCAL.session && LOCAL.session.email) || ''
  };
  saveLocal();
}
let refreshPromise = null;
async function accessToken(){
  const s = LOCAL.session;
  if (!s) throw new AuthError('no session');
  if (Date.now() < s.expires_at - 60000) return s.access_token;
  if (!refreshPromise){
    refreshPromise = authRequest('refresh_token', { refresh_token:s.refresh_token })
      .then(j => { setSession(j); return j.access_token; })
      .finally(() => { refreshPromise = null; });
  }
  return refreshPromise;
}
async function api(path, { method='GET', body, prefer } = {}, retried=false){
  const token = await accessToken();
  const headers = { apikey:SB_KEY, Authorization:`Bearer ${token}` };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (prefer) headers.Prefer = prefer;
  let r;
  try { r = await fetch(`${SB_URL}/rest/v1/${path}`, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new NetError('net'); }
  if (r.status === 401){
    if (retried || !LOCAL.session) throw new AuthError('expired');
    LOCAL.session.expires_at = 0;                        // δοκίμασε μία φορά με ανανεωμένο token
    return api(path, { method, body, prefer }, true);
  }
  if (!r.ok){ const t = await r.text().catch(() => ''); throw new Error(`HTTP ${r.status} ${t.slice(0,200)}`); }
  if (r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const fromRow = r => ({

  LOCAL.session = null; LOCAL.cache = null; saveLocal();

function handleError(err, msg, silent=false){
  if (err instanceof AuthError){ logout('Η σύνδεση έληξε. Συνδέσου ξανά.'); return; }
  setOnline(false);
  if (!silent) toast(`${esc(msg)} Έλεγξε τη σύνδεση στο internet και ξαναδοκίμασε.`, { sticky:true });
  else if (!(err instanceof NetError)) console.warn(err);
}

let refreshing = false;
async function refresh(){
  if (!LOCAL.session || refreshing || pendingOps) return;
  refreshing = true;
  try {
    const [envs, custs] = await Promise.all([
      api('envelopes?select=id,name,date,kind,note,added_at,given_at&order=added_at.asc'),
      api('customers?select=id,name,name_key&order=name.asc')
    ]);
    if (pendingOps) return;   // μην πατήσεις πάνω σε αλλαγή που μόλις έγινε
    DB.envelopes = (envs || []).map(fromRow);
    DB.customers = (custs || []).map(c => ({ id:c.id, name:c.name, key:c.name_key }));
    setOnline(true); cacheData();
    renderAll(); checkReminders();
    cleanupHistory();
    uppercaseLegacy().then(unifyDates);
  } catch(e){ handleError(e, 'Δεν ενημερώθηκαν οι φάκελοι.', true); }
  finally { refreshing = false; }
}
/* Άμεση αλλαγή στην οθόνη, αποστολή στη βάση, επιστροφή αν αποτύχει */
async function mutate(apply, request, rollback, errMsg){
  apply(); renderAll();
  pendingOps++;
  try { await request(); setOnline(true); cacheData(); }
  catch(e){ rollback(); renderAll(); handleError(e, errMsg); }
  finally { pendingOps--; }
}
/* Ονόματα που γράφτηκαν με μικρά πριν από αυτή την έκδοση: περνάνε μία φορά σε κεφαλαία */
let upperRunning = false;
async function uppercaseLegacy(){
  const envNames = [...new Set(DB.envelopes.map(e => e.name).filter(n => n !== upper(n)))];
  const custs = DB.customers.filter(c => c.name !== upper(c.name));
  if ((!envNames.length && !custs.length) || upperRunning) return;
  upperRunning = true;
  try {
    for (const n of envNames) await api(`envelopes?name=eq.${encodeURIComponent(n)}`, { method:'PATCH', body:{ name:upper(n) }, prefer:'return=minimal' });
    for (const c of custs) await api(`customers?name_key=eq.${encodeURIComponent(c.key || norm(c.name))}`, { method:'PATCH', body:{ name:upper(c.name) }, prefer:'return=minimal' });
    DB.envelopes.forEach(e => e.name = upper(e.name));
    DB.customers.forEach(c => c.name = upper(c.name));
    cacheData(); renderAll();
  } catch(e){} finally { upperRunning = false; }
}
async function cleanupHistory(){
  if (LOCAL.cleanedOn === todayIso()) return;
  const cutoff = addDays(new Date(), -HISTORY_DAYS).toISOString();
  try {
    await api(`envelopes?given_at=lt.${encodeURIComponent(cutoff)}`, { method:'DELETE' });
    LOCAL.cleanedOn = todayIso(); saveLocal();
  } catch(e){}
}

/* ===================== TOASTS ===================== */
function toast(html, {action=null, sticky=false, kind=''} = {}){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t-msg">${html}</div>`;
  if (action){
    const b = document.createElement('button'); b.className = 't-act'; b.textContent = action.label;
    b.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(b);
  }
  const x = document.createElement('button'); x.className = 't-x'; x.textContent = '×'; x.setAttribute('aria-label','Κλείσιμο');
  x.onclick = () => el.remove(); el.appendChild(x);
  box.appendChild(el);
  while (box.children.length > 5) box.firstChild.remove();
  if (!sticky) setTimeout(() => el.remove(), 6500);
}

const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const notifState = () => ('Notification' in window) ? Notification.permission : 'unsupported';
async function enableNotifs(){
  if (notifState() === 'unsupported'){ toast('Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις υπολογιστή.'); renderAll(); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') toast('Οι ειδοποιήσεις υπολογιστή ενεργοποιήθηκαν.');
    else toast(IN_FRAME ? 'Μέσα στο Claude ο browser δεν επιτρέπει ειδοποιήσεις υπολογιστή. Οι υπενθυμίσεις εμφανίζονται μέσα στη σελίδα.'
                        : 'Οι ειδοποιήσεις δεν επιτράπηκαν. Άλλαξέ το από το εικονίδιο αριστερά της διεύθυνσης.');
  } catch(e){ toast('Ο browser μπλόκαρε το αίτημα για ειδοποιήσεις.'); }
  renderAll();
}
function remind(title, body, tag){
  if (notifState() === 'granted'){
    try {
      const n = new Notification(title, { body, tag, icon: LOGO_URLS[0], requireInteraction: true });
      n.onclick = () => { window.focus(); go('main'); n.close(); };
    } catch(e){}
  }
  toast(`<b>${esc(title)}</b><br>${esc(body)}`, { sticky:true, kind:'alert' });
}
let actx = null;
function beep(){
  if (!LOCAL.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    [[660,0],[880,.18]].forEach(([f,dt]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(.18, t0+dt+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.35);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+dt); o.stop(t0+dt+.4);
    });
  } catch(e){}
}
document.addEventListener('pointerdown', () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
}, { once:true });

/* Κάθε φάκελος ειδοποιεί μία φορά τη μέρα, σε κάθε υπολογιστή που έχει ανοιχτή την εφαρμογή:
   day = παράδοση σήμερα · eve = παράδοση αύριο · miss = πέρασε η μέρα και είναι ακόμα στο stand */
function checkReminders(){
  if (!LOCAL.session) return;
  const now = new Date(), t = iso(now), tm = tomorrowIso(), mins = now.getHours()*60 + now.getMinutes(), S = LOCAL.settings;
  const due = [];
  const mark = (kind, env) => { const k = `${t}|${kind}|${env.id}`; if (!LOCAL.fired[k]){ LOCAL.fired[k] = 1; due.push({ kind, env }); } };
  pending().forEach(env => {
    if (!env.date) return;
    if (mins >= toMin(S.morningTime)){ if (env.date === t) mark('day', env); else if (env.date < t) mark('miss', env); }
    if (S.eveEnabled && mins >= toMin(S.eveTime) && env.date === tm) mark('eve', env);
  });
  updateTitle();
  if (!due.length) return;
  saveLocal();
  // ένα μήνυμα ανά φάκελο (πελάτη), με ό,τι έχει μέσα
  const fire = (kind, one, many) => {
    const list = groupsOf(due.filter(d => d.kind === kind).map(d => d.env)).map(g => groupsOf(envelopeOf(g.name))[0] || g);
    if (!list.length) return;
    if (list.length <= 3) list.forEach(g => { const [a,b] = one(g); remind(a, b, `${kind}-${norm(g.name)}`); });
    else { const [a,b] = many(list); remind(a, b, `${kind}-summary`); }
  };
  const inside = g => { const s = docSummary(g.items); return s ? ` (${s})` : ''; };
  const notesOf = g => { const ns = g.items.map(e => e.note).filter(Boolean); return ns.length ? ` Σχόλιο: ${ns.join(' / ')}` : ''; };
  fire('day',  g => [`Φάκελος για ${g.name}${inside(g)}`, `Έχει παράδοση σήμερα. Δώσε τον φάκελο στον οδηγό.${notesOf(g)}`],
               l => [`${l.length} φάκελοι φεύγουν σήμερα`, l.map(g => g.name).join(', ')]);
  fire('eve',  g => [`Αύριο: φάκελος για ${g.name}${inside(g)}`, `Έχει παράδοση αύριο. Ετοίμασε τον φάκελο από το stand.${notesOf(g)}`],
               l => [`${l.length} φάκελοι για αύριο`, l.map(g => g.name).join(', ')]);
  fire('miss', g => [`Ο φάκελος για ${g.name} είναι ακόμα στο stand`, `Η παράδοση ήταν ${dayLabel(g.date, true)}. Αν δόθηκε, πάτα «Δόθηκε». Αλλιώς βάλε νέα ημέρα.`],
               l => [`${l.length} φάκελοι έμειναν στο stand`, l.map(g => g.name).join(', ')]);
  beep();
}
function pruneFired(){
  const fcut = iso(addDays(new Date(), -7));
  Object.keys(LOCAL.fired).forEach(k => { if (k.slice(0,10) < fcut) delete LOCAL.fired[k]; });
}
function updateTitle(){
  const n = LOCAL.session ? groupsOf(pending()).filter(g => g.date === todayIso()).length : 0;
  document.title = n ? `(${n}) Φάκελοι σήμερα | Μύλοι Αρκαδίου` : 'Φάκελοι | Μύλοι Αρκαδίου';
}

/* ===================== ΚΥΡΙΑ ΣΕΛΙΔΑ ===================== */
/* Ένας πελάτης = ένας φάκελος στο stand. Μέσα μπαίνουν όσα έγγραφα χρειάζεται
   (αποδείξεις / τιμολόγια). Στη βάση κάθε γραμμή είναι ένα έγγραφο· ο φάκελος είναι
   όλα τα έγγραφα του πελάτη που δεν έχουν δοθεί ακόμα, με κοινή ημέρα παράδοσης. */
const KINDS = { apodeixi:'Απόδειξη', timologio:'Τιμολόγιο' };
const NOTE_MAX = 200;
let addKind = 'apodeixi', kindFilter = '', query = '';

function docSummary(items){
  const t = items.filter(e => e.kind === 'timologio').length, a = items.filter(e => e.kind === 'apodeixi').length;
  const u = items.length - t - a;
  const parts = [];
  if (t) parts.push(t === 1 ? '1 τιμολόγιο' : `${t} τιμολόγια`);
  if (a) parts.push(a === 1 ? '1 απόδειξη' : `${a} αποδείξεις`);
  if (u) parts.push(u === 1 ? '1 χωρίς είδος' : `${u} χωρίς είδος`);
  return parts.join(', ');
}
const docsCount = n => n === 1 ? '1 έγγραφο' : `${n} έγγραφα`;
/* Κοινή ημέρα του φακέλου: η πιο κοντινή μελλοντική, αλλιώς η πιο πρόσφατη που πέρασε */
function groupDate(items){
  const ds = [...new Set(items.map(e => e.date).filter(Boolean))].sort();
  const up = ds.filter(d => d >= todayIso());
  return up.length ? up[0] : (ds.length ? ds[ds.length - 1] : '');
}
function groupsOf(list){
  const m = new Map();
  list.forEach(e => { const k = norm(e.name); if (!m.has(k)) m.set(k, { name:e.name, items:[] }); m.get(k).items.push(e); });
  return [...m.values()].map(g => {
    g.items.sort((a,b) => a.addedAt.localeCompare(b.addedAt));
    g.addedAt = g.items[0].addedAt;
    g.date = groupDate(g.items);
    g.ids = g.items.map(e => e.id).join(',');
    return g;
  });
}
const envelopeOf = name => pending().filter(e => norm(e.name) === norm(name));
const kindSeg = (sel, attr, withAll=false) => `<div class="seg" role="radiogroup">${withAll ? `<button type="button" role="radio" aria-checked="${sel === ''}" class="${sel === '' ? 'on' : ''}" data-${attr}="">Όλα</button>` : ''}${Object.entries(KINDS).map(([k,v]) =>
  `<button type="button" role="radio" aria-checked="${sel === k}" class="${sel === k ? 'on' : ''}" data-${attr}="${k}">${withAll ? (k === 'apodeixi' ? 'Αποδείξεις' : 'Τιμολόγια') : v}</button>`).join('')}</div>`;
const matchesQuery = (name, q) => !q || q.split(' ').every(w => norm(name).includes(w));
const idsFilter = ids => ids.length === 1 ? `id=eq.${ids[0]}` : `id=in.(${ids.join(',')})`;
const docsByIds = idsStr => String(idsStr || '').split(',').map(id => DB.envelopes.find(e => e.id === id)).filter(Boolean);
const docBody = e => ({ id:e.id, name:e.name, date:e.date || null, kind:e.kind || null, note:e.note || null, added_at:e.addedAt, given_at:e.givenAt || null });

function buildMain(){

function previewAddDate(){

/* Το μήνυμα κάτω από τη φόρμα: αν υπάρχει ήδη φάκελος, το λέει καθαρά */
function updateHint(){
  const name = cleanName($('aCust').value);
  const docs = name ? envelopeOf(name) : [];
  const btn = $('aAdd');
  if (!docs.length){
    btn.textContent = 'Νέος φάκελος';
    $('aHint').className = 'hint';
    $('aHint').innerHTML = `Ημερομηνία: ${DATE_HELP} Αν δεν την ξέρεις, άφησέ την κενή.`;
    return;
  }
  const g = groupsOf(docs)[0];
  const r = parseDateInput($('aDate').value);
  const changes = r.ok && r.value && r.value !== g.date;
  btn.textContent = 'Προσθήκη στον φάκελο';
  $('aHint').className = 'notice';
  $('aHint').innerHTML = `${ENV_SVG}<div><b>Υπάρχει ήδη φάκελος για ${esc(g.name)}</b> με ${esc(docSummary(g.items))}${g.date ? `, παράδοση ${esc(dayLabel(g.date, true))}` : ', χωρίς ημέρα'}.
    ${addKind === 'timologio' ? 'Το νέο τιμολόγιο θα μπει' : 'Η νέα απόδειξη θα μπει'} στον ίδιο φάκελο${changes ? `, και η ημέρα όλου του φακέλου θα γίνει ${esc(dayLabel(r.value, true))}` : ''}.</div>`;
}
function rememberCustomer(name){
  name = upper(name);
  const key = norm(name);
  if (DB.customers.some(c => (c.key || norm(c.name)) === key)) return;
  const c = { id:uuid(), name, key };
  mutate(
    () => { DB.customers.push(c); sortCustomers(); },
    () => api('customers?on_conflict=name_key', { method:'POST', body:{ id:c.id, name, name_key:key }, prefer:'resolution=ignore-duplicates,return=minimal' }),
    () => { DB.customers = DB.customers.filter(x => x !== c); },
    'Δεν αποθηκεύτηκε ο πελάτης στη λίστα.'
  );
}
const sortCustomers = () => DB.customers.sort((a,b) => a.name.localeCompare(b.name,'el'));

function addDocument(){
  const typed = cleanName($('aCust').value);
  if (!typed){ $('aCust').focus(); return; }
  const pd = parseDateInput($('aDate').value);
  if (!pd.ok){ $('aHint').className = 'hint'; $('aHint').innerHTML = `<span class="bad">${esc(dateError(pd))}</span>`; $('aDate').focus(); return; }
  const existing = envelopeOf(typed);
  const name = upper(existing.length ? existing[0].name : (customerNames().find(n => norm(n) === norm(typed)) || typed));
  const note = clean($('aNote').value).slice(0, NOTE_MAX), kind = addKind;
  const doc = { id:uuid(), name, date:'', kind, note, addedAt:new Date().toISOString(), givenAt:null };
  $('aCust').value = ''; $('aDate').value = ''; $('aNote').value = ''; previewAddDate(); updateHint(); $('aCust').focus();

  if (existing.length){
    /* Μπαίνει στον φάκελο που υπάρχει ήδη */
    const oldDate = groupDate(existing);
    const newDate = pd.value || oldDate;
    const dateChanged = newDate !== oldDate || existing.some(e => (e.date || '') !== newDate);
    const prev = existing.map(e => [e, e.date]);
    doc.date = newDate;
    mutate(
      () => { DB.envelopes.push(doc); existing.forEach(e => e.date = newDate); },
      async () => {
        await api('envelopes', { method:'POST', body:docBody(doc), prefer:'return=minimal' });
        if (dateChanged) await api(`envelopes?${idsFilter(existing.map(e => e.id))}`, { method:'PATCH', body:{ date:newDate || null }, prefer:'return=minimal' });
      },
      () => { DB.envelopes = DB.envelopes.filter(e => e.id !== doc.id); prev.forEach(([e,d]) => e.date = d); },
      `Δεν μπήκε στον φάκελο του ${name}.`
    ).then(() => checkReminders());
    /* ίδιος φάκελος → όχι δεύτερη υπενθύμιση για σήμερα, εκτός αν άλλαξε η ημέρα */
    if (!dateChanged){
      const t = todayIso();
      ['day','eve','miss'].forEach(k => { if (existing.some(e => LOCAL.fired[`${t}|${k}|${e.id}`])) LOCAL.fired[`${t}|${k}|${doc.id}`] = 1; });
      saveLocal();
    }
    toast(`Μπήκε στον υπάρχοντα φάκελο του ${esc(name)}. Μέσα τώρα: ${esc(docSummary([...existing, doc]))}.${pd.value && dateChanged ? ` Νέα ημέρα παράδοσης: ${esc(dayLabel(newDate, true))}.` : ''}`);
    return;
  }
  /* Νέος φάκελος */
  doc.date = pd.value;
  mutate(
    () => { DB.envelopes.push(doc); },
    () => api('envelopes', { method:'POST', body:docBody(doc), prefer:'return=minimal' }),
    () => { DB.envelopes = DB.envelopes.filter(e => e.id !== doc.id); },
    `Δεν αποθηκεύτηκε ο φάκελος για ${name}.`
  ).then(() => checkReminders());
  rememberCustomer(name);
  toast(`Νέος φάκελος για ${esc(name)} (${KINDS[kind].toLowerCase()})${doc.date ? `, παράδοση ${esc(dayLabel(doc.date, true))}` : ', χωρίς ημέρα ακόμα'}.`);
}
function giveGroup(idsStr, btn){
  const docs = docsByIds(idsStr).filter(e => !e.givenAt);
  if (!docs.length) return;
  const ids = docs.map(e => e.id), stamp = new Date().toISOString(), name = docs[0].name;
  const card = btn && btn.closest('.env,.row');
  const run = () => mutate(
    () => { docs.forEach(e => e.givenAt = stamp); },
    () => api(`envelopes?${idsFilter(ids)}`, { method:'PATCH', body:{ given_at:stamp }, prefer:'return=minimal' }),
    () => { docs.forEach(e => e.givenAt = null); },
    `Δεν σημειώθηκε ο φάκελος για ${name}.`
  );
  if (card && !REDUCE){ card.classList.add('leaving'); setTimeout(run, 200); } else run();
  toast(`Δόθηκε ο φάκελος: ${esc(name)}${docs.length > 1 ? ` (${esc(docSummary(docs))})` : ''}.`, { action:{ label:'Αναίρεση', fn:() => mutate(
    () => { docs.forEach(e => e.givenAt = null); },
    () => api(`envelopes?${idsFilter(ids)}`, { method:'PATCH', body:{ given_at:null }, prefer:'return=minimal' }),
    () => { docs.forEach(e => e.givenAt = stamp); },
    'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}
/* × σε γραμμή: αφαιρεί όλο τον φάκελο (λάθος καταχώρηση), με αναίρεση */
function removeEnvelope(idsStr){
  const docs = docsByIds(idsStr);
  if (!docs.length) return;
  const ids = docs.map(e => e.id);
  mutate(
    () => { DB.envelopes = DB.envelopes.filter(e => !ids.includes(e.id)); },
    () => api(`envelopes?${idsFilter(ids)}`, { method:'DELETE', prefer:'return=minimal' }),
    () => { DB.envelopes.push(...docs); },
    `Δεν αφαιρέθηκε ο φάκελος για ${docs[0].name}.`
  );
  toast(`Αφαιρέθηκε ο φάκελος: ${esc(docs[0].name)}${docs.length > 1 ? ` (${esc(docsCount(docs.length))})` : ''}.`, { action:{ label:'Αναίρεση', fn:() => mutate(
    () => { DB.envelopes.push(...docs); },
    () => api('envelopes', { method:'POST', body:docs.map(docBody), prefer:'return=minimal' }),
    () => { DB.envelopes = DB.envelopes.filter(e => !ids.includes(e.id)); },
    'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}
/* Αφαίρεση ενός εγγράφου από τον φάκελο (από το παράθυρο του εγγράφου) */
function removeDoc(id){
  const doc = DB.envelopes.find(e => e.id === id);
  if (!doc) return;
  const left = envelopeOf(doc.name).length - 1;
  mutate(
    () => { DB.envelopes = DB.envelopes.filter(e => e.id !== id); },
    () => api(`envelopes?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' }),
    () => { DB.envelopes.push(doc); },
    'Δεν αφαιρέθηκε από τον φάκελο.'
  );
  toast(left > 0 ? `${KINDS[doc.kind] || 'Το έγγραφο'} βγήκε από τον φάκελο του ${esc(doc.name)}.` : `Αφαιρέθηκε ο φάκελος: ${esc(doc.name)}.`, { action:{ label:'Αναίρεση', fn:() => mutate(
    () => { DB.envelopes.push(doc); },
    () => api('envelopes', { method:'POST', body:docBody(doc), prefer:'return=minimal' }),
    () => { DB.envelopes = DB.envelopes.filter(e => e.id !== doc.id); },
    'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}
/* Επαναφορά στο stand: αν ο πελάτης έχει ήδη φάκελο, τα έγγραφα μπαίνουν σε αυτόν */
function restoreGiven(idsStr){
  const docs = docsByIds(idsStr).filter(e => e.givenAt);
  if (!docs.length) return;
  const existing = envelopeOf(docs[0].name);
  const old = groupDate(docs);
  const date = existing.length ? groupDate(existing) : (old && old >= todayIso() ? old : '');
  const prev = docs.map(e => [e, e.givenAt, e.date]);
  mutate(
    () => { docs.forEach(e => { e.givenAt = null; e.date = date; }); },
    () => api(`envelopes?${idsFilter(docs.map(e => e.id))}`, { method:'PATCH', body:{ given_at:null, date:date || null }, prefer:'return=minimal' }),
    () => { prev.forEach(([e,g,d]) => { e.givenAt = g; e.date = d; }); },
    'Η επαναφορά δεν αποθηκεύτηκε.'
  );
  toast(existing.length ? `Μπήκε ξανά στον φάκελο του ${esc(docs[0].name)} που είναι στο stand.` : `Ο φάκελος για ${esc(docs[0].name)} γύρισε στο stand.`);
}
function setGroupDate(idsStr, value){
  const docs = docsByIds(idsStr);
  if (!docs.length) return;
  if (value && value < todayIso()){ toast('Η ημέρα έχει περάσει. Διάλεξε σήμερα ή επόμενη μέρα.'); renderAll(); return; }
  const prev = docs.map(e => [e, e.date]);
  mutate(
    () => { docs.forEach(e => e.date = value || ''); },
    () => api(`envelopes?${idsFilter(docs.map(e => e.id))}`, { method:'PATCH', body:{ date:value || null }, prefer:'return=minimal' }),
    () => { prev.forEach(([e,d]) => e.date = d); },
    'Η νέα ημέρα δεν αποθηκεύτηκε.'
  ).then(() => checkReminders());
  toast(value ? `${esc(docs[0].name)}: παράδοση ${esc(dayLabel(value, true))}.` : `${esc(docs[0].name)}: χωρίς ημέρα.`);
}
/* Αν ένας φάκελος έχει έγγραφα με διαφορετικές ημέρες (π.χ. από παλιότερη έκδοση ή μετά
   από διόρθωση ονόματος που ένωσε δύο πελάτες), τα φέρνει όλα στην ίδια ημέρα */
let unifying = false;
async function unifyDates(){
  if (unifying) return;
  const fixes = groupsOf(pending()).map(g => ({ g, wrong: g.items.filter(e => (e.date || '') !== g.date) })).filter(x => x.wrong.length);
  if (!fixes.length) return;
  unifying = true;
  try {
    for (const { g, wrong } of fixes){
      await api(`envelopes?${idsFilter(wrong.map(e => e.id))}`, { method:'PATCH', body:{ date:g.date || null }, prefer:'return=minimal' });
      wrong.forEach(e => e.date = g.date);
    }
    cacheData(); renderAll();
  } catch(e){} finally { unifying = false; }
}

/* ---------- Ένα έγγραφο: είδος, σχόλιο, αφαίρεση ---------- */
function openEdit(id){
  const doc = DB.envelopes.find(e => e.id === id);
  if (!doc) return;
  let kind = doc.kind || '';
  const box = $('modalBox');
  const draw = () => {
    box.innerHTML = `
      <h2>${doc.kind ? KINDS[doc.kind] : 'Έγγραφο'} στον φάκελο του ${esc(doc.name)}</h2>
      <p>Μπήκε ${shortDate(iso(new Date(doc.addedAt)))}${doc.date ? `. Παράδοση ${esc(dayLabel(doc.date, true))}.` : '.'}</p>
      <div class="f" style="margin-bottom:12px"><span>Είδος</span>${kindSeg(kind, 'ekind')}</div>
      <label class="f"><span>Σχόλιο</span><textarea class="inp" id="eNote" rows="3" maxlength="${NOTE_MAX}" placeholder="π.χ. στα χέρια του ιδιοκτήτη">${esc(doc.note)}</textarea></label>
      <p class="hint">Μόνο οδηγίες για τον φάκελο. Όχι ποσά ή στοιχεία πληρωμής.</p>
      <div class="m-f">
        ${doc.givenAt ? '' : '<button class="btn danger-ghost" data-m="remove" style="margin-right:auto">Αφαίρεση από τον φάκελο</button>'}
        <button class="btn ghost" data-m="cancel">Ακύρωση</button><button class="btn primary" data-m="save">Αποθήκευση</button>
      </div>`;
  };
  const close = () => { $('modal').hidden = true; box.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const save = () => {
    const note = clean($('eNote').value).slice(0, NOTE_MAX);
    const prev = { kind:doc.kind, note:doc.note };
    close();
    if (note === doc.note && kind === doc.kind) return;
    mutate(
      () => { doc.kind = kind; doc.note = note; },
      () => api(`envelopes?id=eq.${doc.id}`, { method:'PATCH', body:{ kind: kind || null, note: note || null }, prefer:'return=minimal' }),
      () => { doc.kind = prev.kind; doc.note = prev.note; },
      'Οι αλλαγές δεν αποθηκεύτηκαν.'
    );
    toast(`Αποθηκεύτηκε στον φάκελο του ${esc(doc.name)}.`);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  box.onclick = e => {
    const k = e.target.closest('[data-ekind]');
    if (k){ const note = $('eNote').value; kind = k.dataset.ekind; draw(); $('eNote').value = note; return; }
    const b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.m === 'cancel') close();
    if (b.dataset.m === 'save') save();
    if (b.dataset.m === 'remove'){ close(); removeDoc(doc.id); }
  };
  $('modal').onclick = e => { if (e.target === $('modal')) close(); };
  document.addEventListener('keydown', onKey);
  draw();
  $('modal').hidden = false;

/* ---------- Διόρθωση ονόματος: αλλάζει σε όλα τα έγγραφα και στη λίστα πελατών ---------- */
function openRename(oldName){
  const box = $('modalBox');
  box.innerHTML = `
    <h2>Διόρθωση ονόματος</h2>
    <p>Αλλάζει στον φάκελο του πελάτη και στο ιστορικό του.</p>
    <label class="f"><span>Σωστό όνομα</span><input class="inp" id="rName" list="custList" value="${esc(oldName)}" autocomplete="off"></label>
    <p class="hint" id="rHint"></p>
    <div class="m-f"><button class="btn ghost" data-m="cancel">Ακύρωση</button><button class="btn primary" data-m="save">Αποθήκευση</button></div>`;
  const inp = $('rName'), hint = $('rHint');
  upperInput(inp);
  const check = () => {
    const v = cleanName(inp.value);
    const other = v && norm(v) !== norm(oldName) ? customerNames().find(n => norm(n) === norm(v)) : null;
    hint.innerHTML = other ? `Υπάρχει ήδη πελάτης «${esc(other)}»${envelopeOf(other).length ? ' με φάκελο στο stand' : ''}. Θα γίνουν ένας φάκελος.` : '';
  };
  const close = () => { $('modal').hidden = true; box.innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const save = () => {
    const v = cleanName(inp.value);
    if (!v){ hint.innerHTML = '<span class="bad">Γράψε το σωστό όνομα.</span>'; return; }
    const target = customerNames().find(n => norm(n) === norm(v) && norm(n) !== norm(oldName)) || v;
    close();
    if (target !== oldName) renameCustomer(oldName, target);
  };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'Enter' && document.activeElement === inp){ e.preventDefault(); save(); } };
  inp.addEventListener('input', check);
  box.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; if (b.dataset.m === 'cancel') close(); if (b.dataset.m === 'save') save(); };
  $('modal').onclick = e => { if (e.target === $('modal')) close(); };
  document.addEventListener('keydown', onKey);
  $('modal').hidden = false;
  setTimeout(() => { inp.focus(); inp.select(); }, 30);
}
function renameCustomer(oldName, newName){
  const oldKey = norm(oldName), newKey = norm(newName);
  const docs = DB.envelopes.filter(e => norm(e.name) === oldKey);
  const prevNames = docs.map(e => [e, e.name]);
  const snap = JSON.parse(JSON.stringify(DB.customers));
  const cust = DB.customers.find(c => (c.key || norm(c.name)) === oldKey);
  const target = oldKey !== newKey ? DB.customers.find(c => (c.key || norm(c.name)) === newKey) : null;
  mutate(
    () => {
      docs.forEach(e => e.name = newName);
      if (cust && target) DB.customers = DB.customers.filter(c => c !== cust);
      else if (cust){ cust.name = newName; cust.key = newKey; }
      else if (!target) DB.customers.push({ id:uuid(), name:newName, key:newKey });
      sortCustomers();
    },
    async () => {
      if (docs.length) await api(`envelopes?${idsFilter(docs.map(e => e.id))}`, { method:'PATCH', body:{ name:newName }, prefer:'return=minimal' });
      if (cust && target) await api(`customers?name_key=eq.${encodeURIComponent(oldKey)}`, { method:'DELETE', prefer:'return=minimal' });
      else if (cust) await api(`customers?name_key=eq.${encodeURIComponent(oldKey)}`, { method:'PATCH', body:{ name:newName, name_key:newKey }, prefer:'return=minimal' });
      else if (!target) await api('customers?on_conflict=name_key', { method:'POST', body:{ name:newName, name_key:newKey }, prefer:'resolution=ignore-duplicates,return=minimal' });
    },
    () => { prevNames.forEach(([e,n]) => e.name = n); DB.customers = snap; },
    'Η διόρθωση ονόματος δεν αποθηκεύτηκε.'
  ).then(() => unifyDates());
  toast(`Το όνομα άλλαξε: ${esc(oldName)} → ${esc(newName)}.`);
}

/* Ιστορικό: ένας φάκελος = τα έγγραφα του ίδιου πελάτη που δόθηκαν μαζί */
function givenGroups(list){
  const m = new Map();
  list.forEach(e => { const k = norm(e.name) + '|' + e.givenAt; if (!m.has(k)) m.set(k, { name:e.name, givenAt:e.givenAt, items:[] }); m.get(k).items.push(e); });
  return [...m.values()].sort((a,b) => b.givenAt.localeCompare(a.givenAt));
}
function givenRows(groups){
  return `<div class="rows">${groups.map(g => {
    const notes = g.items.map(e => e.note).filter(Boolean);
    return `<div class="row"><div class="r-main"><b>${esc(g.name)}</b> <span class="given-kinds">${esc(docSummary(g.items))}</span>${notes.length ? `<small>${esc(notes.join(' / '))}</small>` : ''}<small>Δόθηκε ${iso(new Date(g.givenAt)) === todayIso() ? 'σήμερα' : shortDate(iso(new Date(g.givenAt)))} στις ${hhmm(g.givenAt)}</small></div>
      <button class="btn ghost sm" data-act="restore" data-ids="${g.items.map(e => e.id).join(',')}">Επαναφορά στο stand</button></div>`;
  }).join('')}</div>`;
}
function renderMain(){
  if (!$('lists')) return;
  const active = document.activeElement;
  if (active && active.matches && active.matches('[data-date]')) return;   // μη σβήνεις ό,τι γράφει εκείνη τη στιγμή
  const t = todayIso(), tm = tomorrowIso(), now = new Date(), S = LOCAL.settings;
  const byName = (a,b) => a.name.localeCompare(b.name,'el');
  const allG = groupsOf(pending());
  const G = allG.filter(g => matchesQuery(g.name, query) && (!kindFilter || g.items.some(e => e.kind === kindFilter)));
  const today = G.filter(g => g.date === t).sort(byName);
  const missed = G.filter(g => g.date && g.date < t).sort((a,b) => a.date.localeCompare(b.date));
  const tmr = G.filter(g => g.date === tm).sort(byName);
  const later = G.filter(g => g.date && g.date > tm).sort((a,b) => a.date.localeCompare(b.date) || byName(a,b));
  const nodate = G.filter(g => !g.date).sort((a,b) => a.addedAt.localeCompare(b.addedAt));

  $('hello').textContent = `${now.getHours() < 12 ? 'Καλημέρα' : 'Καλησπέρα'}${S.userName ? ', ' + S.userName : ''}`;
  const todayAll = allG.filter(g => g.date === t).length;
  const sub = !allG.length ? 'Το stand είναι άδειο.'
    : (todayAll ? `${todayAll === 1 ? 'Ένας φάκελος φεύγει' : todayAll + ' φάκελοι φεύγουν'} σήμερα.` : 'Κανένας φάκελος δεν φεύγει σήμερα.')
      + ` Στο stand: ${allG.length === 1 ? '1 φάκελος' : allG.length + ' φάκελοι'}.`;
  $('sub').innerHTML = `<span class="date">${longDate(t)}.</span> ${sub}`;

  const given = DB.envelopes.filter(e => e.givenAt);
  let html = '';
  if (query){
    const gHits = givenGroups(given.filter(e => matchesQuery(e.name, query) && (!kindFilter || e.kind === kindFilter))).slice(0, 20);
    $('qInfo').hidden = false;
    $('qInfo').innerHTML = G.length
      ? `<b>Ναι.</b> ${G.length === 1 ? 'Υπάρχει φάκελος' : `${G.length} φάκελοι`} στο stand: ${G.map(g => `${esc(g.name)} (${esc(docSummary(g.items))}${g.date ? `, παράδοση ${esc(dayLabel(g.date, true))}` : ''})`).join('· ')}.`
      : `<b>Όχι.</b> Κανένας φάκελος στο stand για «${esc($('q').value.trim())}».${gHits.length ? ' Από κάτω όσοι έχουν ήδη δοθεί.' : ''}`;
    if (today.length) html += section('ΦΕΥΓΟΥΝ ΣΗΜΕΡΑ', `<div class="env-grid">${today.map(envCard).join('')}</div>`);
    if (missed.length) html += section('ΕΜΕΙΝΑΝ ΣΤΟ STAND', `<div class="rows bad">${missed.map(g => row(g, `Η παράδοση ήταν ${esc(dayLabel(g.date, true))}.`, true)).join('')}</div>`, true);
    const rest = [...tmr, ...later, ...nodate];
    if (rest.length) html += section('ΣΤΟ STAND', `<div class="rows">${rest.map(g => row(g, `${g.date ? esc(dayLabel(g.date)) + '. ' : 'Χωρίς ημέρα. '}${sinceText(g.addedAt)}`)).join('')}</div>`);
    if (gHits.length) html += section('ΔΟΘΗΚΑΝ', givenRows(gHits));
    $('lists').innerHTML = html;
    return;
  }
  $('qInfo').hidden = true;

  html += section('ΦΕΥΓΟΥΝ ΣΗΜΕΡΑ', today.length
    ? `<div class="env-grid">${today.map(envCard).join('')}</div>`
    : `<div class="empty">${kindFilter ? (kindFilter === 'timologio' ? 'Κανένας φάκελος με τιμολόγιο για σήμερα.' : 'Κανένας φάκελος με απόδειξη για σήμερα.') : allG.length ? 'Κανένας φάκελος για σήμερα.' : 'Όταν μπαίνει φάκελος στο stand, γράψε τον πελάτη από πάνω.'}</div>`);
  if (missed.length) html += section('ΕΜΕΙΝΑΝ ΣΤΟ STAND', `<div class="rows bad">${missed.map(g => row(g, `Η παράδοση ήταν ${esc(dayLabel(g.date, true))}. Αν δόθηκε, πάτα «Δόθηκε». Αλλιώς βάλε νέα ημέρα.`, true)).join('')}</div>`, true);
  if (tmr.length) html += section('ΑΥΡΙΟ', `<div class="rows">${tmr.map(g => row(g, sinceText(g.addedAt))).join('')}</div>`);
  if (later.length) html += section('ΕΠΟΜΕΝΕΣ ΜΕΡΕΣ', `<div class="rows">${later.map(g => row(g, `${esc(dayLabel(g.date))}. ${sinceText(g.addedAt)}`)).join('')}</div>`);
  if (nodate.length) html += section('ΧΩΡΙΣ ΗΜΕΡΑ ΠΑΡΑΔΟΣΗΣ', `<div class="rows">${nodate.map(g => row(g, `${sinceText(g.addedAt)}. Βάλε ημέρα για να έρθει υπενθύμιση.`)).join('')}</div>`);

  const recent = givenGroups(given.filter(e => e.givenAt >= addDays(now, -14).toISOString()));
  if (recent.length) html += `<details class="given"><summary>Δόθηκαν τις τελευταίες 14 μέρες (${recent.length})</summary>${givenRows(recent)}</details>`;

  const wasOpen = document.querySelector('.given') && document.querySelector('.given').open;
  $('lists').innerHTML = html;
  if (wasOpen && document.querySelector('.given')) document.querySelector('.given').open = true;
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const kb = e.target.closest('[data-kind]');
  if (kb){ addKind = kb.dataset.kind; $('aKind').innerHTML = kindSeg(addKind, 'kind'); updateHint(); return; }
  const kf = e.target.closest('[data-kfilter]');
  if (kf){ kindFilter = kf.dataset.kfilter; $('kFilter').innerHTML = kindSeg(kindFilter, 'kfilter', true); renderMain(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'give': giveGroup(a.dataset.ids, a); break;
    case 'rm': removeEnvelope(a.dataset.ids); break;
    case 'rename': openRename(a.dataset.name); break;
    case 'edit': openEdit(id); break;
    case 'restore': restoreGiven(a.dataset.ids); break;
    case 'set-today': $('aDate').value = fmtDate(todayIso()); previewAddDate(); $('aCust').focus(); break;
    case 'set-tmr': $('aDate').value = fmtDate(tomorrowIso()); previewAddDate(); $('aCust').focus(); break;
    case 'forget': forgetCustomer(a.dataset.key); break;
    case 'notif-on': enableNotifs(); break;
    case 'notif-test': remind('Δοκιμαστική υπενθύμιση', 'Έτσι θα εμφανίζεται η υπενθύμιση για τους φακέλους.', 'test-' + Date.now()); beep(); break;
    case 'notif-close': notifBarClosed = true; renderNotifBar(); break;
    case 'export': exportData(); break;
    case 'logout': logout('Αποσυνδέθηκες.'); break;
  }
});

  const img = $('logo'); let i = 0;
  img.onerror = () => { i++; if (i < LOGO_URLS.length) img.src = LOGO_URLS[i]; else { img.hidden = true; $('logoFb').hidden = false; } };
  img.src = LOGO_URLS[0];
})();
(async function init(){
  await loadLocal();
  lastDay = todayIso();
  pruneFired();
  if (LOCAL.cache){ DB.envelopes = LOCAL.cache.envelopes || []; DB.customers = LOCAL.cache.customers || []; }
  buildMain();
  go(LOCAL.session ? 'main' : 'login');
  setTimeout(tick, 300);
  setInterval(tick, 10000);
})();
</script>
