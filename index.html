<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Φάκελοι | Μύλοι Αρκαδίου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRAND TOKENS (ίδια με το εσωτερικό σύστημα / m-m-m.gr)
   ============================================================ */
:root{
  --white:#FFFFFF; --bg:#FBFBF8; --line:#E8E6DD; --line-2:#F2F1EC;
  --olive:#7D8A4E; --olive-dark:#66713F; --olive-deep:#545E33; --olive-tint:#F1F3E8;
  --wheat:#C6913C; --wheat-dark:#94691F; --wheat-tint:#F8EFDD;
  --red:#A63E3A; --red-tint:#F7E8E7;
  --ink:#3B3B33; --muted:#75746A;
  --radius:10px;
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
[hidden]{display:none!important}

/* ============ TOP BAR ============ */
.topbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-in{max-width:1080px;margin:0 auto;height:66px;padding:0 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{height:46px;width:auto;max-width:120px;object-fit:contain}
.brand-fallback{width:40px;height:40px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.bt{line-height:1.2}
.bt b{display:block;font-size:14.5px;font-weight:700}
.bt span{font-size:10.5px;letter-spacing:.14em;color:var(--olive-dark);font-weight:700}
.top-nav{display:flex;gap:2px}
.nav-btn{position:relative;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink);border-radius:6px;display:inline-flex;align-items:center;gap:7px}
.nav-btn:hover,.nav-btn.active{color:var(--olive-dark)}
.nav-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:2px;background:var(--olive);border-radius:2px}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--olive-tint);color:var(--olive-deep);font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;line-height:1}
.cnt.red{background:var(--red);color:#fff}
.save-state{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--olive)}
.save-state.saving::before{background:var(--wheat)}
.save-state.err{color:var(--red);font-weight:700}
.save-state.err::before{background:var(--red)}
@media (max-width:900px){
  .top-nav,.save-state{display:none}
  .save-state.err{display:flex}
  .topbar-in{height:58px;padding:0 16px}
  .brand img{height:38px}
}

/* ============ NOTIFICATION BAR ============ */
.notif-bar{background:var(--olive-tint);border-bottom:1px solid #DFE3CF}
.notif-bar.warn{background:var(--wheat-tint);border-bottom-color:#EEDDB9}
.notif-in{max-width:1080px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;font-size:13.5px}
.notif-in p{flex:1}
@media (max-width:900px){.notif-in{padding:10px 16px}}

/* ============ LAYOUT ============ */
.main{max-width:1080px;margin:0 auto;padding:34px 24px 110px}
.view{display:none}
.view.active{display:block}
.greet{margin-bottom:22px}
.greet h1{font-size:clamp(26px,3.6vw,34px);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.greet p{margin-top:8px;font-size:15.5px;max-width:62ch}
.greet .date{color:var(--muted)}
.page-h{margin-bottom:22px}
.page-h h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.page-h p{color:var(--muted);margin-top:4px;max-width:65ch}
.sec{margin-bottom:36px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sec-h h2{font-size:13px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h.bad h2{color:var(--red)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.empty{border:1px dashed #D9D6C9;border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center;background:var(--white)}

/* κατάσταση συγχρονισμού */
.sync{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:26px}
.state{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.state.ok::before{background:var(--olive)}
.state.bad::before{background:var(--red)}
.state.wait::before{background:var(--wheat)}
.state.bad{color:var(--red)}

/* ============ BUTTONS / INPUTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13.5px;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn.primary{background:var(--olive-dark);color:#fff}
.btn.primary:hover{background:var(--olive-deep)}
.btn.ghost{border:1px solid var(--line);background:var(--white)}
.btn.ghost:hover{border-color:var(--olive);color:var(--olive-deep)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red);border:1px solid #E9CFCD;background:var(--white)}
.btn.danger-ghost:hover{background:var(--red-tint)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#A9A79B;font-size:19px;line-height:1;flex-shrink:0}
.icon-btn:hover{background:var(--red-tint);color:var(--red)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--muted)}
.inp,.f input{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;min-width:0}
.inp:focus,.f input:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px var(--olive-tint)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow .inp{flex:1;min-width:200px;max-width:380px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}
.hint b{color:var(--ink)}
.hint .bad{color:var(--red);font-weight:600}
.add-card{padding:18px;margin-bottom:8px}
.add-card .lbl{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}

/* ============ ΦΑΚΕΛΟΣ (το βασικό στοιχείο) ============ */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.env{
  position:relative;background:var(--white);border:1px solid var(--line);border-radius:3px 3px 8px 8px;
  padding:70px 18px 18px;display:flex;flex-direction:column;text-align:center;
  box-shadow:0 12px 26px -20px rgba(59,59,51,.5);transition:opacity .2s,transform .2s;
}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:44px;background:var(--wheat-tint);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{
  content:"";position:absolute;left:0;right:0;top:0;height:44px;pointer-events:none;
  background:
    linear-gradient(to top right,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) left top/50% 100% no-repeat,
    linear-gradient(to top left,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) right top/50% 100% no-repeat;
}
.seal{
  position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);z-index:1;
  width:36px;height:36px;border-radius:50%;background:var(--olive-dark);color:#fff;
  display:grid;place-items:center;box-shadow:0 0 0 4px var(--white),0 0 0 5px var(--line);
}
.seal svg{width:17px;height:17px}
.env h3{font-size:16.5px;font-weight:700;line-height:1.3}
.env .alias{color:var(--muted);font-size:12.5px;margin-top:2px}
.env .who{margin:12px 0 2px;font-weight:600;font-size:14px}
.env .since{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.env .btn{margin-top:auto}
.leaving{opacity:0;transform:translateY(-8px)}

/* ============ ΓΡΑΜΜΕΣ ============ */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.rows.bad{border-color:#EBD3D1;background:#FFFCFB}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;transition:opacity .2s,transform .2s;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.r-main{flex:1;min-width:180px}
.r-main b{font-weight:700}
.r-main small{display:block;color:var(--muted);font-size:12.5px}
.r-main small.warn{color:var(--red);font-weight:600}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--line-2);color:var(--ink);white-space:nowrap}
.tag.today{background:var(--olive-dark);color:#fff}
.tag.tmr{background:var(--wheat-tint);color:var(--wheat-dark)}
.tag.none{background:var(--red-tint);color:var(--red)}
.tag.env{background:var(--wheat-tint);color:var(--wheat-dark);display:inline-flex;align-items:center;gap:6px}
.tag.env svg{width:13px;height:13px}
.day-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.day-h:first-child{margin-top:0}
.tabs{display:flex;align-items:center;gap:6px;margin:26px 0 16px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);border:1px solid transparent;display:inline-flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--white);border-color:var(--line);color:var(--ink)}
.tabs .inp{margin-left:auto;max-width:260px}
.onboard{padding:24px;margin-bottom:30px;max-width:720px}
.onboard h2{font-size:18px;margin-bottom:6px}
.onboard ol{color:var(--muted);margin:0 0 16px 20px}
.onboard ol li{margin-bottom:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* ============ ΡΥΘΜΙΣΕΙΣ ============ */
.set{padding:18px 20px;margin-bottom:14px;max-width:720px}
.set h3{font-size:15px;font-weight:700;margin-bottom:10px}
.set p{color:var(--muted);font-size:13.5px;margin-bottom:12px;max-width:64ch}
.set .f{margin-bottom:12px}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.set-row.first{border-top:0;padding-top:4px}
.sr-t{flex:1;min-width:200px}
.sr-t b{display:block;font-weight:600}
.sr-t small{color:var(--muted);font-size:12.5px}
.set-row input[type=time]{width:auto}
.set .state{margin-bottom:12px}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#D9D6C9;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--olive-dark)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--olive);outline-offset:2px}
.guide{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}
.guide summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--olive-deep)}
.guide ol{margin:12px 0 0 20px;font-size:13.5px;color:var(--ink)}
.guide li{margin-bottom:8px;max-width:64ch}
.guide code{font-size:12.5px;background:var(--line-2);padding:1px 5px;border-radius:4px}

/* ============ TOASTS ============ */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:12px 8px 12px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);animation:tin .2s ease}
.toast.alert{background:var(--white);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--wheat)}
.t-msg{flex:1;padding-top:1px}
.t-act{font-weight:700;color:#E8C27E;padding:2px 6px;white-space:nowrap}
.toast.alert .t-act{color:var(--olive-deep)}
.t-x{opacity:.65;font-size:18px;line-height:1;padding:0 6px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ BOTTOM NAV (κινητό) ============ */
.bottombar{display:none}
@media (max-width:900px){
  .main{padding:22px 16px 110px}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bb-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);padding:4px 8px;min-width:64px;position:relative}
  .bb-btn svg{width:22px;height:22px}
  .bb-btn.active{color:var(--olive-dark)}
  .bb-btn .cnt{position:absolute;top:0;right:10px}
  .toasts{bottom:78px;right:12px;left:12px;width:auto}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.env,.row{transition:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" data-go="today">
      <img id="logo" alt="Μύλοι Αρκαδίου">
      <span class="brand-fallback" id="logoFb" hidden>ΜΑ</span>
      <span class="bt"><b>Μύλοι Αρκαδίου</b><span>ΦΑΚΕΛΟΙ ΠΕΛΑΤΩΝ</span></span>
    </a>
    <nav class="top-nav" id="topNav" aria-label="Κύρια πλοήγηση"></nav>
    <span class="save-state" id="saveState" aria-live="polite"></span>
  </div>
</header>

<div class="notif-bar" id="notifBar" hidden></div>

<main class="main">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-env"></section>
  <section class="view" id="view-prog"></section>
  <section class="view" id="view-set"></section>
</main>

<nav class="bottombar" id="bottomBar" aria-label="Πλοήγηση"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<datalist id="custList"></datalist>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* =====================================================================
   ΤΙ ΚΡΑΤΑΕΙ Η ΕΦΑΡΜΟΓΗ (επίτηδες ελάχιστα):
   - φάκελοι: όνομα πελάτη, πότε μπήκε στο stand, πότε δόθηκε και σε ποιον
   - πρόγραμμα: ημερομηνία παράδοσης, πελάτης, οδηγός (από το αρχείο ΠΑΡΑΓΓΕΛΙΕΣ)
   Κανένα ποσό, αριθμός απόδειξης, ποσότητα ή στοιχείο πληρωμής.
   ===================================================================== */
const LOGO_URLS = ['https://m-m-m.gr/wp-content/uploads/2024/04/logo-150.png', 'https://i.imgur.com/oDCFSVE.png'];
const KEY = 'arkadi-fakeloi-v2';
const HISTORY_DAYS = 90;          // το ιστορικό «Δόθηκαν» σβήνεται μόνο του μετά από τόσες μέρες
const SYNC_EVERY_MIN = 10;
const DEFAULT_SETTINGS = { userName:'Ζωή', morningTime:'07:30', eveEnabled:true, eveTime:'14:00', sound:true, syncUrl:'', syncKey:'' };
const EMPTY_ROUTES = { entries:[], customers:[], updated:null, fetchedAt:null, sample:false };

const DAYS_FULL = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const MONTHS = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let DB = { envelopes:[], settings:{...DEFAULT_SETTINGS}, fired:{}, routes:{...EMPTY_ROUTES} };
let view = 'today', envTab = 'stand', lastDay = '', notifBarClosed = false;
let syncing = false, syncError = '';

/* ===================== HELPERS ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayIso = () => iso(new Date());
const tomorrowIso = () => iso(addDays(new Date(),1));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ').replace(/\s+/g,' ').trim();
const toMin = t => { const [h,m] = String(t || '00:00').split(':').map(Number); return (h||0)*60 + (m||0); };
const shortDate = s => { const d = fromIso(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const longDate = s => { const d = fromIso(s); return `${DAYS_FULL[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const hhmm = isoTs => { const d = new Date(isoTs); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function whenStr(isoTs){ const d = new Date(isoTs); return iso(d) === todayIso() ? `σήμερα ${hhmm(isoTs)}` : `${d.getDate()}/${d.getMonth()+1} ${hhmm(isoTs)}`; }
function routeLabel(s, lower=false){
  if (s === todayIso()) return lower ? 'σήμερα' : 'Σήμερα';
  if (s === tomorrowIso()) return lower ? 'αύριο' : 'Αύριο';
  const d = fromIso(s); return `${DAYS_FULL[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
const daysSince = isoTs => Math.max(0, Math.round((fromIso(todayIso()) - fromIso(iso(new Date(isoTs)))) / 86400000));
const sinceText = isoTs => { const n = daysSince(isoTs); return `Στο stand από ${shortDate(iso(new Date(isoTs)))}` + (n === 0 ? ' (σήμερα)' : n === 1 ? ' (1 μέρα)' : ` (${n} μέρες)`); };
const ENV_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';

/* ===================== ΠΕΛΑΤΕΣ & ΠΡΟΓΡΑΜΜΑ ===================== */
/* Ίδιος πελάτης: ίδιο όνομα (χωρίς τόνους/κεφαλαία), ή όλες οι λέξεις του μικρότερου
   ονόματος υπάρχουν στο μεγαλύτερο (π.χ. «ΤΣΑΤΣΑΡΩΝΑΚΗΣ» ≈ «ΜΑΝΑ ΤΣΑΤΣΑΡΩΝΑΚΗΣ»). */
function sameCustomer(a, b){
  const x = norm(a), y = norm(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const A = x.split(' '), B = y.split(' ');
  const [s, l] = A.length <= B.length ? [A, B] : [B, A];
  return s.every(w => w.length >= 3 && l.includes(w));
}
const hasRoutes = () => DB.routes.sample || !!DB.routes.fetchedAt;
const pending = () => DB.envelopes.filter(e => !e.givenAt);
const routesOn = (name, d) => DB.routes.entries.filter(e => e.d === d && sameCustomer(name, e.c));
const nextRouteOf = name => DB.routes.entries.find(e => e.d >= todayIso() && sameCustomer(name, e.c)) || null;
const envFor = name => pending().find(e => sameCustomer(e.name, name)) || null;
function missedOf(env){
  const t = todayIso(), added = iso(new Date(env.addedAt));
  if (routesOn(env.name, t).length) return null;
  const past = DB.routes.entries.filter(e => e.d < t && e.d >= added && sameCustomer(env.name, e.c));
  return past.length ? past[past.length-1] : null;
}
function driversOf(rs){ return [...new Set(rs.flatMap(r => String(r.drv || '').split(',').map(s => s.trim()).filter(Boolean)))]; }
function whoText(rs){
  if (!rs.length) return '';
  if (rs.every(r => r.own)) return 'Παραλαμβάνει ο ίδιος';
  const d = driversOf(rs);
  return d.length ? `Οδηγός: ${d.join(', ')}` : 'Οδηγός: δεν έχει γραφτεί';
}
function knownCustomers(){
  const seen = new Map();
  [...DB.routes.customers, ...DB.routes.entries.map(e => e.c), ...DB.envelopes.map(e => e.name)].forEach(n => {
    const k = norm(n); if (k && !seen.has(k)) seen.set(k, n);
  });
  return [...seen.values()].sort((a,b) => a.localeCompare(b,'el'));
}
function tidy(){
  const cutoff = addDays(new Date(), -HISTORY_DAYS).toISOString();
  DB.envelopes = DB.envelopes.filter(e => !e.givenAt || e.givenAt >= cutoff);
  const fcut = iso(addDays(new Date(), -7));
  Object.keys(DB.fired).forEach(k => { if (k.slice(0,10) < fcut) delete DB.fired[k]; });
}

/* ===================== STORAGE =====================
   Μέσα στο Claude: window.storage (προσωπικά, όχι κοινόχρηστα).
   Από δικό σας link: αποθήκευση στον browser αυτού του υπολογιστή.            */
const HAS_CLAUDE_STORAGE = !!(window.storage && typeof window.storage.get === 'function');
async function loadDB(){
  let raw = null;
  try {
    if (HAS_CLAUDE_STORAGE){ const r = await window.storage.get(KEY, false); raw = r ? r.value : null; }
    else raw = window.localStorage.getItem(KEY);
  } catch(e){ raw = null; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    DB = {
      envelopes: Array.isArray(d.envelopes) ? d.envelopes : [],
      settings: {...DEFAULT_SETTINGS, ...(d.settings || {})},
      fired: d.fired && typeof d.fired === 'object' ? d.fired : {},
      routes: {...EMPTY_ROUTES, ...(d.routes || {})}
    };
  } catch(e){ toast('Τα αποθηκευμένα δεδομένα δεν διαβάστηκαν.', {sticky:true}); }
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); setSaveState('saving'); saveTimer = setTimeout(persist, 250); }
async function persist(){
  const data = JSON.stringify(DB);
  try {
    if (HAS_CLAUDE_STORAGE){ const r = await window.storage.set(KEY, data, false); if (!r) throw new Error('no result'); }
    else window.localStorage.setItem(KEY, data);
    setSaveState('ok');
  } catch(e){
    setSaveState('err');
    toast('Η αποθήκευση απέτυχε. Κατέβασε αντίγραφο από τις Ρυθμίσεις.', {sticky:true});
  }
}
function setSaveState(s){
  const el = $('saveState');
  el.className = 'save-state' + (s === 'ok' ? '' : ' ' + s);
  el.textContent = s === 'saving' ? 'Αποθήκευση…' : s === 'err' ? 'Σφάλμα αποθήκευσης' : 'Αποθηκεύτηκε';
}

/* ===================== ΣΥΓΧΡΟΝΙΣΜΟΣ ΜΕ ΤΟ ΑΡΧΕΙΟ ===================== */
const VALID_URL = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\/?$/;
function sanitizeRoutes(data){
  const str = (v, max) => String(v == null ? '' : v).replace(/\s+/g,' ').trim().slice(0, max);
  const entries = (Array.isArray(data.entries) ? data.entries : [])
    .filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.d) && str(e.c, 80))
    .map(e => ({ d:e.d, c:str(e.c,80), drv:str(e.drv,60), own:!!e.own, chk:!!e.chk }))
    .sort((a,b) => a.d.localeCompare(b.d) || a.c.localeCompare(b.c,'el'));
  const customers = (Array.isArray(data.customers) ? data.customers : []).map(c => str(c,80)).filter(Boolean).slice(0, 2000);
  return { entries, customers };
}
async function syncRoutes(manual=false){
  const { syncUrl:url, syncKey:key } = DB.settings;
  if (!url || !key){ if (manual) toast('Συμπλήρωσε το link σύνδεσης και το κλειδί.'); return false; }
  if (!VALID_URL.test(url)){ syncError = 'Το link πρέπει να είναι το URL της εφαρμογής ιστού (script.google.com/…/exec).'; renderAll(); return false; }
  if (syncing) return false;
  syncing = true; renderSyncBits();
  let ok = false;
  try {
    const res = await fetch(`${url}?key=${encodeURIComponent(key)}`, { method:'GET', redirect:'follow', cache:'no-store' });
    if (!res.ok) throw new Error('http');
    const data = await res.json();
    if (!data || !data.ok) throw new Error(data && data.error === 'Λάθος κλειδί' ? 'key' : 'server');
    const clean = sanitizeRoutes(data);
    if (DB.routes.sample) DB.envelopes = DB.envelopes.filter(e => !e.sample);   // φεύγει το δείγμα
    DB.routes = { ...clean, updated: data.updated || null, fetchedAt: new Date().toISOString(), sample:false };
    syncError = ''; ok = true; save();
    if (manual){
      const up = DB.routes.entries.filter(e => e.d >= todayIso()).length;
      toast(`Ενημερώθηκε το πρόγραμμα: ${up} παραδόσεις τις επόμενες εβδομάδες.`);
    }
  } catch(e){
    syncError = e.message === 'key' ? 'Λάθος κλειδί σύνδεσης.'
              : e.message === 'server' ? 'Το αρχείο δεν διαβάστηκε. Έλεγξε ότι υπάρχει και ότι το script έχει πρόσβαση.'
              : IN_FRAME ? 'Μέσα στο Claude δεν επιτρέπεται σύνδεση με εξωτερικές υπηρεσίες.' : 'Δεν έγινε σύνδεση με το αρχείο.';
    if (manual) toast(esc(syncError));
  } finally {
    syncing = false;
    renderAll(); checkReminders();
  }
  return ok;
}
function syncInfo(){
  const R = DB.routes, S = DB.settings;
  if (syncing) return { cls:'wait', txt:'Ενημέρωση από το αρχείο δρομολογίων…' };
  if (R.sample) return { cls:'wait', txt:'Δείγμα προγράμματος. Σύνδεσε το αρχείο δρομολογίων από τις Ρυθμίσεις.' };
  if (!S.syncUrl || !S.syncKey) return { cls:'bad', txt:'Το αρχείο δρομολογίων δεν έχει συνδεθεί ακόμα.' };
  if (syncError) return { cls:'bad', txt: syncError + (R.fetchedAt ? ` Χρησιμοποιείται το πρόγραμμα του ελέγχου ${whenStr(R.fetchedAt)}.` : '') };
  if (R.fetchedAt) return { cls:'ok', txt:`Πρόγραμμα από το αρχείο ΠΑΡΑΓΓΕΛΙΕΣ. Έλεγχος ${whenStr(R.fetchedAt)}${R.updated ? `, τελευταία αλλαγή στο αρχείο ${whenStr(R.updated)}` : ''}.` };
  return { cls:'wait', txt:'Αναμονή για πρώτο συγχρονισμό.' };
}
function syncLineHTML(withBtn=true){
  const i = syncInfo(), connected = DB.settings.syncUrl && DB.settings.syncKey;
  let btn = '';
  if (withBtn){
    btn = connected
      ? `<button class="btn ghost sm" data-act="sync-now" ${syncing ? 'disabled' : ''}>Ενημέρωση τώρα</button>`
      : `<button class="btn ghost sm" data-go="set">Σύνδεση αρχείου</button>`;
  }
  return `<span class="state ${i.cls}">${esc(i.txt)}</span>${btn}`;
}
function renderSyncBits(){ document.querySelectorAll('[data-sync-line]').forEach(el => el.innerHTML = syncLineHTML(el.dataset.syncLine !== 'nobtn')); }

/* ===================== TOASTS ===================== */
function toast(html, {action=null, sticky=false, kind=''} = {}){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t-msg">${html}</div>`;
  if (action){
    const b = document.createElement('button'); b.className = 't-act'; b.textContent = action.label;
    b.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(b);
  }
  const x = document.createElement('button'); x.className = 't-x'; x.textContent = '×'; x.setAttribute('aria-label','Κλείσιμο');
  x.onclick = () => el.remove(); el.appendChild(x);
  box.appendChild(el);
  while (box.children.length > 5) box.firstChild.remove();
  if (!sticky) setTimeout(() => el.remove(), 6500);
}

/* ===================== ΕΙΔΟΠΟΙΗΣΕΙΣ ===================== */
const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const notifState = () => ('Notification' in window) ? Notification.permission : 'unsupported';
async function enableNotifs(){
  if (notifState() === 'unsupported'){ toast('Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις υπολογιστή.'); renderAll(); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') toast('Οι ειδοποιήσεις υπολογιστή ενεργοποιήθηκαν.');
    else toast(IN_FRAME ? 'Μέσα στο Claude ο browser δεν επιτρέπει ειδοποιήσεις υπολογιστή. Οι υπενθυμίσεις εμφανίζονται μέσα στη σελίδα.'
                        : 'Οι ειδοποιήσεις δεν επιτράπηκαν. Άλλαξέ το από το εικονίδιο αριστερά της διεύθυνσης.');
  } catch(e){ toast('Ο browser μπλόκαρε το αίτημα για ειδοποιήσεις.'); }
  renderAll();
}
function systemNotify(title, body, tag){
  if (notifState() !== 'granted') return;
  try {
    const n = new Notification(title, { body, tag, icon: LOGO_URLS[0], requireInteraction: true });
    n.onclick = () => { window.focus(); go('today'); n.close(); };
  } catch(e){}
}
function remind(title, body, tag){
  systemNotify(title, body, tag);
  toast(`<b>${esc(title)}</b><br>${esc(body)}`, { sticky:true, kind:'alert', action: view !== 'today' ? {label:'Προβολή', fn:() => go('today')} : null });
}
let actx = null;
function beep(){
  if (!DB.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    [[660,0],[880,.18]].forEach(([f,dt]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(.18, t0+dt+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.35);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+dt); o.stop(t0+dt+.4);
    });
  } catch(e){}
}
document.addEventListener('pointerdown', () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
}, { once:true });

/* Κάθε φάκελος ειδοποιεί μία φορά τη μέρα για κάθε είδος:
   day  = παράδοση σήμερα (από την ώρα της πρωινής υπενθύμισης)
   eve  = παράδοση αύριο (από την ώρα της απογευματινής)
   miss = είχε παράδοση τις προηγούμενες μέρες και ο φάκελος είναι ακόμα στο stand */
function checkReminders(){
  const now = new Date(), t = iso(now), mins = now.getHours()*60 + now.getMinutes(), S = DB.settings;
  if (!hasRoutes()){ updateTitle(); return; }
  const due = [];
  const mark = (kind, env, extra) => { const k = `${t}|${kind}|${env.id}`; if (!DB.fired[k]){ DB.fired[k] = 1; due.push({ kind, env, ...extra }); } };
  pending().forEach(env => {
    if (mins >= toMin(S.morningTime)){
      const rs = routesOn(env.name, t);
      if (rs.length) mark('day', env, { rs });
      else { const m = missedOf(env); if (m) mark('miss', env, { m }); }
    }
    if (S.eveEnabled && mins >= toMin(S.eveTime)){
      const rs = routesOn(env.name, tomorrowIso());
      if (rs.length) mark('eve', env, { rs });
    }
  });
  if (!due.length){ updateTitle(); return; }
  save();
  const group = kind => due.filter(d => d.kind === kind);
  const fire = (list, one, many) => {
    if (!list.length) return;
    if (list.length <= 3) list.forEach(d => { const [title, body] = one(d); remind(title, body, `${d.kind}-${d.env.id}`); });
    else { const [title, body] = many(list); remind(title, body, `${list[0].kind}-summary`); }
  };
  fire(group('day'),
    d => [`Φάκελος για ${d.env.name}`, d.rs.every(r => r.own) ? 'Παραλαμβάνει σήμερα ο ίδιος. Δώσ\' του τον φάκελο.' : `Παράδοση σήμερα${driversOf(d.rs).length ? ', οδηγός ' + driversOf(d.rs).join(', ') : ''}. Δώσε τον φάκελο στον οδηγό.`],
    l => [`${l.length} φάκελοι για τις σημερινές παραδόσεις`, l.map(d => d.env.name).join(', ')]);
  fire(group('eve'),
    d => [`Αύριο: φάκελος για ${d.env.name}`, d.rs.every(r => r.own) ? 'Αύριο παραλαμβάνει ο ίδιος. Ετοίμασε τον φάκελο.' : `Αύριο παράδοση${driversOf(d.rs).length ? ', οδηγός ' + driversOf(d.rs).join(', ') : ''}. Ετοίμασε τον φάκελο.`],
    l => [`${l.length} φάκελοι για αύριο`, l.map(d => d.env.name).join(', ')]);
  fire(group('miss'),
    d => [`Ο φάκελος για ${d.env.name} είναι ακόμα στο stand`, `Είχε παράδοση ${routeLabel(d.m.d, true)}. Αν δόθηκε, πάτα «Δόθηκε».`],
    l => [`${l.length} φάκελοι δεν σημειώθηκαν ως δοσμένοι`, l.map(d => d.env.name).join(', ')]);
  beep();
  renderAll();
}
function updateTitle(){
  const n = hasRoutes() ? pending().filter(e => routesOn(e.name, todayIso()).length).length : 0;
  document.title = n ? `(${n}) Φάκελοι σήμερα | Μύλοι Αρκαδίου` : 'Φάκελοι | Μύλοι Αρκαδίου';
}

/* ===================== ΠΡΟΣΘΗΚΗ / ΕΝΕΡΓΕΙΕΣ ΦΑΚΕΛΩΝ ===================== */
function hintFor(name){
  if (!name) return '';
  const ex = envFor(name);
  if (ex) return `<span class="bad">Υπάρχει ήδη φάκελος για ${esc(ex.name)}.</span>`;
  if (!hasRoutes()) return 'Η υπενθύμιση θα έρθει μόλις συνδεθεί το αρχείο δρομολογίων.';
  const nr = nextRouteOf(name);
  if (nr) return `Επόμενη παράδοση: <b>${esc(routeLabel(nr.d, true))}</b>${norm(nr.c) !== norm(name) ? ` (στο πρόγραμμα: ${esc(nr.c)})` : ''}. ${esc(whoText([nr]))}.`;
  const known = knownCustomers().some(n => sameCustomer(n, name));
  return known ? 'Δεν έχει παράδοση στο πρόγραμμα ακόμα. Θα ειδοποιηθείς μόλις μπει.'
               : 'Νέο όνομα, δεν υπάρχει στο αρχείο. Γράψ\' το όπως εμφανίζεται στις ΠΑΡΑΓΓΕΛΙΕΣ για να ταιριάξει.';
}
function addEnvelope(raw, inputId){
  const name = String(raw || '').replace(/\s+/g,' ').trim();
  if (!name){ if (inputId) $(inputId).focus(); return; }
  const ex = envFor(name);
  if (ex){ toast(`Υπάρχει ήδη φάκελος για ${esc(ex.name)}.`); return; }
  const canon = knownCustomers().find(n => norm(n) === norm(name)) || name;
  DB.envelopes.push({ id:uid(), name:canon, addedAt:new Date().toISOString(), givenAt:null, givenTo:'' });
  save();
  if (inputId){ $(inputId).value = ''; const h = $(inputId + 'Hint'); if (h) h.innerHTML = ''; $(inputId).focus(); }
  const nr = hasRoutes() ? nextRouteOf(canon) : null;
  toast(`Φάκελος για ${esc(canon)}. ` + (nr ? `Επόμενη παράδοση ${esc(routeLabel(nr.d, true))}.` : hasRoutes() ? 'Θα ειδοποιηθείς μόλις μπει παράδοση στο πρόγραμμα.' : ''));
  renderAll(); checkReminders();
}
function giveEnvelope(id, btn){
  const env = DB.envelopes.find(e => e.id === id);
  if (!env || env.givenAt) return;
  const rs = routesOn(env.name, todayIso());
  env.givenAt = new Date().toISOString();
  env.givenTo = rs.length ? (rs.every(r => r.own) ? 'στον ίδιο' : driversOf(rs).join(', ')) : '';
  save();
  const card = btn && btn.closest('.env,.row');
  const finish = () => renderAll();
  if (card && !REDUCE){ card.classList.add('leaving'); setTimeout(finish, 210); } else finish();
  toast(`Δόθηκε ο φάκελος: ${esc(env.name)}.`, { action:{ label:'Αναίρεση', fn:() => { env.givenAt = null; env.givenTo = ''; save(); renderAll(); } } });
}
function removeEnvelope(id){
  const i = DB.envelopes.findIndex(e => e.id === id);
  if (i < 0) return;
  const [env] = DB.envelopes.splice(i, 1);
  save(); renderAll();
  toast(`Αφαιρέθηκε ο φάκελος: ${esc(env.name)}.`, { action:{ label:'Αναίρεση', fn:() => { DB.envelopes.push(env); save(); renderAll(); } } });
}
function restoreEnvelope(id){
  const env = DB.envelopes.find(e => e.id === id);
  if (!env) return;
  if (envFor(env.name)){ toast(`Υπάρχει ήδη φάκελος στο stand για ${esc(env.name)}.`); return; }
  env.givenAt = null; env.givenTo = ''; save(); renderAll();
  toast(`Ο φάκελος για ${esc(env.name)} γύρισε στο stand.`);
}
function wireAdd(inputId, btnId){
  const inp = $(inputId), hint = $(inputId + 'Hint');
  inp.addEventListener('input', () => { hint.innerHTML = hintFor(inp.value.trim()); });
  inp.addEventListener('change', () => { hint.innerHTML = hintFor(inp.value.trim()); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); addEnvelope(inp.value, inputId); } });
  $(btnId).onclick = () => addEnvelope(inp.value, inputId);
}

function tagFor(env){
  if (!hasRoutes()) return '';

function renderEnvList(){
  const q = norm($('envSearch').value);
  document.querySelectorAll('[data-envtab]').forEach(b => { b.classList.toggle('active', b.dataset.envtab === envTab); b.setAttribute('aria-selected', b.dataset.envtab === envTab); });
  const pend = pending();
  $('cStand').textContent = pend.length; $('cStand').hidden = !pend.length;
  const list = $('envList');
  if (envTab === 'stand'){
    const items = pend.filter(e => !q || norm(e.name).includes(q))
      .map(e => ({ e, nr: hasRoutes() ? nextRouteOf(e.name) : null }))
      .sort((a,b) => (a.nr ? a.nr.d : '9999').localeCompare(b.nr ? b.nr.d : '9999') || a.e.name.localeCompare(b.e.name,'el'));
    list.innerHTML = items.length ? `<div class="rows">${items.map(({e, nr}) =>
      rowHTML(e, `${sinceText(e.addedAt)}${nr ? '. ' + esc(whoText([nr])) : ''}`,
        `${tagFor(e)}<button class="btn primary sm" data-act="give" data-id="${e.id}">Δόθηκε</button><button class="icon-btn" data-act="rmenv" data-id="${e.id}" aria-label="Αφαίρεση φακέλου" title="Αφαίρεση (λάθος καταχώρηση)">×</button>`)).join('')}</div>`
      : `<div class="empty">${q ? 'Κανένα αποτέλεσμα.' : 'Το stand είναι άδειο.'}</div>`;
  } else {
    const given = DB.envelopes.filter(e => e.givenAt && (!q || norm(e.name).includes(q))).sort((a,b) => b.givenAt.localeCompare(a.givenAt));
    if (!given.length){ list.innerHTML = `<div class="empty">${q ? 'Κανένα αποτέλεσμα.' : 'Δεν έχει δοθεί ακόμα κανένας φάκελος.'}</div>`; return; }
    const groups = {};
    given.forEach(e => { const d = iso(new Date(e.givenAt)); (groups[d] = groups[d] || []).push(e); });
    list.innerHTML = Object.keys(groups).sort().reverse().map(d => `

        `<button class="btn ghost sm" data-act="restore" data-id="${e.id}">Επαναφορά στο stand</button>`)).join('')}</div>`).join('')
      + `<p class="hint" style="margin-top:14px">Το ιστορικό κρατιέται ${HISTORY_DAYS} μέρες και μετά σβήνεται μόνο του.</p>`;
  }
}

async function saveSync(){
  const url = $('sUrl').value.trim(), key = $('sKey').value.trim();
  if (!VALID_URL.test(url)){ toast('Το link πρέπει να είναι το URL της εφαρμογής ιστού, που τελειώνει σε /exec.'); $('sUrl').focus(); return; }
  if (key.length < 16){ toast('Το κλειδί φαίνεται ελλιπές. Αντίγραψέ το ολόκληρο από το αρχείο καταγραφής.'); $('sKey').focus(); return; }
  DB.settings.syncUrl = url; DB.settings.syncKey = key; syncError = '';
  save();
  const ok = await syncRoutes(true);
  if (ok){ buildSettings(); renderAll(); }
}
function removeSync(){
  DB.settings.syncUrl = ''; DB.settings.syncKey = ''; syncError = '';
  DB.routes = { ...EMPTY_ROUTES };
  save(); buildSettings(); renderAll();
  toast('Η σύνδεση με το αρχείο αφαιρέθηκε.');
}
function exportData(){
  try {
    const { syncUrl, syncKey, ...safeSettings } = DB.settings;
    const blob = new Blob([JSON.stringify({ app:'fakeloi', version:2, envelopes:DB.envelopes, settings:safeSettings }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fakeloi-myloi-arkadiou-${todayIso()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  } catch(e){ toast('Η λήψη αρχείου δεν επιτρέπεται εδώ.'); }
}
$('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.app !== 'fakeloi' || !Array.isArray(d.envelopes)) throw new Error('bad');
      DB.envelopes = d.envelopes.filter(x => x && typeof x.name === 'string' && x.addedAt)
        .map(x => ({ id:String(x.id || uid()), name:x.name.slice(0,80), addedAt:x.addedAt, givenAt:x.givenAt || null, givenTo:String(x.givenTo || '').slice(0,60) }));
      const { syncUrl, syncKey, ...rest } = d.settings || {};
      DB.settings = { ...DB.settings, ...rest };
      tidy(); save(); buildSettings(); renderAll();
      toast(`Επαναφέρθηκαν ${DB.envelopes.length} φάκελοι.`);
    } catch(err){ toast('Το αρχείο δεν είναι αντίγραφο αυτής της εφαρμογής.'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});
let wipeTimer = null;
function wipeAll(btn){
  if (!btn.dataset.armed){
    btn.dataset.armed = '1'; btn.textContent = 'Πάτα ξανά για οριστική διαγραφή'; btn.className = 'btn danger sm';
    clearTimeout(wipeTimer);
    wipeTimer = setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = 'Διαγραφή όλων'; btn.className = 'btn danger-ghost sm'; } }, 4000);
    return;
  }
  clearTimeout(wipeTimer);
  DB.envelopes = []; DB.fired = {}; DB.routes = { ...EMPTY_ROUTES };
  save(); buildSettings(); renderAll();
  toast('Όλα τα δεδομένα διαγράφηκαν.');
  if (DB.settings.syncUrl) syncRoutes(false);
}

/* ===================== ΔΕΙΓΜΑ ===================== */
function loadSample(){
  const d = n => iso(addDays(new Date(), n));
  const entries = [
    { d:d(-1), c:'ΜΑΝΩΛΑΚΗΣ', drv:'ΓΙΑΝΝΗΣ', own:false },
    { d:d(0),  c:'ΒΕΡΥΚΑΚΗΣ', drv:'ΓΙΑΝΝΗΣ', own:false },
    { d:d(0),  c:'ΣΦΑΚΙΑΝΑΚΗΣ', drv:'', own:true },
    { d:d(0),  c:'ΚΟΚΚΙΝΑΚΗΣ', drv:'ΚΩΣΤΗΣ', own:false },
    { d:d(1),  c:'ΔΑΜΙΑΝΑΚΗΣ', drv:'ΓΙΑΝΝΗΣ', own:false },
    { d:d(3),  c:'ΛΙΝΟΞΙΛΑΚΗΣ', drv:'ΓΙΑΝΝΗΣ', own:false },
    { d:d(3),  c:'ΚΟΚΚΙΝΑΚΗΣ', drv:'ΓΙΑΝΝΗΣ', own:false }
  ];
  DB.routes = { entries, customers:[...new Set(entries.map(e => e.c)), 'ΑΡΧΟΝΤΑΚΗΣ'].sort(), updated:new Date().toISOString(), fetchedAt:null, sample:true };
  const mk = (name, daysAgo) => ({ id:uid(), name, addedAt:addDays(new Date(), -daysAgo).toISOString(), givenAt:null, givenTo:'', sample:true });
  DB.envelopes.push(mk('ΒΕΡΥΚΑΚΗΣ',6), mk('ΣΦΑΚΙΑΝΑΚΗΣ',3), mk('ΜΑΝΩΛΑΚΗΣ',5), mk('ΔΑΜΙΑΝΑΚΗΣ',1), mk('ΑΡΧΟΝΤΑΚΗΣ',12));
  save(); renderAll();
  toast('Φορτώθηκε δείγμα. Με τη σύνδεση του αρχείου αντικαθίσταται από το πραγματικό πρόγραμμα.');
  setTimeout(checkReminders, 700);
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const tab = e.target.closest('[data-envtab]');
  if (tab){ envTab = tab.dataset.envtab; renderEnvList(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'give': giveEnvelope(id, a); break;
    case 'rmenv': removeEnvelope(id); break;
    case 'restore': restoreEnvelope(id); break;
    case 'addfor': addEnvelope(a.dataset.name); break;
    case 'sync-now': syncRoutes(true); break;
    case 'sync-save': saveSync(); break;
    case 'sync-remove': removeSync(); break;
    case 'notif-on': enableNotifs(); break;
    case 'notif-test': remind('Δοκιμαστική υπενθύμιση', 'Έτσι θα εμφανίζεται η υπενθύμιση για τους φακέλους.', 'test-' + Date.now()); beep(); break;
    case 'notif-close': notifBarClosed = true; renderNotifBar(); break;
    case 'sample': loadSample(); break;
    case 'export': exportData(); break;
    case 'import': $('importFile').click(); break;
    case 'wipe': wipeAll(a); break;
  }
});
let lastSync = 0;
function tick(){
  const t = todayIso();
  if (t !== lastDay){ lastDay = t; tidy(); save(); renderAll(); }
  if (DB.settings.syncUrl && DB.settings.syncKey && Date.now() - lastSync > SYNC_EVERY_MIN*60000){ lastSync = Date.now(); syncRoutes(false); }
  checkReminders();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(); renderAll(); } });

/* ===================== INIT ===================== */
(function initLogo(){
  const img = $('logo'); let i = 0;
  img.onerror = () => { i++; if (i < LOGO_URLS.length) img.src = LOGO_URLS[i]; else { img.hidden = true; $('logoFb').hidden = false; } };
  img.src = LOGO_URLS[0];
})();
(async function init(){
  await loadDB();
  lastDay = todayIso();
  tidy();
  buildToday(); buildEnv(); buildProgram();
  setSaveState('ok');
  go('today');
  setTimeout(tick, 600);
  setInterval(tick, 30000);
})();
</script>
