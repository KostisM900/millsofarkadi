/* Πρόσβαση: info@m-m-m.gr και social@m-m-m.gr (επιβάλλεται από τους κανόνες RLS στη βάση).
   Πεδία: πινακίδα, περιγραφή, ημερομηνίες λήξης, διάστημα ανανέωσης. */
const VEH_KINDS = { kteo:'ΚΤΕΟ', emis:'Κάρτα καυσαερίων' };
const VEH = { loaded:false, loading:false, setupMissing:false, list:[], month:null };
const VEHICLE_EMAILS = ['info@m-m-m.gr', 'social@m-m-m.gr'];
const canVehicles = () => VEHICLE_EMAILS.includes(String((LOCAL.session && LOCAL.session.email) || '').toLowerCase());
const vehRow = r => ({ id:r.id, plate:r.plate, name:r.name || '', note:r.note || '', noEmis:!!r.no_emis,
  kteo:r.kteo_due || '', kteoM:r.kteo_months || 12, emis:r.emis_due || '', emisM:r.emis_months || 12 });
const vehWarnDays = () => Math.min(180, Math.max(1, Number(LOCAL.settings.vehWarnDays ?? 30)));
/* Όλες οι λήξεις σε μία λίστα, ταξινομημένες */
function vehDeadlines(){
  const out = [];
  VEH.list.forEach(v => ['kteo','emis'].forEach(k => {
    if (k === 'emis' && v.noEmis) return;                  // π.χ. καρότσα: μόνο ΚΤΕΟ
    const d = v[k]; if (d) out.push({ v, kind:k, due:d });
  }));
  return out.sort((a,b) => a.due.localeCompare(b.due) || a.v.plate.localeCompare(b.v.plate,'el'));
}
/* Η πιο κοντινή λήξη του οχήματος, για ταξινόμηση και χρώμα της καρτέλας */
function vehNext(v){
  const ds = [v.kteo, v.noEmis ? '' : v.emis].filter(Boolean).sort();
  return ds[0] || '';
}
const vehCardState = v => { const d = vehNext(v); return d ? vehState(d) : 'none'; };
const vehMissing = v => (!v.kteo ? 1 : 0) + (!v.noEmis && !v.emis ? 1 : 0);
const vehDaysLeft = due => Math.round((fromIso(due) - fromIso(todayIso())) / 86400000);
function vehState(due){
  const n = vehDaysLeft(due);
  return n < 0 ? 'late' : n === 0 ? 'today' : n <= vehWarnDays() ? 'soon' : 'ok';
}
const vehAlertCount = () => vehDeadlines().filter(d => vehState(d.due) !== 'ok').length;
const VEH_ORDER = { late:0, today:1, soon:2, none:3, ok:4 };
const vehLabel = v => `${v.plate}${v.name ? ' · ' + v.name : ''}`;
const addMonths = (dateIso, m) => { const d = fromIso(dateIso); const n = new Date(d.getFullYear(), d.getMonth() + m, 1, 12); const day = Math.min(d.getDate(), new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate()); return iso(new Date(n.getFullYear(), n.getMonth(), day, 12)); };
const plateFmt = s => upper(clean(s)).replace(/[\s.]+/g, '-').replace(/[^A-ZΑ-Ω0-9-]/g, '').replace(/-+/g, '-').slice(0, 12);
const vehBody = v => ({ id:v.id, plate:v.plate, name:v.name || null, note:v.note || null, no_emis:!!v.noEmis,
  kteo_due:v.kteo || null, kteo_months:v.kteoM, emis_due:v.emis || null, emis_months:v.emisM });

async function loadVehicles(){
  if (VEH.loading || !LOCAL.session || !canVehicles()) return;
  VEH.loading = true;
  try {
    const rows = await api('vehicles?select=id,plate,name,note,no_emis,kteo_due,kteo_months,emis_due,emis_months&order=plate.asc');
    VEH.list = (rows || []).map(vehRow);
    VEH.loaded = true; VEH.setupMissing = false; setOnline(true);
    renderNav(); checkReminders();
  } catch(e){
    if (/HTTP 40[04]|PGRST|42P01/.test(String(e && e.message))) VEH.setupMissing = true;
    else handleError(e, 'Δεν φόρτωσαν τα οχήματα.', true);
  } finally { VEH.loading = false; if (view === 'veh') renderVehicles(); }
}
function vehMutate(apply, request, rollback, msg){
  apply(); if (view === 'veh') renderVehicles(); if (view === 'home') renderHome(); renderNav();
  pendingOps++;
  return Promise.resolve().then(request).then(() => setOnline(true))
    .catch(e => { rollback(); if (view === 'veh') renderVehicles(); if (view === 'home') renderHome(); renderNav(); handleError(e, msg); })
    .finally(() => { pendingOps--; });
}
function addVehicle(){
  const kteo = parseDateInput($('vKteo').value), emis = parseDateInput($('vEmis').value);
  if ($('vKteo').value.trim() && !kteo.value){ $('vHint').innerHTML = `<span class="bad">ΚΤΕΟ: ${esc(dateError(kteo))}</span>`; return; }
  if ($('vEmis').value.trim() && !emis.value){ $('vHint').innerHTML = `<span class="bad">Καυσαέρια: ${esc(dateError(emis))}</span>`; return; }
  const err = createVehicle($('vPlate').value, $('vName').value, kteo.value, emis.value);
  if (err){ $('vHint').innerHTML = `<span class="bad">${esc(err)}</span>`; return; }
  ['vPlate','vName','vKteo','vEmis'].forEach(id => $(id).value = '');
  $('vHint').innerHTML = VEH_HINT; $('vPlate').focus();
}
/* Επιστρέφει μήνυμα λάθους, ή κενό αν καταχωρήθηκε */
function createVehicle(plateRaw, nameRaw, kteoDue, emisDue){
  const plate = plateFmt(plateRaw);
  if (!plate) return 'Γράψε την πινακίδα.';
  if (VEH.list.some(v => norm(v.plate) === norm(plate))) return `Υπάρχει ήδη όχημα με πινακίδα ${plate}.`;
  const v = { id:uuid(), plate, name:clean(nameRaw).slice(0,60), note:'', noEmis:false,
              kteo:kteoDue || '', kteoM:12, emis:emisDue || '', emisM:12 };
  vehMutate(
    () => VEH.list.push(v),
    () => api('vehicles', { method:'POST', body:vehBody(v), prefer:'return=minimal' }),
    () => { VEH.list = VEH.list.filter(x => x.id !== v.id); },
    'Δεν αποθηκεύτηκε το όχημα.'
  ).then(() => checkReminders());
  toast(`Προστέθηκε: ${esc(vehLabel(v))}.`);
  return '';
}
function setVehField(id, field, value){
  const v = VEH.list.find(x => x.id === id); if (!v) return;
  const key = { plate:'plate', name:'name', note:'note', kteo:'kteo_due', emis:'emis_due', kteoM:'kteo_months', emisM:'emis_months', noEmis:'no_emis' }[field];
  const prev = v[field];
  if (prev === value) return;
  vehMutate(
    () => { v[field] = value; },
    () => api(`vehicles?id=eq.${id}`, { method:'PATCH', body:{ [key]: value === '' ? null : value }, prefer:'return=minimal' }),
    () => { v[field] = prev; },
    'Η αλλαγή δεν αποθηκεύτηκε.'
  ).then(() => checkReminders());
}
/* Ανανέωση: η νέα λήξη μπαίνει τόσους μήνες μετά τη σημερινή μέρα */
function renewVeh(id, kind){
  const v = VEH.list.find(x => x.id === id); if (!v) return;
  const months = kind === 'kteo' ? v.kteoM : v.emisM;
  const next = addMonths(todayIso(), months), prev = v[kind];
  vehMutate(
    () => { v[kind] = next; },
    () => api(`vehicles?id=eq.${id}`, { method:'PATCH', body:{ [kind === 'kteo' ? 'kteo_due' : 'emis_due']: next }, prefer:'return=minimal' }),
    () => { v[kind] = prev; },
    'Η ανανέωση δεν αποθηκεύτηκε.'
  ).then(() => checkReminders());
  toast(`${VEH_KINDS[kind]} · ${esc(v.plate)}: νέα λήξη ${esc(fmtDate(next))}.`, { action:{ label:'Αναίρεση', fn:() => vehMutate(
    () => { v[kind] = prev; },
    () => api(`vehicles?id=eq.${id}`, { method:'PATCH', body:{ [kind === 'kteo' ? 'kteo_due' : 'emis_due']: prev || null }, prefer:'return=minimal' }),
    () => { v[kind] = next; }, 'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}
function deleteVehicle(id){
  const v = VEH.list.find(x => x.id === id); if (!v) return;
  vehMutate(
    () => { VEH.list = VEH.list.filter(x => x.id !== id); },
    () => api(`vehicles?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' }),
    () => { VEH.list.push(v); },
    'Η διαγραφή δεν αποθηκεύτηκε.'
  );
  toast(`Διαγράφηκε: ${esc(vehLabel(v))}.`, { action:{ label:'Αναίρεση', fn:() => vehMutate(
    () => VEH.list.push(v),
    () => api('vehicles', { method:'POST', body:vehBody(v), prefer:'return=minimal' }),
    () => { VEH.list = VEH.list.filter(x => x.id !== v.id); }, 'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}

/* Μία γραμμή μέσα στην καρτέλα: ΚΤΕΟ ή κάρτα καυσαερίων */

/* Μήνας με τις λήξεις, για γρήγορη ματιά */
function calendarHTML(){
  const base = VEH.month ? fromIso(VEH.month + '-01') : fromIso(todayIso().slice(0,7) + '-01');
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1, 12), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;                       // Δευτέρα πρώτη
  const byDay = {};
  vehDeadlines().forEach(d => { const dt = fromIso(d.due); if (dt.getFullYear() === y && dt.getMonth() === m) (byDay[dt.getDate()] = byDay[dt.getDate()] || []).push(d); });
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="cal-cell empty"></div>');
  for (let day = 1; day <= days; day++){
    const list = byDay[day] || [], isToday = iso(new Date(y, m, day, 12)) === todayIso();
    cells.push(`<div class="cal-cell${isToday ? ' today' : ''}${list.length ? ' has' : ''}">
      <span class="cal-n">${day}</span>
      ${list.map(d => `<span class="cal-ev ${vehState(d.due)}" title="${esc(VEH_KINDS[d.kind])} — ${esc(d.v.plate)}">${esc(d.v.plate)}<i>${d.kind === 'kteo' ? 'ΚΤΕΟ' : 'καυσ.'}</i></span>`).join('')}
    </div>`);
  }
  return `<div class="cal">
    <div class="cal-head">
      <button class="btn ghost sm" data-veh="prev-month" aria-label="Προηγούμενος μήνας">‹</button>
      <b>${MONTHS[m]} ${y}</b>
      <button class="btn ghost sm" data-veh="next-month" aria-label="Επόμενος μήνας">›</button>
      <button class="btn ghost sm" data-veh="this-month">Τρέχων μήνας</button>
    </div>
    <div class="cal-grid">${['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'].map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>
  </div>`;
}
function renderVehicles(){

  const attention = sorted.filter(v => ['late','today','soon'].includes(vehCardState(v)));

  if (rest.length) html += section(`ΟΛΑ ΤΑ ΟΧΗΜΑΤΑ (${rest.length})`, `<div class="veh-cards">${rest.map(vehCard).join('')}</div>`);
  html += section('ΗΜΕΡΟΛΟΓΙΟ', calendarHTML());
  body.innerHTML = html;
}

/* ===================== ΕΠΙΤΑΓΕΣ ===================== */
/* Πρόσβαση: social@m-m-m.gr (επιβάλλεται από τους κανόνες RLS στη βάση).

const CHQ_NOTE_MAX = 80;
const CHQ_HINT = 'Ημερομηνία: γράψε 25, 2509 ή +3. Τα 4 ψηφία βοηθούν να εντοπίσεις την επιταγή στο SoftOne.';
const CHQ = { loaded:false, loading:false, setupMissing:false, list:[] };

const chqOpen = () => [...CHQ.list].sort((a,b) => a.due.localeCompare(b.due) || a.last4.localeCompare(b.last4));
const chqDueToday = () => chqOpen().filter(c => c.due === todayIso()).length;   // εκκρεμείς = όλες όσες υπάρχουν
const chqOverdue = () => chqOpen().filter(c => c.due < todayIso()).length;
const chqPreDays = () => Math.min(30, Math.max(0, Number(LOCAL.settings.chqPreDays ?? 2)));
const chqLabel = c => c.last4 ? `επιταγή …${c.last4}` : 'επιταγή';

async function loadCheques(){
  if (CHQ.loading || !LOCAL.session || !canCheques()) return;
  CHQ.loading = true;

    const rows = await api('cheques?select=id,due_date,last4,note&order=due_date.asc');

    if (/HTTP 40[04]|PGRST|42P01|column/.test(String(e && e.message))) CHQ.setupMissing = true;
    else handleError(e, 'Δεν φόρτωσαν οι επιταγές.', true);
  } finally { CHQ.loading = false; if (view === 'chq') renderCheques(); }
}
function chqMutate(apply, request, rollback, msg){
  apply(); if (view === 'chq') renderCheques(); if (view === 'home') renderHome(); renderNav();
  pendingOps++;
  return Promise.resolve().then(request).then(() => setOnline(true))
    .catch(e => { rollback(); if (view === 'chq') renderCheques(); if (view === 'home') renderHome(); renderNav(); handleError(e, msg); })
    .finally(() => { pendingOps--; });
}
function addCheque(){
  const pd = parseDateInput($('cDate').value);
  if (!pd.value){ $('cHint').innerHTML = `<span class="bad">${esc(dateError(pd))}</span>`; $('cDate').focus(); return; }
  const last4 = ($('cLast4').value.match(/\d/g) || []).join('').slice(0, 4);
  const err = createCheque(pd.value, last4, clean($('cNote').value).slice(0, CHQ_NOTE_MAX));
  if (err){ $('cHint').innerHTML = `<span class="bad">${esc(err)}</span>`; return; }
  ['cDate','cLast4','cNote'].forEach(id => $(id).value = '');
  $('cHint').innerHTML = CHQ_HINT; $('cDatePrev').textContent = ''; $('cDate').focus();
}
/* Επιστρέφει μήνυμα λάθους, ή κενό αν καταχωρήθηκε */
function createCheque(due, last4, note){
  if (last4 && last4.length < 4) return 'Γράψε ακριβώς 4 ψηφία, ή άφησέ το κενό.';
  if (last4 && chqOpen().some(c => c.last4 === last4 && c.due === due)) return `Υπάρχει ήδη εκκρεμής επιταγή …${last4} για ${dayLabel(due, true)}.`;
  const c = { id:uuid(), due, last4:last4 || '', note:note || '' };
  chqMutate(
    () => CHQ.list.push(c),
    () => api('cheques', { method:'POST', body:{ id:c.id, due_date:c.due, last4:c.last4 || null, note:c.note || null }, prefer:'return=minimal' }),
    () => { CHQ.list = CHQ.list.filter(x => x.id !== c.id); },
    'Δεν αποθηκεύτηκε η επιταγή.'
  ).then(() => checkReminders());
  toast(`Μπήκε ${esc(chqLabel(c))}, εξόφληση ${esc(dayLabel(c.due, true))}.`);
  return '';
}
/* Εξόφληση = διαγραφή. Μόλις μπει στο SoftOne, δεν έχει λόγο να μένει τίποτα εδώ. */
function clearCheque(id, why){
  const c = CHQ.list.find(x => x.id === id); if (!c) return;
  chqMutate(
    () => { CHQ.list = CHQ.list.filter(x => x.id !== id); },
    () => api(`cheques?id=eq.${id}`, { method:'DELETE', prefer:'return=minimal' }),
    () => { CHQ.list.push(c); },
    'Η διαγραφή δεν αποθηκεύτηκε.'
  );
  toast(`${why === 'cleared' ? 'Εξοφλήθηκε και διαγράφηκε' : 'Διαγράφηκε'}: ${esc(chqLabel(c))}.`, { action:{ label:'Αναίρεση', fn:() => chqMutate(
    () => CHQ.list.push(c),
    () => api('cheques', { method:'POST', body:{ id:c.id, due_date:c.due, last4:c.last4 || null, note:c.note || null }, prefer:'return=minimal' }),
    () => { CHQ.list = CHQ.list.filter(x => x.id !== c.id); },
    'Η αναίρεση δεν αποθηκεύτηκε.'
  ) } });
}
function setChequeDate(id, value){
  const c = CHQ.list.find(x => x.id === id);
  if (!c || !value || value === c.due){ if (view === 'chq') renderCheques(); return; }
  const prev = c.due;
  chqMutate(
    () => { c.due = value; },
    () => api(`cheques?id=eq.${id}`, { method:'PATCH', body:{ due_date:value }, prefer:'return=minimal' }),
    () => { c.due = prev; },
    'Η νέα ημέρα δεν αποθηκεύτηκε.'
  ).then(() => checkReminders());
  toast(`${esc(chqLabel(c))}: εξόφληση ${esc(dayLabel(value, true))}.`);
}
function setChequeNote(id, note){
  const c = CHQ.list.find(x => x.id === id); if (!c) return;
  const val = clean(note).slice(0, CHQ_NOTE_MAX);
  if (val === c.note) return;
  const prev = c.note;
  chqMutate(
    () => { c.note = val; },
    () => api(`cheques?id=eq.${id}`, { method:'PATCH', body:{ note: val || null }, prefer:'return=minimal' }),
    () => { c.note = prev; },
    'Η σημείωση δεν αποθηκεύτηκε.'
  );
}

    ['ΑΡΓΟΤΕΡΑ', open.filter(c => c.due > soon), false]
  ];
  body.innerHTML = groups.filter(g => g[1].length).map(([title, list, bad]) =>

    const next = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d];
    if (!next.length){ toast('Χρειάζεται τουλάχιστον μία εργάσιμη μέρα.'); return; }
    LOCAL.settings.workDays = next.sort(); saveLocal();
    wd.classList.toggle('on', next.includes(d)); wd.setAttribute('aria-pressed', next.includes(d));
    checkReminders(); return;
  }
  const sb = e.target.closest('[data-slots]');
  if (sb){ LOCAL.settings.standSlots = Number(sb.dataset.slots); saveLocal(); renderAll(); return; }
  const kf = e.target.closest('[data-kfilter]');
  if (kf){ kindFilter = kf.dataset.kfilter; $('kFilter').innerHTML = kindSeg(kindFilter, 'kfilter', true); renderMain(); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'give': giveGroup(a.dataset.ids, a); break;
    case 'rm': removeEnvelope(a.dataset.ids); break;
    case 'postpone': setGroupDate(a.dataset.ids, a.dataset.d); break;
    case 'rename': openRename(a.dataset.name); break;
    case 'edit': openEdit(id); break;
    case 'restore': restoreGiven(a.dataset.ids); break;
    case 'set-today': $('aDate').value = fmtDate(todayIso()); previewAddDate(); $('aCust').focus(); break;
    case 'set-tmr': $('aDate').value = fmtDate(tomorrowIso()); previewAddDate(); $('aCust').focus(); break;
    case 'forget': forgetCustomer(a.dataset.key); break;
    case 'notif-on': enableNotifs(); break;
    case 'notif-test': remind('Δοκιμαστική υπενθύμιση', 'Έτσι θα εμφανίζεται η υπενθύμιση για τους φακέλους.', 'test-' + Date.now()); beep(); break;
    case 'notif-close': notifBarClosed = true; renderNotifBar(); break;
    case 'export': exportData(); break;
    case 'print-list': printStand('list'); break;
    case 'print-labels': printStand('labels'); break;
    case 'logout': logout('Αποσυνδέθηκες.'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-date]');
  if (!el) return;
  const r = parseDateInput(el.value);
  if (!r.ok){ toast(esc(dateError(r))); el.value = fmtDate(el.dataset.orig); return; }
  if (r.value === el.dataset.orig){ el.value = fmtDate(r.value); return; }
  el.blur();
  setGroupDate(el.dataset.date, r.value);
});
document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('[data-date]');
  if (el && e.key === 'Enter'){ e.preventDefault(); el.blur(); }
  if (el && e.key === 'Escape'){ el.value = fmtDate(el.dataset.orig); el.blur(); }
});
let lastRefresh = 0;
function tick(){
  checkIdle();
  if (!LOCAL.session) return;
  const t = todayIso();
  if (t !== lastDay){ lastDay = t; pruneFired(); saveLocal(); renderAll(); }
  const every = (live ? REFRESH_SEC : LIVE_SEC) * 1000;
  if (LOCAL.session && Date.now() - lastRefresh > every){ lastRefresh = Date.now(); refresh(); }
  if (LOCAL.session && !ws) wsConnect();
  checkReminders();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastRefresh = 0; tick(); } });
window.addEventListener('online', () => { lastRefresh = 0; wsClose(); tick(); });
window.addEventListener('offline', () => { setOnline(false); wsClose(); });
window.addEventListener('beforeunload', wsClose);

/* ===================== INIT ===================== */
(function initLogo(){
  /* Το ίδιο λογότυπο στην κεφαλίδα και ως εικονίδιο της καρτέλας.
     Αν δεν φορτώσει το πρώτο link, δοκιμάζει το επόμενο και για τα δύο. */
  const img = $('logo'); let i = 0;
  const setIcons = url => { $('favicon').href = url; $('touchIcon').href = url; };
  img.onload = () => setIcons(img.src);
  img.onerror = () => { i++; if (i < LOGO_URLS.length) img.src = LOGO_URLS[i]; else { img.hidden = true; $('logoFb').hidden = false; } };
  img.src = LOGO_URLS[0];
})();
(async function init(){
  await loadLocal();
  checkIdle();
  lastDay = todayIso();
  pruneFired();
  if (LOCAL.cache){ DB.envelopes = LOCAL.cache.envelopes || []; DB.customers = LOCAL.cache.customers || []; }
  buildMain();
  if (location.hash.replace(/^#\/?/, '')){
    const start = parseHash();
    go(start.v, { sub: start.sub, fromHash:true });
  } else {
    go(LOCAL.session ? homeView() : 'login', { fromHash:true });
  }
  if (LOCAL.session) wsConnect();
  setTimeout(tick, 300);
  setInterval(tick, 10000);
})();
</script>
