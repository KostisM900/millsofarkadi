<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Φάκελοι | Μύλοι Αρκαδίου</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== BRAND TOKENS (ίδια με το εσωτερικό σύστημα / m-m-m.gr) ===== */
:root{
  --white:#FFFFFF; --bg:#FBFBF8; --line:#E8E6DD; --line-2:#F2F1EC;
  --olive:#7D8A4E; --olive-dark:#66713F; --olive-deep:#545E33; --olive-tint:#F1F3E8;
  --wheat:#C6913C; --wheat-dark:#94691F; --wheat-tint:#F8EFDD;
  --red:#A63E3A; --red-tint:#F7E8E7;
  --ink:#3B3B33; --muted:#75746A;
  --radius:10px;
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
[hidden]{display:none!important}

/* ===== HEADER ===== */
.topbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-in{max-width:980px;margin:0 auto;height:66px;padding:0 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit}
.brand img{height:46px;width:auto;max-width:120px;object-fit:contain}
.brand-fallback{width:40px;height:40px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.bt{line-height:1.2}
.bt b{display:block;font-size:14.5px;font-weight:700}
.bt span{font-size:10.5px;letter-spacing:.14em;color:var(--olive-dark);font-weight:700}
.nav{display:flex;gap:2px}
.nav-btn{position:relative;padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;border-radius:6px;display:inline-flex;align-items:center;gap:7px}
.nav-btn:hover,.nav-btn.active{color:var(--olive-dark)}
.nav-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:1px;height:2px;background:var(--olive);border-radius:2px}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;line-height:1}
.save-err{font-size:12px;color:var(--red);font-weight:700}
@media (max-width:600px){
  .topbar-in{height:58px;padding:0 14px;gap:8px}
  .brand img{height:38px}
  .bt{display:none}
  .nav-btn{padding:9px 10px}
}

/* ===== NOTIFICATION BAR ===== */
.notif-bar{background:var(--olive-tint);border-bottom:1px solid #DFE3CF}
.notif-bar.warn{background:var(--wheat-tint);border-bottom-color:#EEDDB9}
.notif-in{max-width:980px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:14px;font-size:13.5px}
.notif-in p{flex:1}

/* ===== LAYOUT ===== */
.main{max-width:980px;margin:0 auto;padding:34px 24px 90px}
@media (max-width:600px){.main{padding:22px 14px 80px}.notif-in{padding:10px 14px}}
.view{display:none}
.view.active{display:block}
.greet{margin-bottom:22px}
.greet h1{font-size:clamp(26px,3.6vw,34px);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.greet p{margin-top:8px;font-size:15.5px}
.greet .date{color:var(--muted)}
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sec-h h2{font-size:13px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h.bad h2{color:var(--red)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.empty{border:1px dashed #D9D6C9;border-radius:var(--radius);padding:22px;color:var(--muted);text-align:center;background:var(--white)}

/* ===== BUTTONS / INPUTS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;font-weight:700;font-size:13.5px;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.btn.primary{background:var(--olive-dark);color:#fff}
.btn.primary:hover{background:var(--olive-deep)}
.btn.ghost{border:1px solid var(--line);background:var(--white)}
.btn.ghost:hover{border-color:var(--olive);color:var(--olive-deep)}
.btn.danger{background:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red);border:1px solid #E9CFCD;background:var(--white)}
.btn.danger-ghost:hover{background:var(--red-tint)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#A9A79B;font-size:19px;line-height:1;flex-shrink:0}
.icon-btn:hover{background:var(--red-tint);color:var(--red)}
.inp{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 11px;font-size:14px;min-width:0}
.inp:focus{border-color:var(--olive);outline:none;box-shadow:0 0 0 3px var(--olive-tint)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;font-weight:700;color:var(--muted)}
.f .inp{width:100%}

/* ===== ΠΡΟΣΘΗΚΗ ===== */
.add-card{padding:18px;margin-bottom:32px}
.add-grid{display:grid;grid-template-columns:1.6fr auto auto;gap:10px;align-items:end}
.when{display:flex;gap:6px;align-items:center}
.when .inp{width:150px}
@media (max-width:760px){.add-grid{grid-template-columns:1fr}.when .inp{flex:1;width:auto}}
.hint{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
.hint b{color:var(--ink)}
.hint .bad{color:var(--red);font-weight:600}

/* ===== ΦΑΚΕΛΟΣ (κάρτα σημερινών) ===== */
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.env{
  position:relative;background:var(--white);border:1px solid var(--line);border-radius:3px 3px 8px 8px;
  padding:70px 18px 18px;display:flex;flex-direction:column;text-align:center;
  box-shadow:0 12px 26px -20px rgba(59,59,51,.5);transition:opacity .2s,transform .2s;
}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:44px;background:var(--wheat-tint);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{
  content:"";position:absolute;left:0;right:0;top:0;height:44px;pointer-events:none;
  background:
    linear-gradient(to top right,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) left top/50% 100% no-repeat,
    linear-gradient(to top left,transparent calc(50% - .8px),rgba(148,105,31,.4) 50%,transparent calc(50% + .8px)) right top/50% 100% no-repeat;
}
.seal{position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);z-index:1;width:36px;height:36px;border-radius:50%;background:var(--olive-dark);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--white),0 0 0 5px var(--line)}
.seal svg{width:17px;height:17px}
.env h3{font-size:16.5px;font-weight:700;line-height:1.3}
.env .since{color:var(--muted);font-size:12.5px;margin:4px 0 16px}
.env .btn{margin-top:auto}
.leaving{opacity:0;transform:translateY(-8px)}

/* ===== ΓΡΑΜΜΕΣ ===== */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.rows.bad{border-color:#EBD3D1;background:#FFFCFB}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;transition:opacity .2s,transform .2s;flex-wrap:wrap}
.row+.row{border-top:1px solid var(--line-2)}
.r-main{flex:1;min-width:170px}
.r-main b{font-weight:700}
.r-main small{display:block;color:var(--muted);font-size:12.5px}
.row input[type=date]{padding:6px 8px;font-size:13px;width:150px}
.given{margin-top:10px}
.given summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);padding:6px 0}
.given summary:hover{color:var(--ink)}
.given .rows{margin-top:8px}

/* ===== ΡΥΘΜΙΣΕΙΣ ===== */
.page-h{margin-bottom:22px}
.page-h h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.set{padding:18px 20px;margin-bottom:14px;max-width:680px}
.set h3{font-size:15px;font-weight:700;margin-bottom:10px}
.set p{color:var(--muted);font-size:13.5px;margin-bottom:12px;max-width:62ch}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.set-row.first{border-top:0;padding-top:4px}
.sr-t{flex:1;min-width:200px}
.sr-t b{display:block;font-weight:600}
.sr-t small{color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;margin-bottom:12px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.state.ok::before{background:var(--olive)}
.state.bad::before{background:var(--red)}
.state.wait::before{background:var(--wheat)}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:#D9D6C9;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--olive-dark)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--olive);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:3px 5px 3px 11px;font-size:12.5px;font-weight:600}
.chip button{width:20px;height:20px;border-radius:50%;color:#A9A79B;line-height:1;font-size:15px}
.chip button:hover{background:var(--red-tint);color:var(--red)}

/* ===== TOASTS ===== */
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:12px 8px 12px 14px;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);animation:tin .2s ease}
.toast.alert{background:var(--white);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--wheat)}
.t-msg{flex:1;padding-top:1px}
.t-act{font-weight:700;color:#E8C27E;padding:2px 6px;white-space:nowrap}
.t-x{opacity:.65;font-size:18px;line-height:1;padding:0 6px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:600px){.toasts{right:12px;left:12px;bottom:12px;width:auto}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.env,.row{transition:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#" data-go="main">
      <img id="logo" alt="Μύλοι Αρκαδίου">
      <span class="brand-fallback" id="logoFb" hidden>ΜΑ</span>
      <span class="bt"><b>Μύλοι Αρκαδίου</b><span>ΦΑΚΕΛΟΙ ΠΕΛΑΤΩΝ</span></span>
    </a>
    <span class="save-err" id="saveErr" hidden>Σφάλμα αποθήκευσης</span>
    <nav class="nav" id="nav" aria-label="Πλοήγηση"></nav>
  </div>
</header>

<div class="notif-bar" id="notifBar" hidden></div>

<main class="main">
  <section class="view" id="view-main"></section>
  <section class="view" id="view-set"></section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<datalist id="custList"></datalist>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* =====================================================================
   Φάκελοι πελατών · Μύλοι Αρκαδίου
   Κρατάει ΜΟΝΟ: όνομα πελάτη, ημέρα παράδοσης, πότε μπήκε / πότε δόθηκε ο φάκελος.
   Κανένα ποσό, αριθμός απόδειξης ή στοιχείο πληρωμής.
   ===================================================================== */
const LOGO_URLS = ['https://m-m-m.gr/wp-content/uploads/2024/04/logo-150.png', 'https://i.imgur.com/oDCFSVE.png'];
const KEY = 'arkadi-fakeloi-v3';
const HISTORY_DAYS = 90;
const DEFAULT_SETTINGS = { userName:'Ζωή', morningTime:'07:30', eveEnabled:true, eveTime:'14:00', sound:true };
const DAYS_FULL = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const MONTHS = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ENV_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';

let DB = { envelopes:[], customers:[], settings:{...DEFAULT_SETTINGS}, fired:{} };
let view = 'main', lastDay = '', notifBarClosed = false;

/* ===================== HELPERS ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayIso = () => iso(new Date());
const tomorrowIso = () => iso(addDays(new Date(),1));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ').replace(/\s+/g,' ').trim();
const clean = s => String(s || '').replace(/\s+/g,' ').trim().slice(0,80);
const toMin = t => { const [h,m] = String(t || '00:00').split(':').map(Number); return (h||0)*60 + (m||0); };
const shortDate = s => { const d = fromIso(s); return `${d.getDate()}/${d.getMonth()+1}`; };
const longDate = s => { const d = fromIso(s); return `${DAYS_FULL[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function dayLabel(s, lower=false){
  if (s === todayIso()) return lower ? 'σήμερα' : 'Σήμερα';
  if (s === tomorrowIso()) return lower ? 'αύριο' : 'Αύριο';
  const d = fromIso(s); return `${DAYS_FULL[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function sinceText(ts){
  const n = Math.max(0, Math.round((fromIso(todayIso()) - fromIso(iso(new Date(ts)))) / 86400000));
  return `Στο stand από ${shortDate(iso(new Date(ts)))}` + (n === 0 ? ' (σήμερα)' : n === 1 ? ' (1 μέρα)' : ` (${n} μέρες)`);
}
const pending = () => DB.envelopes.filter(e => !e.givenAt);
const pendingFor = name => pending().find(e => norm(e.name) === norm(name)) || null;
function rememberCustomer(name){
  if (!DB.customers.some(n => norm(n) === norm(name))){ DB.customers.push(name); DB.customers.sort((a,b) => a.localeCompare(b,'el')); }
}
function tidy(){
  const cutoff = addDays(new Date(), -HISTORY_DAYS).toISOString();
  DB.envelopes = DB.envelopes.filter(e => !e.givenAt || e.givenAt >= cutoff);
  const fcut = iso(addDays(new Date(), -7));
  Object.keys(DB.fired).forEach(k => { if (k.slice(0,10) < fcut) delete DB.fired[k]; });
}

/* ===================== STORAGE =====================
   Μέσα στο Claude: window.storage (προσωπικά δεδομένα).
   Από δικό σας link: αποθήκευση στον browser αυτού του υπολογιστή. */
const HAS_CLAUDE_STORAGE = !!(window.storage && typeof window.storage.get === 'function');
async function loadDB(){
  let raw = null;
  try {
    if (HAS_CLAUDE_STORAGE){ const r = await window.storage.get(KEY, false); raw = r ? r.value : null; }
    else raw = window.localStorage.getItem(KEY);
  } catch(e){ raw = null; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    DB = {
      envelopes: Array.isArray(d.envelopes) ? d.envelopes : [],
      customers: Array.isArray(d.customers) ? d.customers : [],
      settings: {...DEFAULT_SETTINGS, ...(d.settings || {})},
      fired: d.fired && typeof d.fired === 'object' ? d.fired : {}
    };
  } catch(e){ toast('Τα αποθηκευμένα δεδομένα δεν διαβάστηκαν.', {sticky:true}); }
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 250); }
async function persist(){
  try {
    const data = JSON.stringify(DB);
    if (HAS_CLAUDE_STORAGE){ const r = await window.storage.set(KEY, data, false); if (!r) throw new Error('no result'); }
    else window.localStorage.setItem(KEY, data);
    $('saveErr').hidden = true;
  } catch(e){
    $('saveErr').hidden = false;
    toast('Η αποθήκευση απέτυχε. Κατέβασε αντίγραφο από τις Ρυθμίσεις.', {sticky:true});
  }
}

/* ===================== TOASTS ===================== */
function toast(html, {action=null, sticky=false, kind=''} = {}){
  const box = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t-msg">${html}</div>`;
  if (action){
    const b = document.createElement('button'); b.className = 't-act'; b.textContent = action.label;
    b.onclick = () => { action.fn(); el.remove(); };
    el.appendChild(b);
  }
  const x = document.createElement('button'); x.className = 't-x'; x.textContent = '×'; x.setAttribute('aria-label','Κλείσιμο');
  x.onclick = () => el.remove(); el.appendChild(x);
  box.appendChild(el);
  while (box.children.length > 5) box.firstChild.remove();
  if (!sticky) setTimeout(() => el.remove(), 6500);
}

/* ===================== ΕΙΔΟΠΟΙΗΣΕΙΣ ===================== */
const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const notifState = () => ('Notification' in window) ? Notification.permission : 'unsupported';
async function enableNotifs(){
  if (notifState() === 'unsupported'){ toast('Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις υπολογιστή.'); renderAll(); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') toast('Οι ειδοποιήσεις υπολογιστή ενεργοποιήθηκαν.');
    else toast(IN_FRAME ? 'Μέσα στο Claude ο browser δεν επιτρέπει ειδοποιήσεις υπολογιστή. Οι υπενθυμίσεις εμφανίζονται μέσα στη σελίδα.'
                        : 'Οι ειδοποιήσεις δεν επιτράπηκαν. Άλλαξέ το από το εικονίδιο αριστερά της διεύθυνσης.');
  } catch(e){ toast('Ο browser μπλόκαρε το αίτημα για ειδοποιήσεις.'); }
  renderAll();
}
function remind(title, body, tag){
  if (notifState() === 'granted'){
    try {
      const n = new Notification(title, { body, tag, icon: LOGO_URLS[0], requireInteraction: true });
      n.onclick = () => { window.focus(); go('main'); n.close(); };
    } catch(e){}
  }
  toast(`<b>${esc(title)}</b><br>${esc(body)}`, { sticky:true, kind:'alert' });
}
let actx = null;
function beep(){
  if (!DB.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    [[660,0],[880,.18]].forEach(([f,dt]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0+dt);
      g.gain.exponentialRampToValueAtTime(.18, t0+dt+.02);
      g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.35);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+dt); o.stop(t0+dt+.4);
    });
  } catch(e){}
}
document.addEventListener('pointerdown', () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch(e){}
}, { once:true });

/* Κάθε φάκελος ειδοποιεί μία φορά τη μέρα για κάθε περίπτωση:
   day  = παράδοση σήμερα (από την πρωινή ώρα)
   eve  = παράδοση αύριο (από την απογευματινή ώρα)
   miss = η μέρα πέρασε και ο φάκελος είναι ακόμα στο stand (από την πρωινή ώρα) */
function checkReminders(){
  const now = new Date(), t = iso(now), tm = tomorrowIso(), mins = now.getHours()*60 + now.getMinutes(), S = DB.settings;
  const due = [];
  const mark = (kind, env) => { const k = `${t}|${kind}|${env.id}`; if (!DB.fired[k]){ DB.fired[k] = 1; due.push({ kind, env }); } };
  pending().forEach(env => {
    if (!env.date) return;
    if (mins >= toMin(S.morningTime)){ if (env.date === t) mark('day', env); else if (env.date < t) mark('miss', env); }
    if (S.eveEnabled && mins >= toMin(S.eveTime) && env.date === tm) mark('eve', env);
  });
  updateTitle();
  if (!due.length) return;
  save();
  const fire = (kind, one, many) => {
    const list = due.filter(d => d.kind === kind);
    if (!list.length) return;
    if (list.length <= 3) list.forEach(d => { const [a,b] = one(d.env); remind(a, b, `${kind}-${d.env.id}`); });
    else { const [a,b] = many(list); remind(a, b, `${kind}-summary`); }
  };
  fire('day',  e => [`Φάκελος για ${e.name}`, 'Έχει παράδοση σήμερα. Δώσε τον φάκελο στον οδηγό.'],
               l => [`${l.length} φάκελοι φεύγουν σήμερα`, l.map(d => d.env.name).join(', ')]);
  fire('eve',  e => [`Αύριο: φάκελος για ${e.name}`, 'Έχει παράδοση αύριο. Ετοίμασε τον φάκελο από το stand.'],
               l => [`${l.length} φάκελοι για αύριο`, l.map(d => d.env.name).join(', ')]);
  fire('miss', e => [`Ο φάκελος για ${e.name} είναι ακόμα στο stand`, `Η παράδοση ήταν ${dayLabel(e.date, true)}. Αν δόθηκε, πάτα «Δόθηκε». Αλλιώς βάλε νέα ημέρα.`],
               l => [`${l.length} φάκελοι έμειναν στο stand`, l.map(d => d.env.name).join(', ')]);
  beep();
  renderAll();
}

}

function renderMain(){
  const t = todayIso(), tm = tomorrowIso(), now = new Date(), S = DB.settings;
  const byName = (a,b) => a.name.localeCompare(b.name,'el');
  const pend = pending();
  const today = pend.filter(e => e.date === t).sort(byName);
  const missed = pend.filter(e => e.date && e.date < t).sort((a,b) => a.date.localeCompare(b.date));
  const tmr = pend.filter(e => e.date === tm).sort(byName);
  const later = pend.filter(e => e.date && e.date > tm).sort((a,b) => a.date.localeCompare(b.date) || byName(a,b));
  const nodate = pend.filter(e => !e.date).sort((a,b) => a.addedAt.localeCompare(b.addedAt));

  $('hello').textContent = `${now.getHours() < 12 ? 'Καλημέρα' : 'Καλησπέρα'}${S.userName ? ', ' + S.userName : ''}`;
  const sub = !pend.length ? 'Το stand είναι άδειο.'
    : today.length ? `${today.length === 1 ? 'Ένας φάκελος φεύγει' : today.length + ' φάκελοι φεύγουν'} σήμερα.`
    : 'Κανένας φάκελος δεν φεύγει σήμερα.';
  $('sub').innerHTML = `<span class="date">${longDate(t)}.</span> ${sub}`;

  let html = '';
  html += section('ΦΕΥΓΟΥΝ ΣΗΜΕΡΑ', today.length
    ? `<div class="env-grid">${today.map(envCard).join('')}</div>`
    : `<div class="empty">${pend.length ? 'Κανένας φάκελος για σήμερα.' : 'Όταν μπαίνει φάκελος στο stand, γράψε τον πελάτη από πάνω.'}</div>`);
  if (missed.length) html += section('ΕΜΕΙΝΑΝ ΣΤΟ STAND', `<div class="rows bad">${missed.map(e => row(e, `Η παράδοση ήταν ${esc(dayLabel(e.date, true))}. Αν δόθηκε, πάτα «Δόθηκε». Αλλιώς βάλε νέα ημέρα.`, true)).join('')}</div>`, true);
  if (tmr.length) html += section('ΑΥΡΙΟ', `<div class="rows">${tmr.map(e => row(e, sinceText(e.addedAt))).join('')}</div>`);
  if (later.length) html += section('ΕΠΟΜΕΝΕΣ ΜΕΡΕΣ', `<div class="rows">${later.map(e => row(e, `${esc(dayLabel(e.date))}. ${sinceText(e.addedAt)}`)).join('')}</div>`);
  if (nodate.length) html += section('ΧΩΡΙΣ ΗΜΕΡΑ ΠΑΡΑΔΟΣΗΣ', `<div class="rows">${nodate.map(e => row(e, `${sinceText(e.addedAt)}. Βάλε ημέρα για να έρθει υπενθύμιση.`)).join('')}</div>`);

  const recent = DB.envelopes.filter(e => e.givenAt && e.givenAt >= addDays(now, -14).toISOString()).sort((a,b) => b.givenAt.localeCompare(a.givenAt));
  if (recent.length) html += `<details class="given"><summary>Δόθηκαν τις τελευταίες 14 μέρες (${recent.length})</summary>
    <div class="rows">${recent.map(e => `<div class="row"><div class="r-main"><b>${esc(e.name)}</b><small>Δόθηκε ${iso(new Date(e.givenAt)) === t ? 'σήμερα' : shortDate(iso(new Date(e.givenAt)))} στις ${hhmm(e.givenAt)}</small></div>
      <button class="btn ghost sm" data-act="restore" data-id="${e.id}">Επαναφορά στο stand</button></div>`).join('')}</div></details>`;

  if (!DB.envelopes.length) html += `<p class="hint">Θέλεις να δεις πώς δουλεύει; <button class="btn ghost sm" data-act="sample">Δοκιμή με δείγμα</button></p>`;
  const wasOpen = document.querySelector('.given') && document.querySelector('.given').open;
  $('lists').innerHTML = html;
  if (wasOpen && document.querySelector('.given')) document.querySelector('.given').open = true;
}

      if (d.app !== 'fakeloi' || !Array.isArray(d.envelopes)) throw new Error('bad');
      DB.envelopes = d.envelopes.filter(x => x && typeof x.name === 'string' && x.addedAt)

});
let wipeTimer = null;
function wipeAll(btn){
  if (!btn.dataset.armed){
    btn.dataset.armed = '1'; btn.textContent = 'Πάτα ξανά για οριστική διαγραφή'; btn.className = 'btn danger sm';
    clearTimeout(wipeTimer);
    wipeTimer = setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = 'Διαγραφή όλων'; btn.className = 'btn danger-ghost sm'; } }, 4000);
    return;
  }
  clearTimeout(wipeTimer);
  DB.envelopes = []; DB.customers = []; DB.fired = {};
  save(); buildSettings(); renderAll();
  toast('Όλα τα δεδομένα διαγράφηκαν.');
}

/* ===================== ΔΕΙΓΜΑ ===================== */
function loadSample(){
  const d = n => iso(addDays(new Date(), n));
  const mk = (name, date, daysAgo) => ({ id:uid(), name, date, addedAt:addDays(new Date(), -daysAgo).toISOString(), givenAt:null });
  [mk('ΒΕΡΥΚΑΚΗΣ', d(0), 6), mk('ΣΦΑΚΙΑΝΑΚΗΣ', d(0), 3), mk('ΜΑΝΩΛΑΚΗΣ', d(-1), 5),
   mk('ΔΑΜΙΑΝΑΚΗΣ', d(1), 1), mk('ΛΙΝΟΞΙΛΑΚΗΣ', d(4), 2), mk('ΑΡΧΟΝΤΑΚΗΣ', '', 9)]
    .forEach(e => { DB.envelopes.push(e); rememberCustomer(e.name); });
  save(); renderAll();
  toast('Φορτώθηκε δείγμα. Το σβήνεις από τις Ρυθμίσεις.');
  setTimeout(checkReminders, 700);
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act){
    case 'give': giveEnvelope(id, a); break;
    case 'rm': removeEnvelope(id); break;
    case 'restore': restoreEnvelope(id); break;
    case 'set-today': $('aDate').value = todayIso(); $('aCust').focus(); break;
    case 'set-tmr': $('aDate').value = tomorrowIso(); $('aCust').focus(); break;
    case 'forget': { const n = DB.customers[Number(a.dataset.i)]; DB.customers.splice(Number(a.dataset.i), 1); save(); renderAll(); if (n) toast(`Αφαιρέθηκε από τη λίστα: ${esc(n)}.`); break; }
    case 'notif-on': enableNotifs(); break;
    case 'notif-test': remind('Δοκιμαστική υπενθύμιση', 'Έτσι θα εμφανίζεται η υπενθύμιση για τους φακέλους.', 'test-' + Date.now()); beep(); break;
    case 'notif-close': notifBarClosed = true; renderNotifBar(); break;
    case 'sample': loadSample(); break;
    case 'export': exportData(); break;
    case 'import': $('importFile').click(); break;
    case 'wipe': wipeAll(a); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-date]');
  if (el) setDate(el.dataset.date, el.value);
});
function tick(){
  const t = todayIso();
  if (t !== lastDay){ lastDay = t; tidy(); save(); renderAll(); }
  checkReminders();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(); renderAll(); } });

/* ===================== INIT ===================== */
(function initLogo(){
  const img = $('logo'); let i = 0;
  img.onerror = () => { i++; if (i < LOGO_URLS.length) img.src = LOGO_URLS[i]; else { img.hidden = true; $('logoFb').hidden = false; } };
  img.src = LOGO_URLS[0];
})();
(async function init(){
  await loadDB();
  lastDay = todayIso();
  tidy();
  buildMain();
  go('main');
  setTimeout(tick, 600);
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
